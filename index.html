        </>}

        {todosRes.length>0&&<>
          {groupLabel("📋","المهام",todosRes.length)}
          {todosRes.map(t=>(
            <Card key={t.id} style={{marginBottom:6,cursor:"pointer"}} onClick={()=>go({type:"todo"})}>
              <div style={{fontSize:14,fontWeight:700,color:T.text,textDecoration:t.done?"line-through":""}}>{t.done?"✅":"📋"} {renderHL(t.text)}</div>
            </Card>
          ))}
        </>}
      </div>
    </Modal>
  );
}


function LoginScreen({onDirector,onMember,onProducer,onSuperAdmin}) {
  const T=useT();
  const [mode,setMode]=useState("choose");
  const [uname,setUname]=useState("");
  const [pass,setPass]=useState("");
  const [savedUname,setSavedUname]=useState(DIRECTOR_USER_DEFAULT);
  const [savedPass,setSavedPass]=useState(DIRECTOR_PASS_DEFAULT);
  const [memberUser,setMemberUser]=useState("");
  const [projId,setProjId]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const [forgotMsg,setForgotMsg]=useState("");

  useEffect(()=>{
    sb.restoreSession().then(ok=>{ if(ok){ if(sb.isSuperAdmin()) onSuperAdmin(); else onDirector(); } }).catch(()=>{});
  },[]);

  const doForgot=async()=>{
    if(!uname.trim()){setErr("أدخل البريد الإلكتروني");return;}
    setLoading(true);setErr("");
    try{
      await fetch(`${SB_URL}/auth/v1/recover`,{
        method:"POST",headers:{"Content-Type":"application/json","apikey":SB_KEY},
        body:JSON.stringify({email:uname.trim()})
      });
      setForgotMsg("تم إرسال رابط الاستعادة على إيميلك ✓");
    }catch{setErr("خطأ في الإرسال");}
    setLoading(false);
  };

  const doDirector=async()=>{
    if(!uname.trim()||!pass.trim()){setErr("أدخل الإيميل وكلمة السر");return;}
    setLoading(true); setErr("");
    try{
      await sb.signIn(uname.trim(), pass);
      if(sb.isSuperAdmin()) onSuperAdmin();
      else onDirector();
    }catch(e){ setErr("الإيميل أو كلمة السر غير صحيحة ❌"); setPass(""); }
    setLoading(false);
  };

  const doMember=async()=>{
    if(!memberUser.trim()||!projId.trim()){setErr("أدخل الاسم ورقم المشروع");return;}
    setLoading(true);setErr("");
    try{
      // Try short_id first, then UUID
      const q = projId.trim().length < 20
        ? `?short_id=ilike.${encodeURIComponent(projId.trim())}`
        : `?id=eq.${projId.trim()}`;
      const projs = await sb.get("projects", q);
      if(!projs.length){setErr("رقم المشروع غير صحيح");setLoading(false);return;}
      const proj = projs[0];
      const rows = await sb.get("team_members",`?project_id=eq.${proj.id}&username=ilike.${encodeURIComponent(memberUser.trim())}&active=eq.true`);
      if(!rows.length){setErr("لا يوجد عضو بهذا الاسم في المشروع");setLoading(false);return;}
      const member=rows[0];
      // Save session
      const token = uid();
      LS.set("member_session",{token, memberId:member.id, projectId:proj.id, username:member.username});
      if(member.role==="producer") onProducer(member,proj);
      else onMember(member,proj);
    }catch(e){setErr("خطأ في الاتصال");}
    setLoading(false);
  };

  const inp={background:T.card2,border:`1.5px solid ${err?T.warn:T.border}`,borderRadius:12,padding:"12px 14px",
    color:T.text,fontSize:15,outline:"none",width:"100%",fontFamily:"Tajawal,sans-serif",direction:"rtl",transition:"border .15s"};

  if(mode==="choose") return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:T.bg,padding:28,gap:18}}>
      <div style={{textAlign:"center",marginBottom:4,display:"flex",flexDirection:"column",alignItems:"center"}}>
        <div style={{marginBottom:18}}><LogoMway h={56}/></div>
        <div style={{fontSize:24,fontWeight:900,color:T.text}}>أهلاً بك</div>
        <div style={{fontSize:13,color:T.muted,marginTop:4}}>اختر طريقة الدخول</div>
      </div>
      <div style={{width:"100%",maxWidth:330,display:"flex",flexDirection:"column",gap:12}}>
        <div className="press" onClick={()=>{setMode("director");setErr("");}}
          style={{background:`linear-gradient(135deg,${T.accent},${T.accentL})`,borderRadius:22,padding:20,cursor:"pointer",color:"#fff",display:"flex",alignItems:"center",gap:16,boxShadow:`0 6px 28px ${T.accent}44`}}>
          <div style={{width:50,height:50,borderRadius:16,background:"rgba(255,255,255,0.22)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26}}>🎨</div>
          <div><div style={{fontSize:17,fontWeight:800}}>مخرج فني</div><div style={{fontSize:12,opacity:.85}}>دخول باسم المستخدم وكلمة السر</div></div>
        </div>
        <div className="press" onClick={()=>{setMode("member");setErr("");}}
          style={{background:T.card,border:`1.5px solid ${T.border}`,borderRadius:22,padding:20,cursor:"pointer",display:"flex",alignItems:"center",gap:16,
          boxShadow:T.mode==="dark"?"0 4px 16px rgba(0,0,0,.3)":"0 4px 16px rgba(0,0,0,.08)"}}>
          <div style={{width:50,height:50,borderRadius:16,background:T.accent+"18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26}}>🤝</div>
          <div><div style={{fontSize:17,fontWeight:800,color:T.text}}>عضو الفريق / منتج</div><div style={{fontSize:12,color:T.muted}}>اسم المستخدم + رقم المشروع</div></div>
        </div>
      </div>
    </div>
  );

  if(mode==="director") return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:T.bg,padding:28,gap:16}}>
      <button onClick={()=>{setMode("choose");setUname("");setPass("");setErr("");}} style={{position:"absolute",top:20,right:20,background:"none",border:"none",cursor:"pointer"}}><Ic d={I.x} s={22} c={T.muted}/></button>
      <div style={{fontSize:44}}>🎨</div>
      <div style={{fontSize:21,fontWeight:900,color:T.text}}>دخول المخرج الفني</div>
      <div style={{width:"100%",maxWidth:320,display:"flex",flexDirection:"column",gap:12}}>
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          <label style={{fontSize:12,color:T.textS,fontWeight:600}}>البريد الإلكتروني</label>
          <input type="email" value={uname} onChange={e=>setUname(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doDirector()} placeholder="themajdabdullah@gmail.com" autoFocus style={inp}
            onFocus={e=>e.target.style.borderColor=T.accent} onBlur={e=>e.target.style.borderColor=err?T.warn:T.border}/>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          <label style={{fontSize:12,color:T.textS,fontWeight:600}}>كلمة السر</label>
          <input type="password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doDirector()} placeholder="••••••••••" style={inp}
            onFocus={e=>e.target.style.borderColor=T.accent} onBlur={e=>e.target.style.borderColor=err?T.warn:T.border}/>
        </div>
        {err&&<div style={{color:T.warnText,fontSize:13,textAlign:"center",fontWeight:600,background:T.warn+"15",borderRadius:10,padding:"8px 12px"}}>{err}</div>}
        <Btn full onClick={doDirector} disabled={loading} style={{marginTop:4}}>{loading?"جاري الدخول...":<><Ic d={I.check} s={16}/> دخول</>}</Btn>
        <button onClick={()=>{setMode("forgot");setErr("");setForgotMsg("");}}
          style={{background:"none",border:"none",color:T.muted,fontSize:12,cursor:"pointer",textAlign:"center",padding:"6px 0",fontFamily:"Tajawal,sans-serif",width:"100%",marginTop:2}}>
          نسيت كلمة السر؟
        </button>
      </div>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:T.bg,padding:28,gap:18}}>
      <button onClick={()=>{setMode("choose");setErr("");}} style={{position:"absolute",top:20,right:20,background:"none",border:"none",cursor:"pointer"}}><Ic d={I.x} s={22} c={T.muted}/></button>
      <div style={{fontSize:42}}>🤝</div>
      <div style={{fontSize:20,fontWeight:900,color:T.text}}>دخول الفريق</div>
      <div style={{width:"100%",maxWidth:330,display:"flex",flexDirection:"column",gap:14}}>
        <Inp label="اسم المستخدم" value={memberUser} onChange={e=>setMemberUser(e.target.value)} placeholder="مثال: بدر"/>
        <Inp label="رقم المشروع" value={projId} onChange={e=>setProjId(e.target.value)} placeholder="مثال: BDR-X7K2F1" helper="الرقم تعطيه لك المخرجة الفنية"/>
        {err&&<div style={{color:T.warnText,fontSize:13,textAlign:"center",fontWeight:600,background:T.warn+"15",borderRadius:10,padding:"8px 12px"}}>⚠ {err}</div>}
        <Btn full onClick={doMember} disabled={loading}>{loading?"جاري التحقق...":"دخول →"}</Btn>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   MEMBER ONBOARDING (first login)
══════════════════════════════════════ */
function MemberOnboarding({member, onDone}) {
  const T=useT();
  const [step,setStep]=useState(0); // 0=phone, 1=payment, 2=theme
  const [phone,setPhone]=useState(member.phone||"");
  const [payMethod,setPayMethod]=useState("bank");
  const [payBank,setPayBank]=useState("");
  const [payIban,setPayIban]=useState("");
  const [payAccount,setPayAccount]=useState("");
  const [payStcNum,setPayStcNum]=useState("");
  const [payStcName,setPayStcName]=useState("");
  const [payOther,setPayOther]=useState("");
  const [memberTheme,setMemberTheme]=useState("mway_dark");
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState("");

  const nextStep=async()=>{
    if(step===0){
      if(!phone.trim()){setErr("رقم الجوال مطلوب");return;}
      if(!/^05\d{8}$/.test(phone.trim())){setErr("أدخل رقم جوال صحيح (05XXXXXXXX)");return;}
      setErr("");setStep(1);
    } else if(step===1){
      if(payMethod==="bank"&&!payIban.trim()){setErr("IBAN مطلوب");return;}
      if(payMethod==="stc"&&!payStcNum.trim()){setErr("رقم STC Pay مطلوب");return;}
      setErr("");setStep(2);
    } else {
      // Save all
      setSaving(true);
      try{
        await sb.patch("team_members", member.id, {
          phone:phone.trim(), phone_set:true,
          payment_method:payMethod, payment_bank_name:payBank,
          payment_iban:payIban, payment_account:payAccount,
          payment_stc:payStcNum, payment_stc_name:payStcName,
          payment_other:payOther,
          payment_cash_approved: payMethod==="cash"?false:undefined,
          updated_at: new Date().toISOString(),
        });
        LS.set(`member_theme_${member.id}`, memberTheme);
        onDone({...member, phone:phone.trim(), phone_set:true,
          payment_method:payMethod, memberTheme});
      }catch(e){setErr("خطأ في الحفظ");}
      setSaving(false);
    }
  };

  const steps=["رقم الجوال","طريقة الدفع","الثيم"];

  return (
    <div style={{minHeight:"100vh",background:T.bg,padding:"32px 20px",direction:"rtl"}}>
      {/* progress */}
      <div style={{display:"flex",gap:6,marginBottom:32,justifyContent:"center"}}>
        {steps.map((s,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:28,height:28,borderRadius:999,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,
              background:i<=step?T.accent:T.card2,color:i<=step?"#fff":T.muted,border:`1.5px solid ${i<=step?T.accent:T.border}`}}>
              {i<step?<Ic d={I.check} s={12} c="#fff" sw={2.5}/> : i+1}
            </div>
            <span style={{fontSize:11,color:i===step?T.accent:T.muted,fontWeight:i===step?700:400}}>{s}</span>
            {i<2&&<div style={{width:20,height:2,background:i<step?T.accent:T.border,borderRadius:999}}/>}
          </div>
        ))}
      </div>

      {step===0&&(
        <div style={{maxWidth:340,margin:"0 auto",display:"flex",flexDirection:"column",gap:18}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:42,marginBottom:10}}>📱</div>
            <div style={{fontSize:20,fontWeight:900,color:T.text}}>أهلاً {member.display_name}!</div>
            <div style={{fontSize:13,color:T.muted,marginTop:4}}>أدخل رقم جوالك للتواصل مع المخرجة الفنية</div>
          </div>
          <Inp label="رقم الجوال *" type="tel" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="05XXXXXXXX" err={err}/>
          <Btn full onClick={nextStep}>التالي →</Btn>
        </div>
      )}

      {step===1&&(
        <div style={{maxWidth:340,margin:"0 auto",display:"flex",flexDirection:"column",gap:16}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:42,marginBottom:10}}>💳</div>
            <div style={{fontSize:20,fontWeight:900,color:T.text}}>طريقة استلام المبلغ</div>
            <div style={{fontSize:13,color:T.muted,marginTop:4}}>كيف تفضل تستلم العهدة؟</div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {[["bank","🏦","حساب بنكي"],["stc","📱","STC Pay"],["cash","💵","نقد"],["other","✏️","أخرى"]].map(([v,e,l])=>(
              <div key={v} className="press" onClick={()=>setPayMethod(v)}
                style={{padding:"14px 10px",borderRadius:16,border:`2px solid ${payMethod===v?T.accent:T.border}`,
                background:payMethod===v?T.accent+"18":T.card,cursor:"pointer",textAlign:"center"}}>
                <div style={{fontSize:24,marginBottom:4}}>{e}</div>
                <div style={{fontSize:12,fontWeight:700,color:payMethod===v?T.accent:T.text}}>{l}</div>
              </div>
            ))}
          </div>
          {payMethod==="bank"&&(
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <Inp label="اسم البنك" value={payBank} onChange={e=>setPayBank(e.target.value)} placeholder="مثال: الأهلي"/>
              <Inp label="IBAN *" value={payIban} onChange={e=>setPayIban(e.target.value)} placeholder="SA..." err={err}/>
              <Inp label="رقم الحساب" value={payAccount} onChange={e=>setPayAccount(e.target.value)} placeholder="اختياري"/>
            </div>
          )}
          {payMethod==="stc"&&(
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <Inp label="رقم STC Pay *" value={payStcNum} onChange={e=>setPayStcNum(e.target.value)} placeholder="05XXXXXXXX" err={err}/>
              <Inp label="الاسم" value={payStcName} onChange={e=>setPayStcName(e.target.value)} placeholder="الاسم كما يظهر"/>
            </div>
          )}
          {payMethod==="cash"&&(
            <div style={{background:T.warn+"15",borderRadius:14,padding:"12px 14px",fontSize:13,color:T.warnText}}>
              ⚠️ الدفع نقداً يتطلب موافقة المخرجة الفنية قبل صرف أي مبلغ
            </div>
          )}
          {payMethod==="other"&&(
            <Inp label="تفاصيل طريقة الدفع" value={payOther} onChange={e=>setPayOther(e.target.value)} placeholder="اكتب تفاصيل طريقة الدفع المفضلة"/>
          )}
          {err&&<div style={{color:T.warnText,fontSize:13,textAlign:"center",background:T.warn+"15",borderRadius:10,padding:"8px 12px"}}>{err}</div>}
          <Row style={{gap:10}}>
            <Btn variant="ghost" onClick={()=>{setErr("");setStep(0);}} style={{flex:1}}>رجوع</Btn>
            <Btn onClick={nextStep} style={{flex:2}}>التالي →</Btn>
          </Row>
        </div>
      )}

      {step===2&&(
        <div style={{maxWidth:380,margin:"0 auto",display:"flex",flexDirection:"column",gap:16}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:42,marginBottom:10}}>🎨</div>
            <div style={{fontSize:20,fontWeight:900,color:T.text}}>اختر ثيمك</div>
            <div style={{fontSize:13,color:T.muted,marginTop:4}}>ثيمك مستقل عن ثيم المخرجة الفنية</div>
          </div>
          <TC.Provider value={T}>
            <ThemePicker themeId={memberTheme} onTheme={setMemberTheme}/>
          </TC.Provider>
          <Row style={{gap:10,marginTop:8}}>
            <Btn variant="ghost" onClick={()=>setStep(1)} style={{flex:1}}>رجوع</Btn>
            <Btn onClick={nextStep} disabled={saving} style={{flex:2}}>{saving?"جاري الحفظ...":"دخول التطبيق →"}</Btn>
          </Row>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════
   MEMBER APP
══════════════════════════════════════ */
function MemberApp({member:initialMember, project:initialProject, allProjects=[], onLogout}) {
  const [memberThemeId,setMemberThemeId]=useState(()=>LS.get(`member_theme_${initialMember.id}`)||"mway_dark");
  const MT = THEMES[memberThemeId]||THEMES.mway_dark;

  // ── Push notifications (member side) ──
  const [pushPermission,setPushPermission]=useState(typeof Notification!=="undefined"?Notification.permission:"default");
  const [pushSubscribed,setPushSubscribed]=useState(false);
  const [pushBusy,setPushBusy]=useState(false);
  const [pushDismissed,setPushDismissed]=useState(()=>LS.get(`member_push_dismissed_${initialMember.id}`)||false);
  useEffect(()=>{
    if(!pushSupported()) return;
    (async()=>{
      try{
        const reg=await navigator.serviceWorker.ready;
        const sub=await reg.pushManager.getSubscription();
        setPushSubscribed(!!sub);
      }catch{}
    })();
  },[]);
  const enableMemberPush=async()=>{
    if(!pushSupported()){
      alert("متصفحك لا يدعم الإشعارات. تأكد إن التطبيق مثبت من 'Add to Home Screen' وافتحه من الشاشة الرئيسية.");
      return;
    }
    setPushBusy(true);
    let stage="بدء";
    const withTimeout=(p,ms,m)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(m)),ms))]);
    try{
      stage="طلب الإذن";
      let perm=Notification.permission;
      if(perm==="default") perm=await Notification.requestPermission();
      setPushPermission(perm);
      if(perm!=="granted"){
        alert("لازم تسمح بالإشعارات");
        setPushBusy(false);
        return;
      }
      stage="تسجيل Service Worker";
      const reg=await withTimeout(navigator.serviceWorker.register("sw.js"),10000,"فشل تسجيل Service Worker");
      stage="انتظار تفعيل SW";
      await withTimeout(navigator.serviceWorker.ready,10000,"SW لم يُفعّل");
      stage="الاشتراك في الـpush";
      let sub=await reg.pushManager.getSubscription();
      if(!sub){
        sub=await withTimeout(reg.pushManager.subscribe({
          userVisibleOnly:true,
          applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
        }),15000,"فشل الاشتراك");
      }
      stage="حفظ في قاعدة البيانات";
      const j=sub.toJSON();
      const payload={
        user_id:initialMember.id,
        user_role:"member",
        device_label:detectDeviceLabel(),
        endpoint:j.endpoint,
        p256dh_key:(j.keys&&j.keys.p256dh)||"",
        auth_key:(j.keys&&j.keys.auth)||"",
        enabled:true,
        last_used_at:new Date().toISOString(),
      };
      try{
        await withTimeout(sb.post("push_subscriptions",payload),10000,"Supabase POST timeout");
      }catch(err){
        const existing=await sb.get("push_subscriptions",`?endpoint=eq.${encodeURIComponent(j.endpoint)}`);
        if(existing&&existing[0]){
          await sb.patch("push_subscriptions",existing[0].id,{enabled:true,last_used_at:new Date().toISOString(),device_label:detectDeviceLabel(),user_id:initialMember.id,user_role:"member"});
        } else { throw err; }
      }
      setPushSubscribed(true);
      alert("تم تفعيل الإشعارات ✓");
    }catch(err){
      console.error("[member push] failed at:",stage,err);
      alert("علّق في خطوة: \""+stage+"\"\n\nالخطأ: "+(err.message||err));
    }
    setPushBusy(false);
  };
  const dismissPushCard=()=>{
    LS.set(`member_push_dismissed_${initialMember.id}`,true);
    setPushDismissed(true);
  };
  const showPushCard = pushSupported() && !pushSubscribed && !pushDismissed && pushPermission!=="denied";

  const [projects,setProjects]=useState(()=>{
    // Build list: current project + any other projects this member is in
    return [{...initialProject, member:initialMember}, ...allProjects.filter(p=>p.id!==initialProject.id)];
  });
  const [activeProjectId,setActiveProjectId]=useState(initialProject.id);
  const activeProject = projects.find(p=>p.id===activeProjectId)||projects[0];
  const activeMember = activeProject?.member || initialMember;

  const [tab,setTab]=useState("home");
  const [expenses,setExpenses]=useState([]);
  const [transfers,setTransfers]=useState([]);
  const [custodyRequests,setCustodyRequests]=useState([]);
  const [mCustody,setMCustody]=useState(Number(activeMember.custody||0));
  const [showAdd,setShowAdd]=useState(false);
  const [editingExp,setEditingExp]=useState(null);
  const [viewingReceipt,setViewingReceipt]=useState(null);
  const [showCustodyReq,setShowCustodyReq]=useState(false);
  const [toast,setToast]=useState({msg:"",type:"ok"});
  const [saving,setSaving]=useState(false);

  const showToast=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast({msg:"",type:"ok"}),2600);};

  useEffect(()=>{
    const load=async()=>{
      try{
        const [exps,txs,mem,reqs]=await Promise.all([
          sb.get("expenses",`?project_id=eq.${activeProject.id}&member_id=eq.${activeMember.id}&order=created_at.desc`),
          sb.get("custody_transfers",`?member_id=eq.${activeMember.id}&order=transferred_at.desc`),
          sb.get("team_members",`?id=eq.${activeMember.id}`),
          sb.get("custody_requests",`?member_id=eq.${activeMember.id}&order=created_at.desc`),
        ]);
        setExpenses(exps.map(e=>({...e,amount:Number(e.amount||0)})));
        setTransfers(txs.map(t=>({...t,amount:Number(t.amount||0)})));
        if(mem[0]) setMCustody(Number(mem[0].custody||0));
        setCustodyRequests(reqs);
      }catch{}
    };
    load();
  },[activeProjectId]);

  const myPaid   = expenses.filter(e=>e.paid).reduce((s,e)=>s+e.amount,0);
  const myUnpaid = expenses.filter(e=>!e.paid).reduce((s,e)=>s+e.amount,0);
  const over     = myPaid>mCustody;
  const pct      = mCustody>0?(myPaid/mCustody)*100:0;

  const addExpense=async(f)=>{
    setSaving(true);
    try{
      const payload={id:uid(),project_id:activeProject.id,member_id:activeMember.id,
        name:f.name,description:f.description,store:f.store,date:f.date,
        amount:parseFloat(f.amount)||0,type:f.type,paid:false,added_by:activeMember.username,
        receipt_name:f.receipt_name||null,receipt_url:f.receipt_url||null};
      const [row]=await sb.post("expenses",payload);
      await sb.log(activeProject.id,activeMember.username,"add_expense",`${f.name} — ${fmt(parseFloat(f.amount)||0)}`);
      await sb.notify(activeProject.id,"add_expense",activeMember.username,
        `${activeMember.display_name} أضاف مشتريات: ${f.name} (${fmt(parseFloat(f.amount)||0)})`,
        {expense_id:row?.id||payload.id,amount:f.amount});
      setExpenses(prev=>[{...payload,...(row||{}),amount:Number((row||{}).amount||payload.amount)},...prev]);
      setShowAdd(false);
      showToast("تمت الإضافة ✓");
      // Check if custody about to run out (80% warning)
      const newTotal=myPaid+(parseFloat(f.amount)||0);
      if(mCustody>0&&newTotal/mCustody>=0.8&&newTotal/mCustody<1){
        await sb.notify(activeProject.id,"custody_80",activeMember.username,
          `تبقى 80% من عهدة ${activeMember.display_name}`,{member_id:activeMember.id});
      }
      if(mCustody>0&&newTotal>=mCustody){
        await sb.notify(activeProject.id,"custody_empty",activeMember.username,
          `انتهت عهدة ${activeMember.display_name}`,{member_id:activeMember.id});
      }
    }catch{showToast("خطأ في الحفظ","err");}
    setSaving(false);
  };

  const togglePaid=async(id)=>{
    const e=expenses.find(x=>x.id===id); if(!e) return;
    const newPaid=!e.paid;
    setExpenses(prev=>prev.map(x=>x.id===id?{...x,paid:newPaid}:x));
    try{
      await sb.patch("expenses",id,{paid:newPaid});
      await sb.log(activeProject.id,activeMember.username,newPaid?"mark_paid_member":"unmark_paid_member",e.name);
      showToast(newPaid?"✓ تم تسجيل الدفع":"↩ تم إلغاء الدفع");
    }catch{setExpenses(prev=>prev.map(x=>x.id===id?{...x,paid:e.paid}:x)); showToast("خطأ","err");}
  };

  const deleteExpense=async(id,name)=>{
    if(!confirm(`حذف "${name}"؟`)) return;
    try{
      await sb.del("expenses",id);
      await sb.log(activeProject.id,activeMember.username,"delete_expense",name);
      await sb.notify(activeProject.id,"delete_expense",activeMember.username,`${activeMember.display_name} حذف: ${name}`,{});
      setExpenses(prev=>prev.filter(e=>e.id!==id));
      showToast("تم الحذف ✓");
    }catch{showToast("خطأ","err");}
  };
  const editExpense=async(f)=>{
    try{
      await sb.patch("expenses",f.id,{name:f.name,description:f.description,store:f.store,date:f.date,amount:parseFloat(f.amount)||0,type:f.type,receipt_name:f.receipt_name||null,receipt_url:f.receipt_url||null});
      await sb.log(activeProject.id,activeMember.username,"edit_expense",f.name);
      await sb.notify(activeProject.id,"edit_expense",activeMember.username,`${activeMember.display_name} عدّل: ${f.name}`,{});
      setExpenses(prev=>prev.map(e=>e.id===f.id?{...f,amount:parseFloat(f.amount)||0}:e));
      setEditingExp(null); showToast("تم التعديل ✓");
    }catch{showToast("خطأ","err");}
  };
  const requestCustody=async(amount,note)=>{
    try{
      const [row]=await sb.post("custody_requests",{
        id:uid(), project_id:activeProject.id, member_id:activeMember.id,
        amount:parseFloat(amount)||0, note, status:"pending"
      });
      await sb.notify(activeProject.id,"custody_request",activeMember.username,
        `${activeMember.display_name} طلب عهدة إضافية: ${fmt(parseFloat(amount)||0)}`,
        {request_id:row?.id, amount});
      setCustodyRequests(prev=>[{...row,amount:parseFloat(amount)||0},...prev]);
      setShowCustodyReq(false);
      showToast("تم إرسال الطلب للمخرجة الفنية ✓");
    }catch{showToast("خطأ في الإرسال","err");}
  };

  const typeEmoji={purchase:"🛒",service:"🔧",transport:"🚗",other:"📌"};
  const typeLabel={purchase:"مشتريات",service:"خدمة",transport:"مواصلات",other:"أخرى"};
  const payMethodLabel={bank:`🏦 ${activeMember.payment_bank_name||"حساب بنكي"}`,stc:"📱 STC Pay",cash:"💵 نقد",other:"✏️ أخرى"};

  return (
    <TC.Provider value={MT}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800;900&display=swap');
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
        html,body{background:${MT.bg};}
        body{font-family:'Tajawal',sans-serif;direction:rtl;color:${MT.text};overscroll-behavior:none;}
        input,select,textarea,button{font-family:'Tajawal',sans-serif;}
        ::-webkit-scrollbar{width:0;}
        input[type=number]::-webkit-inner-spin-button{opacity:0;}
        .page{animation:fadeUp .22s ease;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .press{transition:transform .12s,opacity .12s;}
        .press:active{transform:scale(0.96)!important;opacity:0.75!important;}
        .card-hover:hover{box-shadow:0 4px 24px ${MT.accent}18!important;}
      `}</style>
      <Toast msg={toast.msg} type={toast.type}/>
      <div style={{background:MT.bg,minHeight:"100vh",maxWidth:480,margin:"0 auto",paddingBottom:80,direction:"rtl"}}>

        {/* HOME */}
        {tab==="home"&&<div className="page" style={{padding:"28px 14px 0"}}>
          <Row style={{justifyContent:"space-between",marginBottom:20}}>
            <div>
              <div style={{fontSize:11,color:MT.accent,letterSpacing:2,fontWeight:700}}>TEAM MEMBER</div>
              <div style={{fontSize:22,fontWeight:900,color:MT.text}}>أهلاً {activeMember.display_name} 👋</div>
            </div>
            <Btn variant="ghost" sm onClick={onLogout} style={{padding:"7px 10px",fontSize:11}}>خروج</Btn>
          </Row>

          {/* Notification enable card — shown until subscribed or dismissed */}
          {showPushCard&&<div style={{background:`linear-gradient(135deg,${MT.accent}22,${MT.accentL}18)`,border:`1.5px solid ${MT.accent}55`,borderRadius:18,padding:"16px 18px",marginBottom:16,position:"relative"}}>
            <Row style={{gap:12,alignItems:"flex-start"}}>
              <div style={{fontSize:32,lineHeight:1}}>🔔</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:15,fontWeight:800,color:MT.text,marginBottom:4}}>فعّل الإشعارات</div>
                <div style={{fontSize:12,color:MT.muted,marginBottom:12,lineHeight:1.6}}>تستلم تنبيه فوري لما تتم الموافقة على طلب عهدتك، أو تتغير عهدتك، أو تقترب من نفادها.</div>
                <Row style={{gap:8}}>
                  <Btn sm onClick={enableMemberPush} disabled={pushBusy} style={{flex:1}}>
                    {pushBusy?"جاري التفعيل...":<><Ic d={I.bell} s={13} c="#fff"/> تفعيل الإشعارات</>}
                  </Btn>
                  <button onClick={dismissPushCard} className="press" style={{background:"transparent",border:`1px solid ${MT.border}`,color:MT.muted,borderRadius:8,padding:"7px 12px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"Tajawal,sans-serif"}}>لاحقاً</button>
                </Row>
              </div>
            </Row>
          </div>}

          {/* Multi-project switcher */}
          {projects.length>1&&(
            <div style={{display:"flex",gap:6,marginBottom:16,overflowX:"auto",paddingBottom:4}}>
              {projects.map(p=>(
                <button key={p.id} className="press" onClick={()=>setActiveProjectId(p.id)}
                  style={{padding:"7px 14px",borderRadius:12,border:`1.5px solid ${activeProjectId===p.id?MT.accent+"66":MT.border}`,
                  background:activeProjectId===p.id?MT.accent+"18":MT.card2,color:activeProjectId===p.id?MT.accent:MT.muted,
                  fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"Tajawal,sans-serif",whiteSpace:"nowrap"}}>
                  {p.name}
                </button>
              ))}
            </div>
          )}

          <div style={{borderRadius:24,padding:20,marginBottom:14,background:over?MT.overCard:MT.okCard,border:`1.5px solid ${over?MT.warn+"44":MT.ok+"44"}`}}>
            <div style={{fontSize:11,color:MT.muted,fontWeight:600,marginBottom:4}}>عهدتي في {activeProject.name}</div>
            <div style={{fontSize:32,fontWeight:900,color:MT.accent,marginBottom:6}}>{fmt(mCustody)}</div>
            <ProgressBar pct={pct} over={over} h={10}/>
            <Row style={{justifyContent:"space-between",marginTop:10}}>
              <span style={{fontSize:12,color:MT.muted}}>مصروف: <b style={{color:over?MT.warnText:MT.okText}}>{fmt(myPaid)}</b></span>
              <span style={{fontSize:12,fontWeight:700,color:over?MT.warnText:MT.okText}}>
                {over?`⚠ تجاوز ${fmt(myPaid-mCustody)}`:`✓ باقي ${fmt(mCustody-myPaid)}`}
              </span>
            </Row>
          </div>

          <Row style={{gap:10,marginBottom:16}}>
            <div style={{flex:1,background:MT.card,border:`1.5px solid ${MT.border}`,borderRadius:16,padding:14}}>
              <div style={{fontSize:11,color:MT.muted,fontWeight:600}}>مدفوع ✓</div>
              <div style={{fontSize:18,fontWeight:800,color:MT.okText,marginTop:4}}>{fmt(myPaid)}</div>
            </div>
            <div style={{flex:1,background:MT.card,border:`1.5px solid ${MT.border}`,borderRadius:16,padding:14}}>
              <div style={{fontSize:11,color:MT.muted,fontWeight:600}}>معلق ⏳</div>
              <div style={{fontSize:18,fontWeight:800,color:MT.warnText,marginTop:4}}>{fmt(myUnpaid)}</div>
            </div>
          </Row>

          <Btn full variant="active" onClick={()=>setShowCustodyReq(true)} style={{marginBottom:14}}>
            <Ic d={I.topup} s={16}/> طلب عهدة إضافية
          </Btn>

          {/* طريقة الدفع */}
          <Card style={{marginBottom:14}}>
            <div style={{fontSize:12,color:MT.muted,fontWeight:600,marginBottom:6}}>طريقة استلام العهدة</div>
            <div style={{fontSize:14,fontWeight:700,color:MT.text}}>{payMethodLabel[activeMember.payment_method]||"غير محددة"}</div>
            {activeMember.payment_method==="bank"&&activeMember.payment_iban&&(
              <div style={{fontSize:11,color:MT.muted,marginTop:4,fontFamily:"monospace"}}>{activeMember.payment_iban}</div>
            )}
            {activeMember.payment_method==="stc"&&activeMember.payment_stc&&(
              <div style={{fontSize:11,color:MT.muted,marginTop:4}}>{activeMember.payment_stc}</div>
            )}
            {activeMember.payment_method==="cash"&&!activeMember.payment_cash_approved&&(
              <div style={{fontSize:11,color:MT.warnText,marginTop:4}}>⏳ في انتظار موافقة المخرجة الفنية</div>
            )}
          </Card>

          {/* Project ID */}
          <Card style={{background:MT.card2}}>
            <Row style={{gap:8}}>
              <Ic d={I.id} s={16} c={MT.accent}/>
              <span style={{fontSize:12,color:MT.textS,fontWeight:600}}>رقم المشروع</span>
            </Row>
            <div style={{fontFamily:"monospace",fontSize:14,color:MT.accent,marginTop:6,fontWeight:700}}>{activeProject.short_id||activeProject.id.slice(0,12)}</div>
          </Card>
        </div>}

        {/* EXPENSES */}
        {tab==="expenses"&&<div className="page" style={{padding:"28px 14px 0"}}>
          <Row style={{justifyContent:"space-between",marginBottom:20}}>
            <div style={{fontSize:20,fontWeight:900,color:MT.text}}>مشترياتي</div>
            <Btn sm onClick={()=>setShowAdd(true)}><Ic d={I.plus} s={14}/> إضافة</Btn>
          </Row>
          {expenses.length===0
            ?<Card style={{textAlign:"center",padding:48}}><div style={{fontSize:42,marginBottom:8}}>🧾</div><div style={{color:MT.muted}}>لا توجد مشتريات بعد</div></Card>
            :sortExpenses(expenses).map(e=>(
            <Card key={e.id} style={{marginBottom:10}}>
              <Row style={{justifyContent:"space-between",marginBottom:6,alignItems:"flex-start"}}>
                <div style={{flex:1}}>
                  <Row style={{gap:6,marginBottom:4,flexWrap:"wrap"}}>
                    <span style={{fontSize:16}}>{typeEmoji[e.type]||"📌"}</span>
                    <span style={{fontWeight:700,color:MT.text}}>{e.name}</span>
                    {e.return_requested&&<Badge label="🔄 طُلب الاسترجاع" color={MT.warnText} bg={MT.warn+"20"}/>}
                    {e.returned&&<Badge label="↩ مُسترجع" color={MT.muted} bg={MT.progressBg}/>}
                  </Row>
                  {e.description&&<div style={{fontSize:12,color:MT.muted}}>{e.description}</div>}
                </div>
                <div style={{fontSize:17,fontWeight:900,color:e.returned?"#888":MT.text}}>{fmt(e.amount)}</div>
              </Row>
              <Row style={{gap:8,fontSize:12,color:MT.muted,marginBottom:8,flexWrap:"wrap"}}>
                {e.store&&<span>🏪 {e.store}</span>}
                <span>📅 {e.date}</span>
                <Badge label={typeLabel[e.type]||e.type} color={MT.accent}/>
              </Row>
              <button className="press" onClick={()=>togglePaid(e.id)}
                style={{width:"100%",background:e.paid?MT.ok+"22":MT.warn+"15",borderRadius:10,padding:"9px 12px",
                fontSize:12,fontWeight:700,color:e.paid?MT.okText:MT.warnText,textAlign:"center",
                border:`1.5px solid ${e.paid?MT.ok+"44":MT.warn+"33"}`,cursor:"pointer",fontFamily:"Tajawal,sans-serif",
                display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                {e.paid?<><span>✓</span><span>تم الدفع — اضغط للإلغاء</span></>:<><span>○</span><span>اضغط لتأكيد الدفع</span></>}
              </button>
              {!e.paid&&<Row style={{gap:6,marginTop:7}}>
                <button className="press" onClick={()=>setEditingExp(e)}
                  style={{flex:1,background:MT.card2,border:`1px solid ${MT.border}`,borderRadius:10,padding:"8px",

function DirectorProjectPage({project,onUpdate,onDelete,onBack,showToast,todos=[],setTodos=()=>{},projectsList=[],audience=[],setAudience=()=>{},invitations=[],setInvitations=()=>{},surveyQuestions=[],setSurveyQuestions=()=>{},surveyResponses=[],setSurveyResponses=()=>{},customInterests=[],customCities=[],autoAdvance=()=>{},savedQuotes=[]}) {
  const T=useT();
  const [subTab,setSubTab]=useState("expenses");
  const [filterPay,setFilterPay]=useState("all");
  const [filterMember,setFilterMember]=useState("all");
  const [showAdd,setShowAdd]=useState(false);
  const [showAddMenu,setShowAddMenu]=useState(false);
  const [showProjTodos,setShowProjTodos]=useState(false);
  const [editingExp,setEditingExp]=useState(null);
  const [showEditProj,setShowEditProj]=useState(false);
  const [showDetails,setShowDetails]=useState(false);
  const [showAddMember,setShowAddMember]=useState(false);
  const [topUpTarget,setTopUpTarget]=useState(null);
  const [activityLog,setActivityLog]=useState([]);
  const [logLoaded,setLogLoaded]=useState(false);
  const [custodyRequests,setCustodyRequests]=useState([]);
  const [saving,setSaving]=useState(false);
  const [viewingReceipt,setViewingReceipt]=useState(null);
  const [viewingMoodboard,setViewingMoodboard]=useState(false);
  const [searchQuery,setSearchQuery]=useState("");
  // ── Drag-to-reorder state ──
  const [drag,setDrag]=useState(null); // { id, originalIndex, startY, currentY, targetIndex, dragging, cardH }
  const pressTimerRef=useRef(null);
  const cardRefs=useRef({});

  const expenses=project.expenses||[];
  const members=project.teamMembers||[];
  const totalPaid=expenses.filter(e=>e.paid&&!e.returned).reduce((s,e)=>s+e.amount,0);
  const totalUnpaid=expenses.filter(e=>!e.paid&&!e.returned).reduce((s,e)=>s+e.amount,0);
  const custody=Number(project.custody||0);
  const over=totalPaid>custody;
  const pct=custody>0?(totalPaid/custody)*100:0;

  useEffect(()=>{
    if((subTab==="log"||subTab==="search")&&!logLoaded){
      sb.get("activity_log",`?project_id=eq.${project.id}&order=created_at.desc&limit=60`)
        .then(r=>{setActivityLog(r);setLogLoaded(true);}).catch(()=>{});
    }
    if(subTab==="team"||subTab==="search"){
      sb.get("custody_requests",`?project_id=eq.${project.id}&status=eq.pending&order=created_at.desc`)
        .then(r=>setCustodyRequests(r)).catch(()=>{});
    }
  },[subTab]);

  let shown=sortExpenses(expenses);
  if(filterPay==="paid")   shown=shown.filter(e=>e.paid&&!e.returned);
  if(filterPay==="unpaid") shown=shown.filter(e=>!e.paid&&!e.returned);
  if(filterPay==="returned")shown=shown.filter(e=>e.returned);
  if(filterMember==="me")  shown=shown.filter(e=>!e.member_id);
  else if(filterMember!=="all") shown=shown.filter(e=>e.member_id===filterMember);

  const mName=id=>{ if(!id) return "أنا"; const m=members.find(x=>x.id===id); return m?m.display_name:"غير معروف"; };
  const typeEmoji={purchase:"🛒",service:"🔧",transport:"🚗",other:"📌"};
  const typeLabel={purchase:"مشتريات",service:"خدمة",transport:"مواصلات",other:"أخرى"};

  const saveExp=async(exp)=>{
    setSaving(true);
    const isNew=!editingExp;
    try{
      const memberId=exp.assignedTo&&exp.assignedTo!=="me"?exp.assignedTo:null;
      if(isNew){
        const [row]=await sb.post("expenses",{id:uid(),project_id:project.id,member_id:memberId,
          name:exp.name,description:exp.description,store:exp.store,date:exp.date||null,
          amount:exp.amount,type:exp.type,paid:exp.paid,added_by:"director",
          receipt_name:exp.receipt_name||null,receipt_url:exp.receipt_url||null});
        await sb.log(project.id,"director","add_expense",`${exp.name} — ${fmt(exp.amount)}`);
        onUpdate({...project,expenses:[...expenses,{...exp,id:row?.id||exp.id,member_id:memberId}]});
        // Auto-advance to active on first expense
        autoAdvance(project.id,"active");
      } else {
        await sb.patch("expenses",exp.id,{name:exp.name,description:exp.description,store:exp.store,
          date:exp.date||null,amount:exp.amount,type:exp.type,paid:exp.paid,member_id:memberId,
          receipt_name:exp.receipt_name||null,receipt_url:exp.receipt_url||null});
        await sb.log(project.id,"director","edit_expense",exp.name);
        onUpdate({...project,expenses:expenses.map(e=>e.id===exp.id?{...exp,member_id:memberId}:e)});
      }
      setShowAdd(false); setEditingExp(null);
    }catch{ showToast("خطأ في الحفظ","err"); }
    setSaving(false);
  };

  // ── Drag-to-reorder handlers ──
  const handleDragPointerDown=(ev,item,index)=>{
    if(ev.pointerType==="mouse"&&ev.button!==0) return;
    // Don't start drag from interactive children (buttons, links)
    const tag=(ev.target.tagName||"").toLowerCase();
    if(tag==="button"||tag==="a"||tag==="input"||tag==="select"||tag==="textarea") return;
    if(ev.target.closest&&ev.target.closest("button,a,input,select,textarea")) return;
    const y=ev.clientY;
    setDrag({id:item.id,originalIndex:index,startY:y,currentY:y,targetIndex:index,dragging:false,cardH:0});
    if(pressTimerRef.current) clearTimeout(pressTimerRef.current);
    pressTimerRef.current=setTimeout(()=>{
      pressTimerRef.current=null;
      const card=cardRefs.current[item.id];
      const ch=card?card.getBoundingClientRect().height+10:96;
      if(navigator.vibrate) try{navigator.vibrate(30);}catch{}
      setDrag(d=>d&&d.id===item.id?{...d,dragging:true,cardH:ch}:d);
    },380);
  };
  const handleDragPointerMove=(ev)=>{
    if(!drag) return;
    const y=ev.clientY;
    if(!drag.dragging){
      if(Math.abs(y-drag.startY)>8){
        if(pressTimerRef.current){clearTimeout(pressTimerRef.current);pressTimerRef.current=null;}
        setDrag(null);
      }
      return;
    }
    ev.preventDefault();
    // Compute target index based on Y position vs each card's midpoint
    const ids=shown.map(s=>s.id);
    let target=drag.originalIndex;
    for(let i=0;i<ids.length;i++){
      if(ids[i]===drag.id) continue;
      const ref=cardRefs.current[ids[i]];
      if(!ref) continue;
      const r=ref.getBoundingClientRect();
      const mid=r.top+r.height/2;
      if(y<mid){target=i>drag.originalIndex?i-1:i;break;}
      target=i>drag.originalIndex?i:i+1;
      if(target>=ids.length) target=ids.length-1;
    }
    if(target<0) target=0;
    if(target>=ids.length) target=ids.length-1;
    setDrag(d=>d?{...d,currentY:y,targetIndex:target}:d);
  };
  const handleDragPointerUp=async()=>{
    if(pressTimerRef.current){clearTimeout(pressTimerRef.current);pressTimerRef.current=null;}
    if(drag&&drag.dragging&&drag.targetIndex!==drag.originalIndex){
      // Build the new visual sequence inside `shown`
      const movedItem=shown[drag.originalIndex];
      const reorderedShown=[...shown];
      reorderedShown.splice(drag.originalIndex,1);
      reorderedShown.splice(drag.targetIndex,0,movedItem);
      // Determine which item should follow `movedItem` (anchor) in the full array
      const nextItem=reorderedShown[drag.targetIndex+1]||null;
      // Build the full new expenses array preserving non-shown items' positions
      const full=[...expenses];
      const fromFullIdx=full.findIndex(e=>e.id===movedItem.id);
      if(fromFullIdx>=0) full.splice(fromFullIdx,1);
      if(nextItem){
        const beforeIdx=full.findIndex(e=>e.id===nextItem.id);
        full.splice(beforeIdx>=0?beforeIdx:full.length,0,movedItem);
      } else {
        full.push(movedItem);
      }
      // Renumber every expense by its new index — keeps everything deterministic
      const updates=full.map((e,idx)=>({...e,display_order:(idx+1)*1000}));
      // Optimistic UI
      onUpdate({...project,expenses:updates});
      showToast("تم الترتيب ✓");
      // Persist (fire-and-forget per row; rollback on first error)
      try{
        await Promise.all(updates.map(u=>sb.patch("expenses",u.id,{display_order:u.display_order})));
      }catch(err){
        onUpdate({...project,expenses:expenses});
        showToast("فشل حفظ الترتيب","err");
      }
    }
    setDrag(null);
  };

  const togglePaid=async(id)=>{
    const e=expenses.find(x=>x.id===id); if(!e) return;
    const newPaid=!e.paid;
    onUpdate({...project,expenses:expenses.map(x=>x.id===id?{...x,paid:newPaid}:x)});
    try{
      await sb.patch("expenses",id,{paid:newPaid});
      await sb.log(project.id,"director",newPaid?"mark_paid":"unmark_paid",e.name);
    }catch{ onUpdate({...project,expenses:expenses.map(x=>x.id===id?{...x,paid:e.paid}:x)}); }
  };

  const toggleReturn=async(id)=>{
    const e=expenses.find(x=>x.id===id); if(!e) return;
    const newReturned=!e.returned;
    onUpdate({...project,expenses:expenses.map(x=>x.id===id?{...x,returned:newReturned,return_requested:false}:x)});
    try{
      await sb.patch("expenses",id,{returned:newReturned,return_requested:false});
      await sb.log(project.id,"director",newReturned?"mark_returned":"unmark_returned",e.name);
      showToast(newReturned?"✓ تم تسجيل الاسترجاع":"↩ تم إلغاء الاسترجاع");
    }catch{ onUpdate({...project,expenses:expenses.map(x=>x.id===id?{...x,returned:e.returned}:x)}); }
  };

  const requestReturn=async(id)=>{
    const e=expenses.find(x=>x.id===id); if(!e) return;
    onUpdate({...project,expenses:expenses.map(x=>x.id===id?{...x,return_requested:true}:x)});
    try{
      await sb.patch("expenses",id,{return_requested:true});
      await sb.log(project.id,"director","request_return",e.name);
      showToast("✓ تم تحديد البند لاسترجاعه");
    }catch{}
  };

  const delExp=async(id)=>{
    if(!confirm("حذف هذا البند؟")) return;
    const e=expenses.find(x=>x.id===id);
    try{
      await sb.del("expenses",id);
      await sb.log(project.id,"director","delete_expense",e?.name||"");
      if(e?.member_id){
        await sb.notify(project.id,"delete_expense","director",
          `تم حذف مشتريات: ${e?.name||""}`,{member_id:e.member_id});
      }
      onUpdate({...project,expenses:expenses.filter(e=>e.id!==id)});
      showToast("تم الحذف");
    }catch{ showToast("خطأ","err"); }
  };

  const addMember=async(f)=>{
    setSaving(true);
    try{
      const [row]=await sb.post("team_members",{id:uid(),project_id:project.id,
        username:f.username,display_name:f.display_name,role:f.role,
        phone:f.phone,daily_calc:f.dailyCalc,daily_total:f.daily_total,custody:f.custody});
      if(f.custody>0){
        await sb.post("custody_transfers",{project_id:project.id,member_id:row.id,
          amount:f.custody,note:"عهدة مبدئية",created_by:"director"});
      }
      await sb.log(project.id,"director","add_member",`${f.display_name} (@${f.username})`);
      onUpdate({...project,teamMembers:[...members,{...f,id:row.id,dailyCalc:f.dailyCalc}]});
      setShowAddMember(false); showToast("تمت إضافة العضو ✓");
      // Auto-advance to active on first team member added
      autoAdvance(project.id,"active");
    }catch{ showToast("خطأ — ربما الاسم مكرر","err"); }
    setSaving(false);
  };

  const doTopUp=async(target, delta, note, transferToMemberId=null, withdrawToDirector=false)=>{
    setSaving(true);
    const newCustody=Number(target.custody||0)+delta;
    try{
      await sb.patch("team_members",target.id,{custody:newCustody});
      await sb.post("custody_transfers",{project_id:project.id,member_id:target.id,amount:delta,note,created_by:"director"});
      await sb.log(project.id,"director",delta>0?"add_custody":"reduce_custody",
        `${target.display_name}: ${delta>0?"+":""}${fmt(delta)}${note?" ("+note+")":""}`);
      let updMembers=members.map(m=>m.id===target.id?{...m,custody:newCustody}:m);
      // Transfer to another member
      if(transferToMemberId&&delta<0){
        const recipient=members.find(m=>m.id===transferToMemberId);
        if(recipient){
          const recNew=Number(recipient.custody||0)+Math.abs(delta);
          await sb.patch("team_members",transferToMemberId,{custody:recNew});
          await sb.post("custody_transfers",{project_id:project.id,member_id:transferToMemberId,
            amount:Math.abs(delta),note:`تحويل من ${target.display_name}`,created_by:"director"});
          updMembers=updMembers.map(m=>m.id===transferToMemberId?{...m,custody:recNew}:m);
        }
      }
      // Withdraw to director custody
      if(withdrawToDirector&&delta<0){
        const newProjCustody=Number(project.custody||0)+Math.abs(delta);
        await sb.patch("projects",project.id,{custody:newProjCustody});
        onUpdate({...project,custody:newProjCustody,teamMembers:updMembers});
      } else {
        onUpdate({...project,teamMembers:updMembers});
      }
      setTopUpTarget(null); showToast(`${delta>0?"تمت إضافة":"تم خصم"} العهدة ✓`);
    }catch{ showToast("خطأ","err"); }
    setSaving(false);
  };

  const approveCustodyReq=async(req)=>{
    const member=members.find(m=>m.id===req.member_id);
    if(!member) return;
    const newCustody=Number(member.custody||0)+Number(req.amount);
    try{
      await sb.patch("custody_requests",req.id,{status:"approved",updated_at:new Date().toISOString()});
      await sb.patch("team_members",member.id,{custody:newCustody});
      await sb.post("custody_transfers",{project_id:project.id,member_id:member.id,
        amount:req.amount,note:`موافقة على طلب عهدة: ${req.note||""}`,created_by:"director"});
      await sb.log(project.id,"director","approve_custody_request",`${member.display_name}: ${fmt(req.amount)}`);
      onUpdate({...project,teamMembers:members.map(m=>m.id===member.id?{...m,custody:newCustody}:m)});
      setCustodyRequests(prev=>prev.filter(r=>r.id!==req.id));
      showToast("تمت الموافقة على الطلب ✓");
    }catch{ showToast("خطأ","err"); }
  };

  const rejectCustodyReq=async(req)=>{
    try{
      await sb.patch("custody_requests",req.id,{status:"rejected",updated_at:new Date().toISOString()});
      setCustodyRequests(prev=>prev.filter(r=>r.id!==req.id));
      showToast("تم رفض الطلب");
    }catch{}
  };

  const deactivateMember=async(id)=>{
    if(!confirm("إخفاء هذا العضو؟ ستبقى بياناته محفوظة.")) return;
    try{
      await sb.patch("team_members",id,{active:false});
      await sb.log(project.id,"director","deactivate_member","");
      onUpdate({...project,teamMembers:members.filter(m=>m.id!==id)});
      showToast("تم إخفاء العضو ✓");
    }catch{}
  };

  const deleteProject=async()=>{
    if(!confirm(`حذف مشروع "${project.name}" نهائياً؟\nسيتم حذف جميع البنود والفريق.`)) return;
    if(!confirm("هل أنت متأكد؟ هذا الإجراء لا يمكن التراجع عنه!")) return;
    try{
      await sb.del("projects",project.id);
      onDelete(project.id);
      showToast("تم حذف المشروع");
    }catch{ showToast("خطأ في الحذف","err"); }
  };

  return (
    <div className="page" style={{background:T.bg,minHeight:"100vh",paddingBottom:20}}>
      {/* Header */}
      <div style={{background:T.navBg,backdropFilter:"blur(16px)",borderBottom:`1.5px solid ${T.border}`,padding:"13px 16px",position:"sticky",top:0,zIndex:50}}>
        <Row style={{justifyContent:"space-between"}}>
          <Btn variant="ghost" sm onClick={onBack} style={{padding:"7px 10px"}}><Ic d={I.back} s={18} c={T.textS}/></Btn>
          <div style={{textAlign:"center",flex:1}}>
            <div style={{fontSize:15,fontWeight:800,color:T.text}}>{project.name}</div>
            <Row style={{gap:5,justifyContent:"center",marginTop:3,flexWrap:"wrap"}}>
              <StatusBadge statusId={project.status||"talk"}/>
              {project.financeStatus&&<StatusBadge statusId={project.financeStatus}/>}
            </Row>
          </div>
          <Row style={{gap:6}}>
            <Btn variant="subtle" sm onClick={()=>setShowDetails(true)} style={{padding:"7px 10px"}} title="تفاصيل المشروع">🔍</Btn>
            <Btn variant="subtle" sm onClick={()=>setShowEditProj(true)} style={{padding:"7px 10px"}}><Ic d={I.edit} s={15} c={T.textS}/></Btn>
            <Btn variant="danger" sm onClick={deleteProject} style={{padding:"7px 10px"}}><Ic d={I.trash} s={15} c={T.warnText}/></Btn>
          </Row>
        </Row>
        <div style={{display:"flex",gap:6,marginTop:10,overflowX:"auto"}}>
          {(project.hostingEnabled?[["expenses","المصروفات",I.list],["team","الفريق",I.users],["guests","الدعوات",I.users],["log","السجل",I.log],["search","البحث",I.search]]:[["expenses","المصروفات",I.list],["team","الفريق",I.users],["log","السجل",I.log],["search","البحث",I.search]]).map(([id,lbl,icon])=>(
            <button key={id} className="press" onClick={()=>setSubTab(id)}
              style={{padding:"7px 14px",borderRadius:12,border:`1.5px solid ${subTab===id?T.accent+"66":T.border}`,
              background:subTab===id?T.accent+"18":T.card2,color:subTab===id?T.accent:T.muted,
              fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"Tajawal,sans-serif",
              display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap"}}>
              <Ic d={icon} s={13} c={subTab===id?T.accent:T.muted}/>{lbl}
              {id==="team"&&custodyRequests.length>0&&<span style={{background:T.warn,color:"#fff",borderRadius:999,fontSize:9,padding:"1px 5px",fontWeight:900}}>{custodyRequests.length}</span>}
            </button>
          ))}
        </div>
      </div>

      <div style={{padding:"14px 14px 80px"}}>
        {/* Budget summary */}
        <div style={{borderRadius:22,padding:18,marginBottom:14,
          background:over?T.overCard:T.okCard,border:`1.5px solid ${over?T.warn+"44":T.ok+"44"}`}}>
          <Row style={{justifyContent:"space-between",marginBottom:10}}>
            <div><div style={{fontSize:11,color:T.muted,fontWeight:600}}>العهدة</div><div style={{fontSize:24,fontWeight:900,color:T.accent}}>{fmt(custody)}</div></div>
            <div style={{textAlign:"left"}}><div style={{fontSize:11,color:T.muted,fontWeight:600}}>المدفوع</div><div style={{fontSize:24,fontWeight:900,color:over?T.warnText:T.okText}}>{fmt(totalPaid)}</div></div>
          </Row>
          <ProgressBar pct={pct} over={over} h={10}/>
          <Row style={{justifyContent:"space-between",marginTop:8}}>
            <span style={{fontSize:11,color:T.muted}}>{Math.round(pct||0)}%</span>
            <span style={{fontSize:12,fontWeight:700,color:over?T.warnText:T.okText}}>
              {over?`⚠ تجاوز ${fmt(totalPaid-custody)}`:`✓ متبقي ${fmt(custody-totalPaid)}`}
            </span>
          </Row>
          <Row style={{justifyContent:"space-between",marginTop:6,fontSize:11,color:T.muted}}>
            <span>الميزانية: <b style={{color:T.accent}}>{fmt(project.budget)}</b></span>
            <span>معلق: <b style={{color:T.warnText}}>{fmt(totalUnpaid)}</b></span>
          </Row>
          {project.moodboardFile&&<div style={{marginTop:10,padding:"10px 14px",background:T.card2,borderRadius:14,border:`1.5px solid ${T.border}`}}>
            <Row style={{justifyContent:"space-between",marginBottom:project.moodboardDesc?6:0}}>
              <span style={{fontSize:12,fontWeight:700,color:T.text}}>🎨 مود بورد المشروع</span>
              <button className="press" onClick={()=>setViewingMoodboard(true)}
                style={{fontSize:11,color:T.accent,background:T.accent+"12",border:`1px solid ${T.accent}33`,borderRadius:8,padding:"3px 10px",cursor:"pointer",fontFamily:"Tajawal,sans-serif",fontWeight:700}}>عرض</button>
            </Row>
            {project.moodboardDesc&&<div style={{fontSize:12,color:T.muted,lineHeight:1.6}}>{project.moodboardDesc}</div>}
          </div>}
        </div>

        {/* EXPENSES TAB */}
        {subTab==="expenses"&&<>
          <div style={{display:"flex",gap:6,marginBottom:8,overflowX:"auto",paddingBottom:4}}>
            <Pill label="الكل" active={filterMember==="all"} onClick={()=>setFilterMember("all")}/>
            <Pill label="أنا" active={filterMember==="me"} colorKey="accentL" onClick={()=>setFilterMember(filterMember==="me"?"all":"me")}/>
            {members.map(m=><Pill key={m.id} label={m.display_name} active={filterMember===m.id} colorKey="warn" onClick={()=>setFilterMember(filterMember===m.id?"all":m.id)}/>)}
          </div>
          <div style={{display:"flex",gap:6,marginBottom:14,overflowX:"auto"}}>
            {[["all",`الكل (${expenses.filter(e=>!e.returned).length})`],["paid",`مدفوعة (${expenses.filter(e=>e.paid&&!e.returned).length})`],
              ["unpaid",`غير مدفوعة (${expenses.filter(e=>!e.paid&&!e.returned).length})`],
              ["returned",`مُسترجعة (${expenses.filter(e=>e.returned).length})`]].map(([v,l])=>(
              <Pill key={v} label={l} active={filterPay===v} onClick={()=>setFilterPay(v)}/>
            ))}
          </div>
          {shown.length===0
            ?<Card style={{textAlign:"center",padding:48}}><div style={{fontSize:40,marginBottom:8}}>🧾</div><div style={{color:T.muted}}>لا توجد بنود</div></Card>
            :shown.map((e,idx)=>{
            const isDraggingMe=drag&&drag.id===e.id&&drag.dragging;
            let transform="translateY(0)";
            if(drag&&drag.dragging){
              if(e.id===drag.id) transform=`translateY(${drag.currentY-drag.startY}px) scale(1.03)`;
              else if(drag.targetIndex>drag.originalIndex&&idx>drag.originalIndex&&idx<=drag.targetIndex) transform=`translateY(-${drag.cardH}px)`;
              else if(drag.targetIndex<drag.originalIndex&&idx>=drag.targetIndex&&idx<drag.originalIndex) transform=`translateY(${drag.cardH}px)`;
            }
            return (
            <div key={e.id}
              ref={el=>{if(el)cardRefs.current[e.id]=el;else delete cardRefs.current[e.id];}}
              onPointerDown={ev=>{try{ev.currentTarget.setPointerCapture(ev.pointerId);}catch{};handleDragPointerDown(ev,e,idx);}}
              onPointerMove={handleDragPointerMove}
              onPointerUp={ev=>{try{ev.currentTarget.releasePointerCapture(ev.pointerId);}catch{};handleDragPointerUp();}}
              onPointerCancel={()=>{if(pressTimerRef.current){clearTimeout(pressTimerRef.current);pressTimerRef.current=null;}setDrag(null);}}
              style={{transform,transition:isDraggingMe?"none":"transform .18s cubic-bezier(0.2,0.8,0.2,1)",touchAction:drag&&drag.dragging?"none":"pan-y",zIndex:isDraggingMe?10:1,position:"relative",borderRadius:14,boxShadow:isDraggingMe?"0 12px 28px rgba(0,0,0,0.35)":"none"}}>
            <Card style={{marginBottom:10,opacity:e.returned?.7:1}}>
              <Row style={{justifyContent:"space-between",marginBottom:6,alignItems:"flex-start"}}>
                <div style={{flex:1,minWidth:0}}>
                  <Row style={{gap:6,marginBottom:4,flexWrap:"wrap"}}>
                    <span style={{fontSize:16}}>{typeEmoji[e.type]||"📌"}</span>
                    <span style={{fontWeight:700,fontSize:14,color:T.text,textDecoration:e.returned?"line-through":""}}>{e.name}</span>
                    {e.return_requested&&!e.returned&&<Badge label="🔄 طُلب استرجاع" color={T.warnText} bg={T.warn+"20"}/>}
                    {e.returned&&<Badge label="↩ مُسترجع" color={T.muted} bg={T.progressBg}/>}
                    {e.returned&&<button className="press" onClick={()=>toggleReturn(e.id)}
                      style={{fontSize:10,color:T.accent,background:T.accent+"12",border:`1px solid ${T.accent}33`,borderRadius:8,padding:"2px 8px",cursor:"pointer",fontFamily:"Tajawal,sans-serif",fontWeight:700}}>إلغاء الاسترجاع</button>}
                  </Row>
                  <Row style={{gap:6,flexWrap:"wrap"}}>
                    <Badge label={typeLabel[e.type]||e.type} color={T.accent}/>
                    <Badge label={`👤 ${mName(e.member_id)}`} color={T.warn}/>
                    {e.added_by&&e.added_by!=="director"&&<Badge label={`أضافه: ${e.added_by}`} color={T.textS}/>}
                    {e.receipt_name&&<Row style={{gap:4,display:"inline-flex"}}>
                      <button className="press" onClick={()=>setViewingReceipt(e)} style={{background:T.accent+"18",border:`1px solid ${T.accent}44`,borderRadius:8,padding:"3px 9px",fontSize:11,color:T.accent,cursor:"pointer",fontFamily:"Tajawal,sans-serif",fontWeight:700,display:"inline-flex",alignItems:"center",gap:4}}><Ic d={I.eye} s={11} c={T.accent}/> فاتورة</button>
                      <button className="press" onClick={()=>{if(confirm("حذف الفاتورة المرفقة؟")){sb.patch("expenses",e.id,{receipt_name:null,receipt_url:null}).then(()=>{updateProject({...project,expenses:project.expenses.map(x=>x.id===e.id?{...x,receipt_name:null,receipt_url:null}:x)});}).catch(()=>{});}}} style={{background:T.warn+"18",border:`1px solid ${T.warn}44`,borderRadius:8,padding:"3px 9px",fontSize:11,color:T.warnText,cursor:"pointer",fontFamily:"Tajawal,sans-serif",fontWeight:700,display:"inline-flex",alignItems:"center",gap:4}}><Ic d={I.trash} s={11} c={T.warnText}/></button>
                    </Row>}
                  </Row>
                  {e.description&&<div style={{fontSize:12,color:T.muted,marginTop:3}}>{e.description}</div>}
                </div>
                <div style={{fontSize:17,fontWeight:900,color:e.returned?"#888":T.text,marginRight:6}}>{fmt(e.amount)}</div>
              </Row>
              <Row style={{gap:6,fontSize:12,color:T.muted,marginBottom:8,flexWrap:"wrap"}}>
                {e.store&&<span>🏪 {e.store}</span>}
                <span>📅 {e.date}</span>
              </Row>
              <Row style={{gap:6,flexWrap:"wrap"}}>
                {!e.returned&&<button className="press" onClick={()=>togglePaid(e.id)}
                  style={{flex:2,padding:"9px 8px",borderRadius:12,border:"none",cursor:"pointer",
                  fontFamily:"Tajawal,sans-serif",fontWeight:700,fontSize:12,display:"flex",
                  alignItems:"center",justifyContent:"center",gap:5,
                  background:e.paid?T.ok+"22":T.warn+"18",color:e.paid?T.okText:T.warnText}}>
                  {e.paid?"✓ مدفوع":"○ اضغط للدفع"}
                </button>}
                {!e.returned&&<Btn variant="subtle" sm onClick={()=>requestReturn(e.id)} style={{padding:"8px 10px"}} title="طلب استرجاع">
                  <Ic d={I.returnIcon} s={14} c={T.textS}/>
                </Btn>}
                {e.return_requested&&!e.returned&&<Btn variant="success" sm onClick={()=>toggleReturn(e.id)} style={{padding:"8px 10px"}}>
                  <Ic d={I.check} s={14} c={T.okText}/>
                </Btn>}
                <Btn variant="subtle" sm onClick={()=>setEditingExp(e)} style={{padding:"8px 10px"}}><Ic d={I.edit} s={14}/></Btn>
                <Btn variant="danger" sm onClick={()=>delExp(e.id)} style={{padding:"8px 10px"}}><Ic d={I.trash} s={14}/></Btn>
              </Row>
            </Card>
            </div>
            );})}
        </>}

        {/* TEAM TAB */}
        {subTab==="team"&&<>
          {/* Project ID */}
          <Card style={{marginBottom:14,background:T.card2}}>
            <Row style={{gap:8,marginBottom:6}}>
              <Ic d={I.id} s={16} c={T.accent}/>
              <span style={{fontSize:13,fontWeight:700,color:T.text}}>رقم المشروع — شاركه مع الفريق</span>
            </Row>
            <div style={{fontFamily:"monospace",fontSize:18,color:T.accent,fontWeight:900,marginBottom:8,letterSpacing:2}}>
              {project.short_id||project.id.slice(0,12)}
            </div>
            <Btn variant="subtle" sm onClick={()=>{navigator.clipboard.writeText(project.short_id||project.id);showToast("تم النسخ ✓");}}>
              <Ic d={I.copy} s={13}/> نسخ الرقم
            </Btn>
          </Card>

          {/* Pending custody requests */}
          {custodyRequests.length>0&&(
            <div style={{marginBottom:16}}>
              <div style={{fontSize:14,fontWeight:700,color:T.text,marginBottom:10}}>⏳ طلبات العهدة المعلقة ({custodyRequests.length})</div>
              {custodyRequests.map(req=>{
                const m=members.find(x=>x.id===req.member_id);
                return (
                  <Card key={req.id} style={{marginBottom:10,border:`1.5px solid ${T.warn}44`,background:T.warn+"08"}}>
                    <Row style={{justifyContent:"space-between",marginBottom:8}}>
                      <div>
                        <div style={{fontSize:14,fontWeight:700,color:T.text}}>{m?.display_name||"عضو"}</div>
                        <div style={{fontSize:13,color:T.accent,fontWeight:800}}>{fmt(req.amount)}</div>
                        {req.note&&<div style={{fontSize:12,color:T.muted,marginTop:3}}>{req.note}</div>}
                      </div>
                      <Row style={{gap:8}}>
                        <Btn variant="success" sm onClick={()=>approveCustodyReq(req)}><Ic d={I.check} s={14} c={T.okText}/></Btn>
                        <Btn variant="danger" sm onClick={()=>rejectCustodyReq(req)}><Ic d={I.x} s={14} c={T.warnText}/></Btn>
                      </Row>
                    </Row>
                  </Card>
                );
              })}
            </div>
          )}

          <Row style={{justifyContent:"space-between",marginBottom:14}}>
            <div style={{fontSize:15,fontWeight:700,color:T.text}}>الفريق ({members.length})</div>
            <Btn sm onClick={()=>setShowAddMember(true)}><Ic d={I.plus} s={14}/> إضافة</Btn>
          </Row>
          {members.length===0
            ?<Card style={{textAlign:"center",padding:36}}><div style={{fontSize:36,marginBottom:8}}>🫂</div><div style={{color:T.muted}}>لا يوجد أعضاء بعد</div></Card>
            :members.map(m=>(
            <div key={m.id} style={{position:"relative",marginBottom:12}}>
              <MemberCard member={m} project={project} onTopUp={setTopUpTarget} onWA={phone=>window.open(waLink(phone),"_blank")}/>
              <button className="press" onClick={()=>deactivateMember(m.id)}
                style={{position:"absolute",top:12,left:12,width:28,height:28,borderRadius:8,
                background:T.warn+"18",border:`1px solid ${T.warn}33`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
                <Ic d={I.x} s={13} c={T.warn}/>
              </button>
            </div>
          ))}
          {members.length>0&&<Card style={{marginTop:6}}>

/* Member Card Component */
function MemberCard({member,project,onTopUp,onWA}) {
  const T=useT();
  const mExp=(project.expenses||[]).filter(e=>e.member_id===member.id&&!e.returned);
  const paid=mExp.filter(e=>e.paid).reduce((s,e)=>s+e.amount,0);
  const custody=Number(member.custody||0);
  const over=paid>custody; const pct=custody>0?(paid/custody)*100:0;
  const payMethodIcons={bank:"🏦",stc:"📱",cash:"💵",other:"✏️"};
  return (
    <Card>
      <Row style={{justifyContent:"space-between",marginBottom:10}}>
        <Row style={{gap:10}}>
          <div style={{width:40,height:40,borderRadius:13,background:T.accent+"18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>🤝</div>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:T.text}}>{member.display_name}</div>
            <div style={{fontSize:11,color:T.muted}}>@{member.username}{member.role==="producer"?" 🎬":""}</div>
            {member.payment_method&&<div style={{fontSize:11,color:T.muted}}>{payMethodIcons[member.payment_method]} {member.payment_bank_name||member.payment_stc||member.payment_method}</div>}
          </div>
        </Row>
        <Row style={{gap:6}}>
          {member.phone&&<button className="press" onClick={()=>onWA(member.phone)}
            style={{width:34,height:34,borderRadius:12,background:"#25D36622",border:"1.5px solid #25D36644",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
            <Ic d={I.wa} s={16} c="#25D366"/>
          </button>}
          <Btn variant="active" sm onClick={()=>onTopUp(member)}><Ic d={I.topup} s={13}/> عهدة</Btn>
        </Row>
      </Row>
      {member.role!=="producer"&&<>
        <Row style={{justifyContent:"space-between",marginBottom:6}}>
          <span style={{fontSize:15,fontWeight:800,color:T.accent}}>{fmt(custody)}</span>
          <span style={{fontSize:12,color:over?T.warnText:T.okText,fontWeight:700}}>
            {over?`⚠ تجاوز ${fmt(paid-custody)}`:`باقي ${fmt(custody-paid)}`}
          </span>
        </Row>
        <ProgressBar pct={pct} over={over} h={7}/>
        <div style={{fontSize:11,color:T.muted,marginTop:6}}>مصروف: {fmt(paid)} · {mExp.length} بند</div>
        {member.daily_total>0&&<div style={{fontSize:11,color:T.accent,marginTop:3}}>يومية: {fmt(member.daily_total)}</div>}
      </>}
      {member.phone&&<div style={{marginTop:8,fontSize:11,color:T.muted}}>📱 {member.phone}</div>}
    </Card>
  );
}

/* Top-Up Modal with transfer/withdraw options */
function TopUpModal({member,members,project,onSave,onClose}) {
  const T=useT();
  const [amount,setAmount]=useState("");
  const [note,setNote]=useState("");
  const [opType,setOpType]=useState("add"); // add | reduce
  const [afterReduce,setAfterReduce]=useState("none"); // none | transfer | withdraw
  const [transferTo,setTransferTo]=useState("");
  const custody=Number(member.custody||0);
  const otherMembers=members.filter(m=>m.id!==member.id&&m.role!=="producer");

  const save=()=>{
    const n=parseFloat(amount)||0; if(!n) return;
    const delta=opType==="add"?n:-n;
    const transferToId=(opType==="reduce"&&afterReduce==="transfer"&&transferTo)?transferTo:null;
    const withdraw=(opType==="reduce"&&afterReduce==="withdraw");
    onSave(member,delta,note,transferToId,withdraw);
  };

  return (
    <Modal title={`عهدة ${member.display_name}`} onClose={onClose}>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <Card style={{background:T.card2,padding:"12px 14px"}}>
          <div style={{fontSize:11,color:T.muted,fontWeight:600,marginBottom:3}}>العهدة الحالية</div>
          <div style={{fontSize:22,fontWeight:900,color:T.accent}}>{fmt(custody)}</div>
        </Card>
        <Row style={{gap:8}}>
          <Pill label="✚ إضافة" active={opType==="add"} colorKey="okText" onClick={()=>setOpType("add")}/>
          <Pill label="↩ خصم" active={opType==="reduce"} colorKey="warnText" onClick={()=>setOpType("reduce")}/>
        </Row>
        <Inp label="المبلغ (ر.س) *" type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0"/>
        <Inp label="ملاحظة (اختياري)" value={note} onChange={e=>setNote(e.target.value)} placeholder="سبب التعديل..."/>
        {opType==="reduce"&&otherMembers.length>0&&(
          <div>
            <div style={{fontSize:12,color:T.textS,fontWeight:600,marginBottom:8}}>ماذا تريدين فعل بالمبلغ المخصوم؟</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {[["none","تجاهل (خصم فقط)"],["transfer","نقل لعضو آخر"],["withdraw","استرداد للعهدة"]].map(([v,l])=>(
                <label key={v} style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",padding:"10px 14px",borderRadius:12,border:`1.5px solid ${afterReduce===v?T.accent+"66":T.border}`,background:afterReduce===v?T.accent+"12":T.card2}}>
                  <div style={{width:18,height:18,borderRadius:999,border:`2px solid ${afterReduce===v?T.accent:T.border}`,background:afterReduce===v?T.accent:"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}
                    onClick={()=>setAfterReduce(v)}>
                    {afterReduce===v&&<div style={{width:8,height:8,borderRadius:999,background:"#fff"}}/>}
                  </div>
                  <span style={{fontSize:13,color:afterReduce===v?T.accent:T.text,fontWeight:afterReduce===v?700:400}} onClick={()=>setAfterReduce(v)}>{l}</span>
                </label>
              ))}
              {afterReduce==="transfer"&&(
                <Sel value={transferTo} onChange={e=>setTransferTo(e.target.value)}>
                  <option value="">— اختر العضو —</option>
                  {otherMembers.map(m=><option key={m.id} value={m.id}>{m.display_name}</option>)}
                </Sel>
              )}
            </div>
          </div>
        )}
        {amount&&<div style={{background:opType==="add"?T.ok+"18":T.warn+"18",borderRadius:12,padding:"10px 14px",fontSize:13,fontWeight:700,color:opType==="add"?T.okText:T.warnText,textAlign:"center"}}>
          ستصبح عهدته: {fmt(custody+(opType==="add"?1:-1)*(parseFloat(amount)||0))}
        </div>}
        <Btn full onClick={save} variant={opType==="add"?"success":"warn"}>
          <Ic d={I.check} s={16}/> {opType==="add"?"إضافة عهدة":"خصم عهدة"}
        </Btn>
      </div>
    </Modal>
  );
}

/* Expense Modal */
function ExpenseModal({project,members,expense,onSave,onClose}) {
  const T=useT();
  const isEdit=!!expense;
  const fileRef=useRef();
  const [f,setF]=useState(expense?{...expense,assignedTo:expense.member_id||"me"}:
    {id:uid(),name:"",description:"",store:"",date:today(),amount:"",assignedTo:"",paid:false,type:"purchase",receipt_name:null,receipt_url:null});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));

/* ══════════════════════════════════════
   PROJECT DETAILS MODAL — lifecycle timeline view
══════════════════════════════════════ */
function ProjectDetailsModal({project,savedQuotes,onClose}){
  const T=useT();
  const hist=Array.isArray(project.stageHistory)?project.stageHistory:[];
  const linkedQuotes=(savedQuotes||[]).filter(q=>q.projectId===project.id);
  const fmtDate=(iso)=>{ try{return new Date(iso).toLocaleDateString("ar-SA",{year:"numeric",month:"long",day:"numeric"});}catch(e){return iso;} };
  const totalDays=totalLifecycleDays(project);
  const currentStage=normalizeLegacyStatus(project.status);

  return (
    <Modal title="🔍 تفاصيل المشروع" onClose={onClose}>
      <div style={{maxHeight:"75vh",overflowY:"auto",padding:"2px"}}>
        {/* Client info */}
        <div style={{background:T.card2,border:`1px solid ${T.border}`,borderRadius:12,padding:"12px 14px",marginBottom:12}}>
          <div style={{fontSize:10,color:T.muted,fontFamily:"'DM Mono',monospace",letterSpacing:"0.14em",marginBottom:6}}>معلومات العميل</div>
          <div style={{fontSize:16,fontWeight:800,color:T.text,marginBottom:4}}>{project.name}</div>
          {project.producer&&<div style={{fontSize:12,color:T.text,marginBottom:4}}>👤 {project.producer}</div>}
          {project.firstContactDate&&<div style={{fontSize:11,color:T.muted}}>📅 التواصل الأول: {fmtDate(project.firstContactDate)}</div>}
        </div>

        {/* Description */}
        {project.description&&(
          <div style={{background:T.accent+"10",border:`1.5px solid ${T.accent}33`,borderRadius:12,padding:"12px 14px",marginBottom:12}}>
            <div style={{fontSize:10,color:T.accent,fontFamily:"'DM Mono',monospace",letterSpacing:"0.14em",marginBottom:6,fontWeight:700}}>📝 وصف المشروع</div>
            <div style={{fontSize:13,color:T.text,lineHeight:1.7,whiteSpace:"pre-wrap"}} dir="auto">{project.description}</div>
          </div>
        )}

        {/* Stage timeline */}
        <div style={{background:T.card,border:`1.5px solid ${T.border}`,borderRadius:14,padding:"14px 16px",marginBottom:12}}>
          <div style={{fontSize:11,color:T.muted,fontFamily:"'DM Mono',monospace",letterSpacing:"0.14em",marginBottom:12,fontWeight:700}}>⏱ تايم لاين المراحل</div>
          {WORK_STAGES.map((s,idx)=>{
            const entered=hist.find(h=>h.stage===s.id);
            const nextEntered=hist.find(h=>{
              const hOrder=STAGE_ORDER[h.stage]||0;
              return hOrder>STAGE_ORDER[s.id];
            });
            const isCurrent=currentStage===s.id;
            const isReached=!!entered;
            let daysHere=0;
            if(entered){
              const endDate=nextEntered?nextEntered.at:(isCurrent?new Date().toISOString():entered.at);
              daysHere=daysBetween(entered.at,endDate);
            }
            return (
              <div key={s.id} style={{display:"flex",gap:12,marginBottom:14,opacity:isReached?1:0.35}}>
                <div style={{position:"relative",width:28,flexShrink:0}}>
                  <div style={{width:28,height:28,borderRadius:"50%",background:isReached?s.color:T.card2,border:`2px solid ${isReached?s.color:T.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>{s.emoji}</div>
                  {idx<WORK_STAGES.length-1&&<div style={{position:"absolute",left:"50%",top:28,width:2,height:36,marginLeft:-1,background:isReached?s.color+"66":T.border}}/>}
                </div>
                <div style={{flex:1,paddingBottom:8}}>
                  <div style={{fontSize:13,fontWeight:800,color:isReached?s.color:T.muted}}>{s.label}{isCurrent&&<span style={{fontSize:9,marginRight:6,background:s.color,color:"#fff",padding:"2px 6px",borderRadius:6,fontFamily:"'DM Mono',monospace",letterSpacing:"0.1em"}}>الحالية</span>}</div>
                  {entered?(
                    <>
                      <div style={{fontSize:11,color:T.muted,marginTop:2}}>📅 دخل: {fmtDate(entered.at)}</div>
                      {daysHere>0&&<div style={{fontSize:11,color:T.textS,marginTop:2,fontFamily:"'DM Mono',monospace"}}>⏱ {daysHere} يوم {isCurrent?"(حتى الآن)":""}</div>}
                      {/* Show linked quotes when we hit the "quoted" stage */}
                      {s.id==="quoted"&&linkedQuotes.length>0&&linkedQuotes.map(q=>{
                        const items=(q.items||[]);
                        const subtotal=items.reduce((sum,it)=>sum+(Number(it.total)||(Number(it.qty)||0)*(Number(it.unitPrice)||0)),0);
                        return (
                          <div key={q.id} style={{background:T.card2,border:`1px solid ${T.border}`,borderRadius:10,padding:"8px 10px",marginTop:6}}>
                            <div style={{fontSize:12,fontWeight:700,color:T.text}}>📄 {q.title||"تسعيرة"}</div>
                            <div style={{fontSize:11,color:T.muted,marginTop:2}}>💰 الإجمالي: {fmt(subtotal)}</div>
                            {q.issueDate&&<div style={{fontSize:10,color:T.muted,marginTop:2,fontFamily:"'DM Mono',monospace"}}>{q.issueDate}</div>}
                          </div>
                        );
                      })}
                    </>
                  ):(
                    <div style={{fontSize:11,color:T.muted,marginTop:2,fontStyle:"italic"}}>لم يصلها بعد</div>
                  )}
                </div>
              </div>
            );
          })}
        </div>

        {/* Total lifecycle */}
        <div style={{background:T.accent+"18",border:`1.5px solid ${T.accent}55`,borderRadius:12,padding:"12px 14px",textAlign:"center"}}>
          <div style={{fontSize:10,color:T.accent,fontFamily:"'DM Mono',monospace",letterSpacing:"0.16em",fontWeight:700,marginBottom:4}}>إجمالي دورة الحياة</div>
          <div style={{fontSize:26,fontWeight:900,color:T.accent}}>{totalDays} <span style={{fontSize:14,fontWeight:700,color:T.muted}}>يوم</span></div>
          <div style={{fontSize:10,color:T.muted,marginTop:4}}>من التواصل الأول {project.status==="done"?"إلى التسليم":"حتى الآن"}</div>
        </div>
      </div>
    </Modal>
  );
}
