function InvitationsTab({project,audience,setAudience,invitations,setInvitations,surveyQuestions,setSurveyQuestions,surveyResponses,setSurveyResponses,customInterests,customCities,showToast,autoAdvance=()=>{}}){
  const T=useT();
  const [pickerOpen,setPickerOpen]=useState(false);
  const [searchText,setSearchText]=useState("");
  const [attendMode,setAttendMode]=useState(false);
  const [guestsSubTab,setGuestsSubTab]=useState("invitees"); // invitees | survey

  const projectInvitations=invitations.filter(i=>i.project_id===project.id);
  const invitedIds=new Set(projectInvitations.map(i=>i.audience_id));
  const invitedList=projectInvitations.map(i=>{
    const person=audience.find(a=>a.id===i.audience_id);
    return {inv:i, person};
  }).filter(x=>x.person);

  const category=EVENT_CATEGORIES.find(c=>c.id===project.eventCategory);
  const attendedCount=projectInvitations.filter(i=>i.attended).length;
  const totalCount=projectInvitations.length;
  const pct=totalCount?Math.round(attendedCount*100/totalCount):0;

  const q=searchText.trim().toLowerCase();
  const matches=(person)=>{
    if(!q) return true;
    return (person.name||"").toLowerCase().includes(q)
      ||(person.instagram||"").toLowerCase().includes(q)
      ||(person.phone||"").includes(searchText)
      ||(person.city||"").toLowerCase().includes(q);
  };
  const filtered=invitedList.filter(x=>matches(x.person));
  const notAttended=filtered.filter(x=>!x.inv.attended);
  const attended=filtered.filter(x=>x.inv.attended);

  const removeInvite=async(invId)=>{
    if(!confirm("إزالة هذا الشخص من قائمة الدعوات؟")) return;
    try{
      await sb.del("event_invitations",invId);
      setInvitations(prev=>prev.filter(x=>x.id!==invId));
      showToast&&showToast("تمت الإزالة ✓");
    }catch(e){ alert("فشل الحذف: "+(e.message||e)); }
  };

  const toggleAttendance=async(invId,current)=>{
    const newVal=!current;
    const now=newVal?new Date().toISOString():null;
    // Optimistic update
    setInvitations(prev=>prev.map(x=>x.id===invId?{...x,attended:newVal,attended_at:now}:x));
    try{
      await sb.patch("event_invitations",invId,{attended:newVal,attended_at:now});
    }catch(e){
      // Revert on failure
      setInvitations(prev=>prev.map(x=>x.id===invId?{...x,attended:current}:x));
      alert("فشل التحديث: "+(e.message||e));
    }
  };

  const addInvitees=async(selectedIds)=>{
    try{
      const rows=[];
      for(const aid of selectedIds){
        if(invitedIds.has(aid)) continue;
        const [created]=await sb.post("event_invitations",{project_id:project.id,audience_id:aid,attended:false});
        rows.push(created);
      }
      setInvitations(prev=>[...prev,...rows]);
      setPickerOpen(false);
      showToast&&showToast(`تمت إضافة ${rows.length} شخص ✓`);
      // Auto-advance to active on first invitee added
      if(rows.length>0) autoAdvance(project.id,"active");

function AudiencePickerModal({audience,excludeIds,customInterests,customCities,onClose,onConfirm}){
  const T=useT();
  const [selected,setSelected]=useState(new Set());
  const [searchText,setSearchText]=useState("");
  const [filterGender,setFilterGender]=useState("");
  const [filterCities,setFilterCities]=useState([]);
  const [filterInterests,setFilterInterests]=useState([]);
  const [showFilters,setShowFilters]=useState(false);

  const allInterests=[...INTEREST_PRESETS,...(customInterests||[])];
  const allCities=[...CITIES_PRESET,...(customCities||[])];

  const available=audience.filter(a=>!excludeIds.has(a.id));
  const filtered=available.filter(a=>{
    if(searchText){
      const q=searchText.toLowerCase();
      if(!((a.name||"").toLowerCase().includes(q)||(a.instagram||"").toLowerCase().includes(q)||(a.phone||"").includes(searchText)||(a.city||"").toLowerCase().includes(q))) return false;
    }
    if(filterGender && a.gender!==filterGender) return false;
    if(filterCities.length && !filterCities.includes(a.city)) return false;
    if(filterInterests.length && !filterInterests.every(t=>(a.interests||[]).includes(t))) return false;
    return true;
  });

  const toggle=(id)=>{
    setSelected(prev=>{
      const n=new Set(prev);
      if(n.has(id)) n.delete(id); else n.add(id);
      return n;
    });
  };
  const selectAllFiltered=()=>setSelected(new Set(filtered.map(a=>a.id)));
  const clearSelection=()=>setSelected(new Set());
  const activeFilterCount=(filterGender?1:0)+filterCities.length+filterInterests.length;

  return (
    <Modal title={`اختيار المدعوين (${selected.size} محدد)`} onClose={onClose}>
      <div style={{maxHeight:"70vh",display:"flex",flexDirection:"column"}}>
        <input value={searchText} onChange={e=>setSearchText(e.target.value)} placeholder="🔍 ابحث..."
          style={{width:"100%",background:T.card2,border:`1px solid ${T.border}`,borderRadius:9,padding:"9px 12px",color:T.text,fontSize:13,outline:"none",fontFamily:"'DM Sans','Tajawal',sans-serif",direction:"rtl",marginBottom:8,boxSizing:"border-box"}}/>

        <Row style={{gap:6,marginBottom:8,alignItems:"center"}}>
          <button className="press" onClick={()=>setShowFilters(!showFilters)}
            style={{background:activeFilterCount?T.accent+"22":"transparent",border:`1px solid ${activeFilterCount?T.accent:T.border}`,color:activeFilterCount?T.accent:T.textS,borderRadius:8,padding:"5px 10px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans','Tajawal',sans-serif"}}>
            ⚙ فلاتر {activeFilterCount?`(${activeFilterCount})`:""}
          </button>
          <div style={{flex:1}}/>
          <button className="press" onClick={selectAllFiltered} disabled={!filtered.length}
            style={{background:"transparent",border:`1px solid ${T.border}`,color:T.textS,borderRadius:8,padding:"5px 10px",fontSize:11,fontWeight:600,cursor:filtered.length?"pointer":"default"}}>اختر الكل ({filtered.length})</button>
          {selected.size>0&&<button className="press" onClick={clearSelection}
            style={{background:"transparent",border:"none",color:T.muted,fontSize:11,cursor:"pointer"}}>مسح</button>}
        </Row>

        {showFilters&&(
          <div style={{background:T.card2,border:`1px solid ${T.border}`,borderRadius:10,padding:"8px 10px",marginBottom:8}}>
            <div style={{fontSize:10,color:T.muted,marginBottom:4,fontWeight:600}}>الجنس</div>
            <Row style={{gap:5,marginBottom:8,flexWrap:"wrap"}}>
              {[["","الكل"],["male","♂"],["female","♀"]].map(([v,l])=>(
                <button key={v||"any"} className="press" onClick={()=>setFilterGender(v)}
                  style={{background:filterGender===v?T.accent+"22":"transparent",border:`1px solid ${filterGender===v?T.accent:T.border}`,color:filterGender===v?T.accent:T.textS,borderRadius:6,padding:"4px 10px",fontSize:11,fontWeight:600,cursor:"pointer"}}>{l}</button>
              ))}
            </Row>
            {allCities.length>0&&<>
              <div style={{fontSize:10,color:T.muted,marginBottom:4,fontWeight:600}}>المدن</div>
              <Row style={{gap:5,marginBottom:8,flexWrap:"wrap"}}>
                {allCities.map(c=>(
                  <button key={c} className="press" onClick={()=>setFilterCities(prev=>prev.includes(c)?prev.filter(x=>x!==c):[...prev,c])}
                    style={{background:filterCities.includes(c)?T.accent+"22":"transparent",border:`1px solid ${filterCities.includes(c)?T.accent:T.border}`,color:filterCities.includes(c)?T.accent:T.textS,borderRadius:6,padding:"4px 8px",fontSize:10,fontWeight:600,cursor:"pointer"}}>{c}</button>
                ))}
              </Row>
            </>}
            {allInterests.length>0&&<>
              <div style={{fontSize:10,color:T.muted,marginBottom:4,fontWeight:600}}>الاهتمامات</div>
              <Row style={{gap:5,flexWrap:"wrap"}}>
                {allInterests.map(i=>(
                  <button key={i} className="press" onClick={()=>setFilterInterests(prev=>prev.includes(i)?prev.filter(x=>x!==i):[...prev,i])}
                    style={{background:filterInterests.includes(i)?T.accent+"22":"transparent",border:`1px solid ${filterInterests.includes(i)?T.accent:T.border}`,color:filterInterests.includes(i)?T.accent:T.textS,borderRadius:6,padding:"4px 8px",fontSize:10,fontWeight:600,cursor:"pointer"}}>{i}</button>
                ))}
              </Row>
            </>}
          </div>
        )}

        <div style={{flex:1,overflowY:"auto",marginBottom:10,maxHeight:280}}>
          {filtered.length===0?(
            <div style={{textAlign:"center",padding:"30px 20px",color:T.muted,fontSize:12}}>
              {available.length===0?"كل الأودينس مدعوون بالفعل":"لا توجد نتائج بهذه الفلاتر"}
            </div>
          ):filtered.map(a=>{
            const isSel=selected.has(a.id);
            return (
              <div key={a.id} className="press" onClick={()=>toggle(a.id)}
                style={{background:isSel?T.accent+"18":T.card2,border:`1px solid ${isSel?T.accent:T.border}`,borderRadius:10,padding:"9px 12px",marginBottom:6,cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:22,height:22,borderRadius:6,border:`2px solid ${isSel?T.accent:T.border}`,background:isSel?T.accent:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  {isSel&&<span style={{color:"#fff",fontSize:14,fontWeight:900,lineHeight:1}}>✓</span>}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:700,color:T.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    {a.gender==="female"?"♀ ":a.gender==="male"?"♂ ":""}{a.name}
                  </div>
                  <div style={{fontSize:10,color:T.muted,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    {[a.city,(a.interests||[]).slice(0,3).join(" · ")].filter(Boolean).join(" · ")||"—"}
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        <Row style={{gap:8}}>
          <Btn onClick={()=>onConfirm([...selected])} disabled={!selected.size} style={{flex:1}}>إضافة {selected.size} شخص</Btn>
          <Btn variant="ghost" onClick={onClose}>إلغاء</Btn>
        </Row>
      </div>
    </Modal>
  );
}
