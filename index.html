// Convert VAPID base64 string to Uint8Array (required by PushManager.subscribe)
function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  const output = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) output[i] = rawData.charCodeAt(i);
  return output;
}

// Detect a friendly device label from user-agent
function detectDeviceLabel() {
  const ua = navigator.userAgent;
  if (/iPhone/.test(ua))  return "iPhone";
  if (/iPad/.test(ua))    return "iPad";
  if (/Macintosh/.test(ua)) return "Mac";
  if (/Android/.test(ua)) return "Android";
  if (/Windows/.test(ua)) return "Windows";
  if (/Linux/.test(ua))   return "Linux";
  return "Unknown device";
}

/* ══════════════════════════════════════
   PDF EXPORT HELPER
   Renders a full HTML document into an off-screen iframe,
   waits for fonts to load, then converts to PDF via html2pdf.
══════════════════════════════════════ */
async function exportAsPDF(html, filename) {
  if (typeof html2pdf === "undefined") {
    alert("مكتبة PDF لم تُحمّل. تحقق من الإنترنت وأعد المحاولة.");
    return;
  }
  const iframe = document.createElement("iframe");
  iframe.style.cssText = "position:fixed;left:-99999px;top:0;width:794px;height:1123px;border:0;visibility:hidden;";
  document.body.appendChild(iframe);
  try {
    iframe.contentDocument.open();
    iframe.contentDocument.write(html);
    iframe.contentDocument.close();
    const body = iframe.contentDocument.body;
    body.style.margin = "0";
    // 1. Wait for fonts (in both iframe and main document — main doc has preloaded Google Fonts)
    try {
      await Promise.race([
        Promise.all([
          iframe.contentDocument.fonts && iframe.contentDocument.fonts.ready ? iframe.contentDocument.fonts.ready : Promise.resolve(),
          document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()
        ]),
        new Promise(r => setTimeout(r, 4000))
      ]);
      // Force iframe to recompute fonts with explicit small wait
      await new Promise(r => setTimeout(r, 300));
    } catch(e) {}
    // 2. Wait for all images to load (or fail) — important for receipts/logos
    const imgs = Array.from(iframe.contentDocument.images || []);
    if (imgs.length) {
      await Promise.all(imgs.map(img => {
        if (img.complete && img.naturalWidth > 0) return Promise.resolve();
        return new Promise(resolve => {
          let done = false;
          const finish = () => { if(!done){done=true;resolve();} };
          img.onload = finish;
          img.onerror = finish;
          setTimeout(finish, 5000); // safety
        });
      }));
    }
    // 3. Layout settle
    await new Promise(r => setTimeout(r, 400));
    // 4. Detect actual background color from body's computed style
    let bgColor = "#FFFFFF";
    try {
      const cs = iframe.contentWindow.getComputedStyle(body);
      const detected = cs.backgroundColor;
      if (detected && detected !== "rgba(0, 0, 0, 0)" && detected !== "transparent") {
        bgColor = detected;
      }
    } catch(e) {}
    // 5. Generate PDF
    await html2pdf().from(body).set({
      margin: 0,
      filename: filename,
      image: { type: "jpeg", quality: 0.96 },
      html2canvas: { scale: 2.5, useCORS: true, logging: false, backgroundColor: bgColor, letterRendering: true, imageTimeout: 15000, allowTaint: false },
      jsPDF: { unit: "mm", format: "a4", orientation: "portrait", compress: true },
      pagebreak: { mode: ["css", "legacy"] }
    }).save();
  } catch (err) {
    console.error("PDF generation failed:", err);
    if (confirm("فشل توليد الـPDF. تحميل كـHTML بدلاً منه؟")) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([html],{type:"text/html"}));
      a.download = filename.replace(/\.pdf$/i, ".html");
      a.click();
    }
  } finally {
    iframe.remove();
  }
}

// Highlight matched substring in a text — returns array of {text, match} segments
const highlightParts = (text, query) => {
  const t = String(text||"");
  const q = String(query||"").trim();
  if(!q) return [{text:t,match:false}];
  const lower = t.toLowerCase();
  const lq = q.toLowerCase();
  const parts = [];
  let i = 0;
  while(i < t.length){
    const idx = lower.indexOf(lq, i);
    if(idx === -1){ parts.push({text:t.slice(i), match:false}); break; }
    if(idx > i) parts.push({text:t.slice(i,idx), match:false});
    parts.push({text:t.slice(idx, idx+q.length), match:true});
    i = idx + q.length;
  }
  return parts;
};
// Stable sort for expenses honoring drag-reorder (display_order) then created_at
const sortExpenses = (arr=[]) => [...arr].sort((a,b)=>{
  const aHas=a.display_order!=null, bHas=b.display_order!=null;
  if(aHas&&bHas) return a.display_order-b.display_order;
  if(aHas) return -1;
  if(bHas) return 1;
  return new Date(a.created_at||0)-new Date(b.created_at||0);
});
// Normalize bullet/numbered notes: "- foo" → "• foo", "1- foo" → "1. foo"
const normalizeBullets = s => (s||"").split("\n").map(line => {
  if (/^[-*]\s+/.test(line)) return line.replace(/^[-*]\s+/, "• ");
  if (/^\d+-\s+/.test(line)) return line.replace(/^(\d+)-\s+/, "$1. ");
  return line;
}).join("\n");
const escapeHtml = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const escapeNote = s => escapeHtml(normalizeBullets(s));

const WORK_STAGES = PROJECT_STATUSES.filter(s=>s.group==="work").sort((a,b)=>a.order-b.order);
const STAGE_ORDER = {talk:1, quoted:2, active:3, done:4};
// Legacy status mapping — helps if any old status shows up unexpectedly
function normalizeLegacyStatus(s){
  const map={pricing:"talk",quote_sent:"quoted",awaiting:"quoted",commissioned:"active",ready:"active",shooting:"active",balancing:"active",archived:"done"};
  return map[s]||s||"talk";
}
// Advance project stage forward only. Never move backward. Append to stage_history.
// Returns { changed: bool, from, to }
async function advanceProjectStage(project, targetStage, sbClient){
  const current = normalizeLegacyStatus(project.status);
  const currentOrder = STAGE_ORDER[current] || 0;
  const targetOrder = STAGE_ORDER[targetStage] || 0;
  if(targetOrder <= currentOrder) return {changed:false, from:current, to:current};
  const now = new Date().toISOString();
  const history = Array.isArray(project.stageHistory) ? project.stageHistory.slice() : [];
  history.push({stage:targetStage, at:now});
  try{
    await sbClient.patch("projects", project.id, {status:targetStage, stage_history:history});
    return {changed:true, from:current, to:targetStage, history:history};
  }catch(e){
    console.error("advanceProjectStage error:", e.message||e);
    return {changed:false, from:current, to:current, error:e};
  }
}
// Compute days-in-current-stage from stage_history
function daysInCurrentStage(project){
  const hist = Array.isArray(project.stageHistory) ? project.stageHistory : [];
  const last = hist.length ? hist[hist.length-1] : null;
  if(!last || !last.at) return 0;
  const then = new Date(last.at);
  const now = new Date();
  return Math.max(0, Math.floor((now - then) / (1000*60*60*24)));
}
// Compute days between two stage-history entries
function daysBetween(a, b){
  if(!a || !b) return 0;
  return Math.max(0, Math.floor((new Date(b) - new Date(a)) / (1000*60*60*24)));
}
// Total project lifecycle days (first entry → now, or last entry if done)
function totalLifecycleDays(project){
  const hist = Array.isArray(project.stageHistory) ? project.stageHistory : [];
  if(!hist.length) return 0;
  const first = hist[0].at;
  const last = project.status === "done" && hist.length > 1
    ? hist[hist.length-1].at
    : new Date().toISOString();
  return daysBetween(first, last);
}

const MOBILE_MAX = 767;
const TABLET_MAX = 1023;

function useViewport(){
  const [w, setW] = useState(typeof window !== "undefined" ? window.innerWidth : 1200);
  useEffect(function(){
    var handler = function(){ setW(window.innerWidth); };
    window.addEventListener("resize", handler);
    return function(){ window.removeEventListener("resize", handler); };
  }, []);
  return {
    width: w,
    isMobile:  w <= MOBILE_MAX,
    isTablet:  w > MOBILE_MAX && w <= TABLET_MAX,
    isDesktop: w > TABLET_MAX
  };
}

function SmartTextarea({label,helper,value,onChange,rows=4,placeholder,style:sx={},...p}) {
  const T=useT();
  const taRef=useRef(null);
  const pendingPosRef=useRef(null);
  useEffect(()=>{
    if(pendingPosRef.current!=null&&taRef.current){
      const pos=pendingPosRef.current;
      taRef.current.setSelectionRange(pos,pos);
      pendingPosRef.current=null;
    }
  },[value]);
  const handleKeyDown=(e)=>{
    if(e.key!=="Enter"||e.shiftKey||e.ctrlKey||e.metaKey) return;
    const ta=e.target;
    const pos=ta.selectionStart;
    const val=ta.value;
    const lineStart=val.lastIndexOf("\n",pos-1)+1;
    const currentLine=val.slice(lineStart,pos);
    // Empty bullet/dash line → exit list (keep newline, drop the prefix)
    if(/^[•\-]\s*$/.test(currentLine)){
      e.preventDefault();
      const newVal=val.slice(0,lineStart)+"\n"+val.slice(pos);
      pendingPosRef.current=lineStart+1;
      onChange({target:{value:newVal}});
      return;
    }
    // Bullet/dash continuation → normalize "-" to "•" on current line, insert "\n• "
    if(/^[•\-]\s+\S/.test(currentLine)){
      e.preventDefault();
      let updated=val;
      let posAdj=pos;
      if(currentLine.startsWith("- ")){
        updated=val.slice(0,lineStart)+"• "+currentLine.slice(2)+val.slice(pos);
      }
      const newVal=updated.slice(0,posAdj)+"\n• "+updated.slice(posAdj);
      pendingPosRef.current=posAdj+3; // \n + "• " (• is 1 char in JS)
      onChange({target:{value:newVal}});
      return;
    }
    // Empty numbered line → exit
    if(/^\d+[-.]\s*$/.test(currentLine)){
      e.preventDefault();
      const newVal=val.slice(0,lineStart)+"\n"+val.slice(pos);
      pendingPosRef.current=lineStart+1;
      onChange({target:{value:newVal}});
      return;
    }
    // Numbered continuation → normalize "N-" to "N.", insert "\n(N+1). "
    const numMatch=currentLine.match(/^(\d+)[-.]\s+\S/);
    if(numMatch){
      e.preventDefault();
      const num=parseInt(numMatch[1],10);
      let updated=val;
      if(/^\d+-\s/.test(currentLine)){
        const fixed=currentLine.replace(/^(\d+)-\s/,"$1. ");
        updated=val.slice(0,lineStart)+fixed+val.slice(pos);
      }
      const prefix="\n"+(num+1)+". ";
      const newVal=updated.slice(0,pos)+prefix+updated.slice(pos);
      pendingPosRef.current=pos+prefix.length;
      onChange({target:{value:newVal}});
      return;
    }
  };

function DailyCalc({value,onChange}) {
  const T=useT();
  const v=value||{dailyRate:"",prepRate:"",prepDays:"",shootDays:"",fixedAmount:""};
  const set=(k,val)=>onChange({...v,[k]:val});
  const useFixed=!!(parseFloat(v.fixedAmount)>0 && !parseFloat(v.dailyRate) && !parseFloat(v.prepRate));
  const sT=(parseFloat(v.dailyRate)||0)*(parseFloat(v.shootDays)||0);
  const pT=(parseFloat(v.prepRate)||0)*(parseFloat(v.prepDays)||0);
  const fixedT=parseFloat(v.fixedAmount)||0;
  const total=fixedT>0&&!sT&&!pT ? fixedT : sT+pT;
  const ns={background:T.bg,border:`1.5px solid ${T.border}`,borderRadius:10,padding:"9px 10px",
    color:T.text,fontSize:13,width:"100%",fontFamily:"Tajawal,sans-serif",direction:"rtl",outline:"none"};
  return (
    <div style={{background:T.bg,borderRadius:14,padding:12,border:`1.5px solid ${T.accent}28`,marginTop:4}}>
      <Row style={{gap:4,marginBottom:10}}>
        <Ic d={I.calc} s={13} c={T.accent}/>
        <span style={{fontSize:11,color:T.accent,fontWeight:700}}>دخلي من المشروع</span>
      </Row>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
        {[["يومية التصوير","dailyRate"],["أيام التصوير","shootDays"],["يومية التحضير","prepRate"],["أيام التحضير","prepDays"]].map(([lbl,key])=>(
          <div key={key}>
            <label style={{fontSize:10,color:T.muted,fontWeight:600,display:"block",marginBottom:4}}>{lbl}</label>
            <input type="number" value={v[key]} onChange={e=>set(key,e.target.value)} placeholder="0" style={ns}
              onFocus={e=>e.target.style.borderColor=T.accent} onBlur={e=>e.target.style.borderColor=T.border}/>
          </div>
        ))}
      </div>
      <div style={{marginBottom:8}}>
        <label style={{fontSize:10,color:T.muted,fontWeight:600,display:"block",marginBottom:4}}>مبلغ ثابت (بدل الأيام)</label>
        <input type="number" value={v.fixedAmount||""} onChange={e=>set("fixedAmount",e.target.value)} placeholder="0 — اتركه فارغاً لو تستخدم الأيام" style={ns}
          onFocus={e=>e.target.style.borderColor=T.accent} onBlur={e=>e.target.style.borderColor=T.border}/>
        <div style={{fontSize:10,color:T.muted,marginTop:3}}>إذا أدخلتِ مبلغ ثابت سيُستخدم بدلاً من حساب الأيام</div>
      </div>
      {total>0&&(
        <div style={{background:T.card,borderRadius:10,padding:"10px 12px"}}>
          {fixedT>0&&!sT&&!pT
            ?<Row style={{justifyContent:"space-between",fontSize:12,marginBottom:3}}><span style={{color:T.muted}}>مبلغ ثابت</span><span style={{fontWeight:700,color:T.text}}>{fmt(fixedT)}</span></Row>
            :<>
              {sT>0&&<Row style={{justifyContent:"space-between",fontSize:12,marginBottom:3}}><span style={{color:T.muted}}>تصوير: {v.dailyRate}×{v.shootDays}ي</span><span style={{fontWeight:700,color:T.text}}>{fmt(sT)}</span></Row>}
              {pT>0&&<Row style={{justifyContent:"space-between",fontSize:12,marginBottom:5}}><span style={{color:T.muted}}>تحضير: {v.prepRate}×{v.prepDays}ي</span><span style={{fontWeight:700,color:T.text}}>{fmt(pT)}</span></Row>}
            </>
          }
          <Divider/>
          <Row style={{justifyContent:"space-between",marginTop:4}}>
            <span style={{fontSize:13,color:T.textS,fontWeight:600}}>دخلي من المشروع</span>
            <span style={{fontSize:18,fontWeight:900,color:T.accent}}>{fmt(total)}</span>
          </Row>
        </div>
      )}
    </div>
  );
}

function ProducerApp({member,project,onLogout}) {
  const T=useT();
  const [expenses,setExpenses]=useState([]);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    sb.get("expenses",`?project_id=eq.${project.id}&order=created_at.desc`)
      .then(r=>setExpenses(r.map(e=>({...e,amount:Number(e.amount||0)}))))
      .catch(()=>{}).finally(()=>setLoading(false));
  },[]);

  const totalPaid=expenses.filter(e=>e.paid&&!e.returned).reduce((s,e)=>s+e.amount,0);
  const totalUnpaid=expenses.filter(e=>!e.paid&&!e.returned).reduce((s,e)=>s+e.amount,0);
  const custody=Number(project.custody||0);
  const over=totalPaid>custody;

function InvConvert({inv,projects,onClose,onDone}) {
  const T=useT();
  const [step,setStep]=useState("choose");
  const [projId,setProjId]=useState("");
  const [confirmed,setConfirmed]=useState(false);
  const [loading,setLoading]=useState(false);

  const items=inv.items.filter(i=>i.name.trim());

  const doAdd=async()=>{
    setLoading(true);
    try{
      for(const item of items){
        await sb.post("expenses",{id:uid(),project_id:projId,member_id:null,
          name:item.name,description:"",store:"",date:item.date||inv.date||today(),
          amount:parseFloat(item.amount)||0,type:item.type||"purchase",
          paid:false,added_by:"director",
          receipt_name:item.file_name||null,receipt_url:item.file_data||null});
      }
      onDone({action:"added",projId});
    }catch(e){alert("خطأ: "+e.message);}
    setLoading(false);
  };

  return(
    <Modal title="تحويل لمشروع" onClose={onClose}>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {step==="choose"&&<>
          <div style={{fontSize:13,color:T.muted,textAlign:"center"}}>كيف تريد تحويل الفاتورة؟</div>
          <Btn full variant="active" onClick={()=>setStep("existing")}>إضافة لمشروع حالي</Btn>
          <Btn full variant="subtle" onClick={()=>setStep("new")}>إنشاء مشروع جديد</Btn>
        </>}
        {step==="existing"&&<>
          <Sel label="اختر المشروع" value={projId} onChange={e=>{setProjId(e.target.value);setConfirmed(false);}}>
            <option value="">— اختر —</option>
            {projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
          </Sel>
          {projId&&!confirmed&&<div style={{background:T.warn+"12",borderRadius:12,padding:"10px 14px",fontSize:13,color:T.warnText}}>⚠ إضافة {items.length} بند لـ "{projects.find(p=>p.id===projId)?.name}" — تأكيد؟</div>}
          <Row style={{gap:8}}>
            <Btn variant="ghost" onClick={()=>setStep("choose")} sm>رجوع</Btn>
            {!confirmed?<Btn full onClick={()=>setConfirmed(true)} disabled={!projId}>تأكيد</Btn>
              :<Btn full variant="success" onClick={doAdd} disabled={loading}>{loading?"جاري...":"نعم، أضف الآن"}</Btn>}
          </Row>
        </>}
        {step==="new"&&<>
          <div style={{background:T.accent+"12",borderRadius:12,padding:"12px 14px",fontSize:13,color:T.muted,lineHeight:1.7}}>
            إنشاء مشروع جديد: <b style={{color:T.text}}>"{inv.title||"مشروع جديد"}"</b><br/>مع {items.length} بند
          </div>
          {!confirmed?<Btn full onClick={()=>setConfirmed(true)}>تأكيد</Btn>
            :<Btn full variant="success" onClick={()=>onDone({action:"new",inv})} disabled={loading}>نعم، أنشئ الآن</Btn>}
          <Btn variant="ghost" onClick={()=>setStep("choose")}>رجوع</Btn>
        </>}
      </div>
    </Modal>
  );
}

      +"*{box-sizing:border-box;margin:0;padding:0;}html{background:#faf6f2;}body{font-family:'Tajawal',sans-serif;background:#faf6f2;color:#2c1f14;padding:20px 16px;direction:rtl;max-width:800px;margin:0 auto;}@media (min-width:600px){body{padding:32px 28px;}}"
      +"[dir=\"ltr\"]{unicode-bidi:isolate;}"
      +"table{width:100%;border-collapse:collapse;}th{background:#faf6f2;padding:9px 10px;font-weight:700;color:#8c7060;border-bottom:1.5px solid #e8ddd0;text-align:right;}"
      +"</style></head><body>"
      +"<div style='background:linear-gradient(135deg,#c97b4b,#e09060);color:#fff;border-radius:16px;padding:22px 26px;margin-bottom:24px;'>"
      +"<div style='margin-bottom:14px;'>"+logoSvgHtml("#ffffff",28)+"</div>"
      +"<div style='font-size:10px;letter-spacing:3px;opacity:.75;margin-bottom:4px;'><span dir='ltr'>Majd Alqurashi</span> · مجد القرشي</div>"
      +"<h1 style='font-size:20px;font-weight:900;margin-bottom:4px;'>فاتورة مشتريات</h1>"
      +"<div style='font-size:14px;font-weight:700;opacity:.95;'>"+(inv.title||"")+"</div>"
      +"<div style='display:flex;gap:20px;margin-top:10px;font-size:12px;opacity:.85;'><span>المنتج: "+(inv.producer||"—")+"</span><span>الشركة: "+(inv.company||"—")+"</span><span>"+(inv.date||"")+"</span></div>"
      +"</div>"
      +bankHtml
      +"<div style='background:#fff;border:1.5px solid #e8ddd0;border-radius:14px;overflow:hidden;margin-bottom:20px;'>"
      +"<table><thead><tr><th>البند</th><th>المبلغ</th><th>النوع</th><th>VAT</th><th>Copy</th><th>التاريخ</th><th>فاتورة</th></tr></thead><tbody>"+rows+"</tbody></table>"
      +"<div style='padding:14px;border-top:1.5px solid #e8ddd0;background:#faf6f2;display:flex;justify-content:space-between;align-items:center;'>"
      +"<span style='font-size:15px;font-weight:700;'>الإجمالي</span><span style='font-size:22px;font-weight:900;color:#c97b4b;'>"+fmt(total)+"</span>"
      +"</div></div>"
      +attachPages
      +"</body></html>";

    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));a.download="فاتورة-"+(inv.title||"مشتريات")+"-"+today()+".html";a.click();
    onClose();
  };

  return(
    <Modal title="تصدير الفاتورة" onClose={onClose}>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div>
          <label style={{fontSize:12,color:T.textS,fontWeight:600,display:"block",marginBottom:8}}>إرفاق حساب بنكي؟</label>
          <Row style={{gap:8}}>
            {[[false,"لا"],[true,"نعم"]].map(([v,l])=>(
              <div key={String(v)} className="press" onClick={()=>setWithBank(v)}
                style={{flex:1,padding:"10px",borderRadius:12,border:"1.5px solid "+(withBank===v?T.accent+"66":T.border),background:withBank===v?T.accent+"18":T.card2,cursor:"pointer",textAlign:"center"}}>
                <div style={{fontSize:13,fontWeight:700,color:withBank===v?T.accent:T.text}}>{l}</div>
              </div>
            ))}
          </Row>
        </div>
        {withBank&&banks.map((b,i)=>(
          <div key={i} className="press" onClick={()=>setBankIdx(i)}
            style={{padding:"10px 14px",borderRadius:12,border:"1.5px solid "+(bankIdx===i?T.accent+"66":T.border),background:bankIdx===i?T.accent+"18":T.card2,cursor:"pointer"}}>
            <Row style={{justifyContent:"space-between"}}>
              <div><div style={{fontSize:13,fontWeight:700,color:T.text}}>🏦 {b.name||"حساب "+(i+1)}</div>
              {b.iban&&<div style={{fontSize:11,color:T.muted,fontFamily:"monospace"}}>{b.iban}</div>}</div>
              {bankIdx===i&&<Ic d={I.check} s={16} c={T.accent}/>}
            </Row>
          </div>
        ))}
        {withBank&&banks.length===0&&<div style={{fontSize:12,color:T.muted,background:T.warn+"10",borderRadius:10,padding:"8px 12px"}}>⚠ أضف حسابات بنكية من الإعدادات أولاً</div>}
        <Btn full onClick={doExport}><Ic d={I.download} s={16}/> تحميل الفاتورة</Btn>
      </div>
    </Modal>
  );
}


/* ══════════════════════════════════════
   QUOTATION SYSTEM — نظام التسعيرات
══════════════════════════════════════ */

var Q_KEY = "artdmajd_quotations_v1";
var QT_KEY = "artdmajd_contact_v1";

function loadContact() {
  try { return JSON.parse(localStorage.getItem(QT_KEY)) || {}; } catch { return {}; }
}
function saveContact(c) {
  try { localStorage.setItem(QT_KEY, JSON.stringify(c)); } catch {}
}
function loadQuotations() {
  try { return JSON.parse(localStorage.getItem(Q_KEY)) || []; } catch { return []; }
}
function saveQuotations(list) {
  try { localStorage.setItem(Q_KEY, JSON.stringify(list)); } catch {}
}

var qNewItem = function() { return {id:uid(), description:"", qty:"1", unitPrice:"", total:0}; };

function QuotationEditor({quotation:init, banks, onSave, onClose, onCreateProject, projects, requestedProjectId}) {
  var T = useT();
  var defContact = loadContact();
  var isNew = !init;

  var [q, setQ] = useState(init || {
    id: uid(),
    title: "",
    issueDate: today(),
    projectId: requestedProjectId || "",
    clientName: "",
    clientCompany: "",
    clientCR: "",
    clientPhone: "",
    clientEmail: "",
    clientLocation: "",
    items: [qNewItem()],
    discountOn: false,
    discountType: "percent",
    discountValue: "",
    taxOn: false,
    payTerms1: "50",
    payTerms2When: "after_delivery",
    bankIdx: 0,
    notes: "",
    status: "draft",
    createdAt: new Date().toISOString(),
  });
  var linkedProject = (projects||[]).find(function(p){return p.id===q.projectId;});
  var [openNotes, setOpenNotes] = useState(function(){return {};});
  var toggleNote = function(id) { setOpenNotes(function(p){var n=Object.assign({},p);n[id]=!n[id];return n;}); };
  var [contact, setContact] = useState(defContact);
  var [toast, setToast] = useState("");
  var [showExport, setShowExport] = useState(false);
  var [qExTheme, setQExTheme] = useState("dark");

  var upd = function(k,v) { setQ(function(p){return Object.assign({},p,{[k]:v});}); };
  var updItem = function(id,k,v) {
    setQ(function(p){
      var items = p.items.map(function(i){
        if(i.id!==id) return i;
        var ni = Object.assign({},i,{[k]:v});
        ni.total = (parseFloat(ni.qty)||0)*(parseFloat(ni.unitPrice)||0);
        return ni;
      });
      return Object.assign({},p,{items:items});
    });
  };
  var addItem = function() { setQ(function(p){return Object.assign({},p,{items:[...p.items,qNewItem()]});}); };
  var delItem = function(id) {
    if(q.items.length<=1) return;
    setQ(function(p){return Object.assign({},p,{items:p.items.filter(function(i){return i.id!==id;})});});
  };

  var subtotal = q.items.reduce(function(s,i){return s+(parseFloat(i.qty)||0)*(parseFloat(i.unitPrice)||0);},0);
  var discountAmt = q.discountOn
    ? (q.discountType==="percent" ? subtotal*(parseFloat(q.discountValue)||0)/100 : (parseFloat(q.discountValue)||0))
    : 0;
  var afterDiscount = subtotal - discountAmt;
  var taxAmt = q.taxOn ? afterDiscount*0.15 : 0;
  var grandTotal = afterDiscount + taxAmt;

  var saveMsg = function() {
    var saved = onSave(q, contact);
    setToast("تم الحفظ ✓");
    setTimeout(function(){setToast("");},2000);
  };

  var inp = {background:T.card2,border:"1px solid "+T.border,borderRadius:8,padding:"8px 10px",color:T.text,fontSize:13,fontFamily:"Tajawal,sans-serif",width:"100%",outline:"none"};

  return (
    <div style={{background:T.bg,minHeight:"100vh",paddingBottom:80}}>
      {/* Header */}
      <div style={{background:T.navBg,borderBottom:"1px solid "+T.border,padding:"12px 14px",position:"sticky",top:0,zIndex:50}}>
        <Row style={{justifyContent:"space-between"}}>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",padding:6}}><Ic d={I.back} s={20} c={T.textS}/></button>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:14,fontWeight:800,color:T.text}}>{q.title||"تسعيرة جديدة"}</div>
            <div style={{fontSize:10,color:T.muted}}>مسودة</div>
          </div>
          <Row style={{gap:8}}>
            <button onClick={saveMsg} style={{background:T.accent+"18",border:"1px solid "+T.accent+"44",borderRadius:10,padding:"6px 12px",color:T.accent,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"Tajawal,sans-serif"}}>حفظ</button>
            <button onClick={function(){setQExTheme(function(v){return v==="dark"?"light":"dark";});}} title="ثيم التصدير" style={{background:T.card2,border:"1px solid "+T.border,borderRadius:10,padding:"6px 10px",fontSize:13,cursor:"pointer",fontFamily:"Tajawal,sans-serif"}}>{qExTheme==="dark"?"🌑":"☀️"}</button>
            <button onClick={function(){saveMsg();setShowExport(true);}} style={{background:T.accent,border:"none",borderRadius:10,padding:"6px 12px",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"Tajawal,sans-serif"}}>تصدير</button>
          </Row>
        </Row>
      </div>

      <div style={{padding:14}}>
        {/* بيانات التسعيرة */}
        <Card style={{marginBottom:12}}>
          <div style={{fontSize:12,fontWeight:700,color:T.accent,marginBottom:10}}>بيانات التسعيرة</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {projects&&projects.length>0&&(
              <div>
                <label style={{fontSize:11,color:T.muted,fontWeight:600,display:"block",marginBottom:4}}>🔗 اربطها بمشروع (اختياري)</label>
                <select value={q.projectId||""} onChange={function(e){var pid=e.target.value; upd("projectId",pid); var pp=(projects||[]).find(function(x){return x.id===pid;}); if(pp && !q.title){upd("title",pp.name); if(!q.clientName && pp.producer) upd("clientName",pp.producer);} }}
                  style={{width:"100%",background:T.card2,border:"1px solid "+T.border,borderRadius:9,padding:"9px 12px",color:T.text,fontSize:13,outline:"none",fontFamily:"'DM Sans','Tajawal',sans-serif",direction:"rtl"}}>
                  <option value="">— بدون ربط —</option>
                  {projects.map(function(p){var s=PROJECT_STATUSES.find(function(x){return x.id===normalizeLegacyStatus(p.status);}); return <option key={p.id} value={p.id}>{(s?s.emoji+" ":"")+p.name+(p.producer?" · "+p.producer:"")}</option>;})}
                </select>
                <div style={{fontSize:10,color:T.muted,marginTop:4}}>💡 عند الحفظ، المشروع ينتقل تلقائياً لمرحلة "💰 تسعيرة"</div>
              </div>
            )}
            {linkedProject&&linkedProject.description&&(
              <div style={{background:T.accent+"11",border:"1.5px solid "+T.accent+"44",borderRadius:11,padding:"10px 12px"}}>
                <div style={{fontSize:10,color:T.accent,fontWeight:700,letterSpacing:"0.14em",marginBottom:6,fontFamily:"'DM Mono',monospace"}}>📝 وصف المشروع (من المحادثة)</div>
                <div style={{fontSize:12,color:T.text,lineHeight:1.7,whiteSpace:"pre-wrap"}} dir="auto">{linkedProject.description}</div>
              </div>
            )}
            <Inp label="عنوان المشروع *" value={q.title} onChange={function(e){upd("title",e.target.value);}} placeholder="اسم المشروع..."/>
            <Inp label="تاريخ الإصدار" type="date" value={q.issueDate} onChange={function(e){upd("issueDate",e.target.value);}}/>
          </div>
        </Card>

        {/* بيانات العميل */}
        <Card style={{marginBottom:12}}>
          <div style={{fontSize:12,fontWeight:700,color:T.accent,marginBottom:10}}>بيانات العميل</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <Inp label="اسم العميل *" value={q.clientName||""} onChange={function(e){upd("clientName",e.target.value);}} placeholder="Client Name"/>
            <Row style={{gap:8}}>
              <Inp label="اسم الشركة" value={q.clientCompany||""} onChange={function(e){upd("clientCompany",e.target.value);}} placeholder="Company"/>
              <Inp label="السجل التجاري" value={q.clientCR||""} onChange={function(e){upd("clientCR",e.target.value);}} placeholder="CR"/>
            </Row>
            <Row style={{gap:8}}>
              <Inp label="رقم الجوال *" value={q.clientPhone||""} onChange={function(e){upd("clientPhone",e.target.value);}} placeholder="+966..."/>
              <Inp label="الإيميل" value={q.clientEmail||""} onChange={function(e){upd("clientEmail",e.target.value);}} placeholder="email@..."/>
            </Row>
            <Inp label="العنوان" value={q.clientLocation||""} onChange={function(e){upd("clientLocation",e.target.value);}} placeholder="Address"/>
          </div>
        </Card>

        {/* بيانات التواصل — From */}
        <Card style={{marginBottom:12}}>
          <div style={{fontSize:12,fontWeight:700,color:T.accent,marginBottom:10}}>بياناتك (From) — تُحفظ تلقائياً</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <Inp label="الاسم" value={contact.name||""} onChange={function(e){var c=Object.assign({},contact,{name:e.target.value});setContact(c);saveContact(c);}} placeholder="Majd Alqurashi"/>
            <Inp label="الموقع" value={contact.location||""} onChange={function(e){var c=Object.assign({},contact,{location:e.target.value});setContact(c);saveContact(c);}} placeholder="Riyadh, SA"/>
            <Row style={{gap:8}}>
              <Inp label="الجوال" value={contact.phone||""} onChange={function(e){var c=Object.assign({},contact,{phone:e.target.value});setContact(c);saveContact(c);}} placeholder="+966..."/>
              <Inp label="الإيميل" value={contact.email||""} onChange={function(e){var c=Object.assign({},contact,{email:e.target.value});setContact(c);saveContact(c);}} placeholder="email@..."/>
            </Row>
          </div>
        </Card>

        {/* الجدول */}
        <Card style={{marginBottom:12,padding:0,overflow:"hidden"}}>
          <Row style={{justifyContent:"space-between",padding:"10px 14px",borderBottom:"1px solid "+T.border}}>
            <div style={{fontSize:12,fontWeight:700,color:T.text}}>البنود</div>
            <button onClick={addItem} style={{background:T.accent+"18",border:"1px solid "+T.accent+"44",borderRadius:8,padding:"4px 12px",fontSize:11,color:T.accent,cursor:"pointer",fontFamily:"Tajawal,sans-serif",fontWeight:700}}>+ بند</button>
          </Row>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
              <thead>
                <tr style={{background:T.card2}}>
                  {["Item Description","Qty","Unit Price","Total",""].map(function(h,i){return (
                    <th key={i} style={{padding:"7px 8px",textAlign:"right",color:T.muted,fontWeight:700,borderBottom:"1px solid "+T.border,whiteSpace:"nowrap"}}>{h}</th>
                  );})}
                </tr>
              </thead>
              <tbody>
                {q.items.map(function(item){
                  var hasNote=item.note&&item.note.trim();
                  var noteOpen=!!openNotes[item.id]||!!hasNote;
                  return (
                    <React.Fragment key={item.id}>
                      <tr style={{borderBottom:noteOpen?"none":"1px solid "+T.border}}>
                        <td style={{padding:"4px 6px",minWidth:160}}><input value={item.description} onChange={function(e){updItem(item.id,"description",e.target.value);}} placeholder="وصف البند..." style={Object.assign({},inp,{minWidth:150})}/></td>
                        <td style={{padding:"4px 6px",minWidth:60}}><input type="number" value={item.qty} onChange={function(e){updItem(item.id,"qty",e.target.value);}} style={Object.assign({},inp,{width:55,direction:"ltr"})}/></td>
                        <td style={{padding:"4px 6px",minWidth:90}}><input type="number" value={item.unitPrice} onChange={function(e){updItem(item.id,"unitPrice",e.target.value);}} placeholder="0" style={Object.assign({},inp,{width:80,direction:"ltr"})}/></td>
                        <td style={{padding:"4px 6px",minWidth:80,fontWeight:700,color:T.accent}}>{fmt((parseFloat(item.qty)||0)*(parseFloat(item.unitPrice)||0))}</td>
                        <td style={{padding:"4px 6px",whiteSpace:"nowrap"}}>
                          <button onClick={function(){toggleNote(item.id);}} title="ملاحظة" style={{background:noteOpen?T.accent+"22":"none",border:"none",cursor:"pointer",fontSize:14,padding:"3px 6px",borderRadius:6,marginRight:2}}>📝</button>
                          <button onClick={function(){delItem(item.id);}} style={{background:"none",border:"none",cursor:"pointer",color:T.warnText,fontSize:18,lineHeight:1}}>×</button>
                        </td>
                      </tr>
                      {noteOpen&&(
                        <tr style={{borderBottom:"1px solid "+T.border}}>
                          <td colSpan={5} style={{padding:"0 6px 8px"}}>
                            <SmartTextarea value={item.note||""} onChange={function(e){updItem(item.id,"note",e.target.value);}} rows={2} placeholder="ملاحظة على هذا البند (Enter للسطر التالي، - للنقاط، 1- للترقيم)"/>
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          </div>

          {/* Totals */}
          <div style={{padding:"12px 14px",borderTop:"1px solid "+T.border,background:T.card2}}>
            <Row style={{justifyContent:"space-between",fontSize:12,marginBottom:6}}>
              <span style={{color:T.muted}}>Subtotal</span>
              <span style={{fontWeight:700}}>{fmt(subtotal)}</span>
            </Row>

            {/* Discount */}
            <Row style={{justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <Row style={{gap:8,alignItems:"center"}}>
                <div className="press" onClick={function(){upd("discountOn",!q.discountOn);}}
                  style={{width:32,height:18,borderRadius:999,background:q.discountOn?T.accent:T.border,position:"relative",cursor:"pointer",transition:"all .2s"}}>
                  <div style={{position:"absolute",top:2,left:q.discountOn?14:2,width:14,height:14,borderRadius:999,background:"#fff",transition:"all .2s"}}/>
                </div>
                <span style={{fontSize:12,color:T.muted}}>Discount</span>
              </Row>
              {q.discountOn&&<Row style={{gap:6,alignItems:"center"}}>
                <select value={q.discountType} onChange={function(e){upd("discountType",e.target.value);}}
                  style={{background:T.card,border:"1px solid "+T.border,borderRadius:8,padding:"3px 6px",color:T.text,fontSize:11,fontFamily:"Tajawal,sans-serif",outline:"none"}}>
                  <option value="percent">%</option>
                  <option value="fixed">SAR</option>
                </select>
                <input type="number" value={q.discountValue} onChange={function(e){upd("discountValue",e.target.value);}}
                  placeholder="0" style={{background:T.card,border:"1px solid "+T.border,borderRadius:8,padding:"3px 8px",color:T.accent,fontSize:12,width:70,outline:"none",direction:"ltr",fontFamily:"Tajawal,sans-serif"}}/>
                <span style={{fontSize:12,fontWeight:700,color:T.warnText}}>-{fmt(discountAmt)}</span>
              </Row>}
            </Row>

            {/* Tax */}
            <Row style={{justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <Row style={{gap:8,alignItems:"center"}}>
                <div className="press" onClick={function(){upd("taxOn",!q.taxOn);}}
                  style={{width:32,height:18,borderRadius:999,background:q.taxOn?T.accent:T.border,position:"relative",cursor:"pointer",transition:"all .2s"}}>
                  <div style={{position:"absolute",top:2,left:q.taxOn?14:2,width:14,height:14,borderRadius:999,background:"#fff",transition:"all .2s"}}/>
                </div>
                <span style={{fontSize:12,color:T.muted}}>Tax (15%)</span>
              </Row>
              {q.taxOn&&<span style={{fontSize:12,color:T.muted}}>{fmt(taxAmt)}</span>}
            </Row>

            <Divider/>
            <Row style={{justifyContent:"space-between",marginTop:8}}>
              <span style={{fontSize:15,fontWeight:700,color:T.text}}>Total Amount</span>
              <span style={{fontSize:22,fontWeight:900,color:T.accent}}>{fmt(grandTotal)}</span>
            </Row>
          </div>
        </Card>

        {/* Payment Terms */}
        <Card style={{marginBottom:12}}>
          <div style={{fontSize:12,fontWeight:700,color:T.accent,marginBottom:10}}>Payment Terms</div>
          <Row style={{gap:8,alignItems:"center",marginBottom:8}}>
            <input type="number" value={q.payTerms1} onChange={function(e){upd("payTerms1",e.target.value);}}
              style={Object.assign({},inp,{width:60,direction:"ltr"})} min="0" max="100"/>
            <span style={{fontSize:12,color:T.muted}}>% upfront</span>
          </Row>
          <Row style={{gap:8,alignItems:"center"}}>
            <span style={{fontSize:13,fontWeight:700,color:T.accent,minWidth:55,textAlign:"center",fontFamily:"'DM Sans',sans-serif",direction:"ltr"}}>{Math.max(0,100-(parseFloat(q.payTerms1)||0))}%</span>
            <select value={q.payTerms2When||"after_delivery"} onChange={function(e){upd("payTerms2When",e.target.value);}}
              style={{background:T.card2,border:"1px solid "+T.border,borderRadius:8,padding:"9px 12px",color:T.text,fontSize:12,outline:"none",fontFamily:"'DM Sans','Tajawal',sans-serif",cursor:"pointer",flex:1}}>
              <option value="after_delivery">after project delivery</option>
              <option value="from_first_day">starting from the first working day of the project</option>
            </select>
          </Row>
        </Card>

        {/* Payment Info */}
        <Card style={{marginBottom:12}}>
          <div style={{fontSize:12,fontWeight:700,color:T.accent,marginBottom:10}}>Payment Info</div>
          {banks.length===0
            ?<div style={{fontSize:12,color:T.muted}}>أضف حسابات بنكية من الإعدادات أولاً</div>
            :banks.map(function(b,i){return(
              <div key={i} className="press" onClick={function(){upd("bankIdx",i);}}
                style={{padding:"10px 14px",borderRadius:12,marginBottom:6,border:"1.5px solid "+(q.bankIdx===i?T.accent+"66":T.border),background:q.bankIdx===i?T.accent+"18":T.card2,cursor:"pointer"}}>
                <Row style={{justifyContent:"space-between"}}>
                  <div>
                    <div style={{fontSize:13,fontWeight:700,color:T.text}}>🏦 {b.name||("حساب "+(i+1))}</div>
                    {b.iban&&<div style={{fontSize:11,color:T.muted,fontFamily:"monospace"}}>{b.iban}</div>}
                  </div>
                  {q.bankIdx===i&&<Ic d={I.check} s={16} c={T.accent}/>}
                </Row>
              </div>
            );})}
        </Card>

        {/* الملاحظات */}
        <Card>
          <SmartTextarea label="ملاحظات للعميل (اختياري)" value={q.notes||""} onChange={function(e){upd("notes",e.target.value);}} rows={4} placeholder={"اضغط - ثم Enter للنقاط\n١- ثم Enter للترقيم التلقائي"}/>
        </Card>

        {/* تحويل لمشروع */}
        <Btn full variant="active" onClick={function(){saveMsg();onCreateProject(q);}}>
          تحويل لمشروع جديد
        </Btn>
      </div>

      {toast&&<div style={{position:"fixed",bottom:90,left:"50%",transform:"translateX(-50%)",background:"#3d7033",color:"#fff",borderRadius:12,padding:"10px 20px",fontSize:13,fontWeight:700,zIndex:300}}>{toast}</div>}
      {showExport&&<QuotationExport q={q} contact={contact} banks={banks} subtotal={subtotal} discountAmt={discountAmt} taxAmt={taxAmt} grandTotal={grandTotal} exTheme={qExTheme} onClose={function(){setShowExport(false);}}/>}
    </div>
  );
}

function QuotationExport({q, contact, banks, subtotal, discountAmt, taxAmt, grandTotal, exTheme, onClose}) {
  var bank = banks[q.bankIdx||0] || null;
  var FC = MWAY_EXPORT[exTheme] || MWAY_EXPORT.dark;

  // Row for each item — Phase (description) + optional sub-notes as bullets + qty + unit + total
  var rows = q.items.map(function(i){
    var t = (parseFloat(i.qty)||0)*(parseFloat(i.unitPrice)||0);
    var nameCell = "<div style='font-weight:700;color:"+FC.text+";'>"+(i.description||"—")+"</div>";
    if(i.note) nameCell += "<div dir='auto' style='color:"+FC.muted+";font-size:10.5px;margin-top:4px;white-space:pre-line;line-height:1.55;'>"+escapeNote(i.note)+"</div>";
    return "<tr><td style='padding:11px 10px;border-bottom:1px solid "+FC.border+";vertical-align:top;font-size:12px;'>"+nameCell+"</td>"
      +"<td style='padding:11px 10px;border-bottom:1px solid "+FC.border+";text-align:center;color:"+FC.text+";font-family:DM Mono,monospace;font-size:12px;font-weight:600;'>"+(i.qty||1)+"</td>"
      +"<td style='padding:11px 10px;border-bottom:1px solid "+FC.border+";text-align:right;font-weight:700;color:"+FC.text+";font-family:DM Mono,monospace;font-size:12px;'>"+fmt(parseFloat(i.unitPrice)||0)+"</td>"
      +"<td style='padding:11px 10px;border-bottom:1px solid "+FC.border+";text-align:right;font-weight:700;color:"+FC.accent+";font-size:12px;'>"+fmt(t)+"</td>"
      +"</tr>";
  }).join("");

  // FROM (contact) block
  var fromLines = "";
  if(contact.name) fromLines += "<div style='font-size:13px;font-weight:700;color:"+FC.text+";margin-bottom:3px;'>"+contact.name+"</div>";
  if(contact.location) fromLines += "<div style='font-size:11px;color:"+FC.textS+";margin-bottom:2px;line-height:1.5;'>"+contact.location+"</div>";
  if(contact.phone) fromLines += "<div style='font-size:11px;color:"+FC.textS+";margin-bottom:2px;font-family:DM Mono,monospace;' dir='ltr'>"+contact.phone+"</div>";
  if(contact.email) fromLines += "<div style='font-size:11px;color:"+FC.textS+";font-family:DM Mono,monospace;' dir='ltr'>"+contact.email+"</div>";
  if(!fromLines) fromLines = "<div style='font-size:11px;color:"+FC.muted+";'>—</div>";

  // TO (client) block
  var clientLines = "";
  if(q.clientName) clientLines += "<div style='font-size:13px;font-weight:700;color:"+FC.text+";margin-bottom:3px;'>"+q.clientName+"</div>";
  if(q.clientCompany) clientLines += "<div style='font-size:11px;color:"+FC.textS+";margin-bottom:2px;line-height:1.5;'>"+q.clientCompany+"</div>";
  if(q.clientLocation) clientLines += "<div style='font-size:11px;color:"+FC.textS+";margin-bottom:2px;line-height:1.5;'>"+q.clientLocation+"</div>";
  if(q.clientPhone) clientLines += "<div style='font-size:11px;color:"+FC.textS+";margin-bottom:2px;font-family:DM Mono,monospace;' dir='ltr'>"+q.clientPhone+"</div>";
  if(q.clientEmail) clientLines += "<div style='font-size:11px;color:"+FC.textS+";margin-bottom:2px;font-family:DM Mono,monospace;' dir='ltr'>"+q.clientEmail+"</div>";
  if(q.clientCR) clientLines += "<div style='font-size:11px;color:"+FC.textS+";font-family:DM Mono,monospace;' dir='ltr'>CR: "+q.clientCR+"</div>";
  if(!clientLines) clientLines = "<div style='font-size:11px;color:"+FC.muted+";'>—</div>";

  // PAYMENT INFO block (top-right column, next to FROM/TO)
  var paymentLines = "";
  if(bank){
    if(bank.name || bank.holder){
      var payTitle = (bank.name||"") + (bank.name&&bank.holder?" · ":"") + (bank.holder||"");
      paymentLines += "<div style='font-size:13px;font-weight:700;color:"+FC.text+";margin-bottom:3px;'>"+payTitle+"</div>";
    }

    if(bank.iban) paymentLines += "<div style='font-size:11px;color:"+FC.textS+";font-family:DM Mono,monospace;' dir='ltr'>IBAN: "+bank.iban+"</div>";
  } else {
    paymentLines = "<div style='font-size:11px;color:"+FC.muted+";'>—</div>";
  }

  // Optional totals rows
  var discountRow = q.discountOn&&discountAmt>0

    : "";

  // Payment Terms (preserves the app's original wording)
  var payTermsText = (q.payTerms1||"50")+"% upfront and "+(Math.max(0,100-(parseFloat(q.payTerms1)||50)))+"% "+(q.payTerms2When==="from_first_day"?"starting from the first working day of the project":"after project delivery")+".";

  // Notes block (only if provided)
  var notesBlock = (q.notes&&q.notes.trim())
    ? "<div style='padding:8px 4px 0;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;'>"
      +"<div style='font-size:9px;color:"+FC.muted+";font-weight:500;letter-spacing:0.18em;text-transform:uppercase;font-family:DM Mono,monospace;margin-bottom:8px;'><span dir='ltr'>Notes</span> &middot; ملاحظات</div>"
      +"<div dir='auto' style='font-size:11px;color:"+FC.textS+";line-height:1.7;white-space:pre-wrap;overflow:hidden;flex:1;'>"+escapeNote(q.notes)+"</div>"
      +"</div>"
    : "<div style='flex:1;'></div>";

  var html = "<!DOCTYPE html><html lang='en' dir='ltr'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Quotation - "+q.title+"</title>"
    +"<style>"
    +"@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;900&family=DM+Mono:wght@400;500&display=swap');"
    +"@page{size:A4 portrait;margin:0;}"
    +"*{box-sizing:border-box;margin:0;padding:0;}"
    +"html,body{background:#2A2A2A;}"
    +"body{font-family:'DM Sans','Tajawal',sans-serif;padding:20px 0;display:flex;justify-content:center;}"
    +".sheet{width:210mm;height:297mm;background:"+FC.bg+";color:"+FC.text+";padding:15mm 15mm 12mm;box-shadow:0 6px 30px rgba(0,0,0,0.4);display:flex;flex-direction:column;gap:10px;overflow:hidden;}"
    +"[dir=\"rtl\"]{text-align:right;}"
    +"[dir=\"ltr\"]{unicode-bidi:isolate;}"
    +"table{width:100%;border-collapse:collapse;}"
    +"@media print{html,body{background:"+FC.bg+";}body{padding:0;display:block;}.sheet{box-shadow:none;page-break-after:avoid;}}"
    +"</style></head><body>"

    // ── Sheet start ──
    +"<div class='sheet'>"

    // ── HEADER: logo + big QUOTATION title + subtitle ──
    +"<div style='text-align:center;padding:4px 0 14px;border-bottom:1px solid "+FC.border+";flex-shrink:0;'>"
    +"<div style='margin-bottom:10px;'>"+logoSvgHtml(FC.text,30)+"</div>"
    +"<div style='font-family:DM Sans,sans-serif;font-size:38px;font-weight:900;letter-spacing:0.45em;color:"+FC.text+";padding-right:0.45em;margin-bottom:5px;' dir='ltr'>QUOTATION</div>"
    +"<div style='font-size:11px;color:"+FC.muted+";font-family:DM Mono,monospace;letter-spacing:0.24em;text-transform:uppercase;' dir='ltr'>Art Services · مجد القرشي · "+q.issueDate+"</div>"
    +"</div>"

    // ── INFO ROW: FROM · TO · PAYMENT INFO (3 columns) ──
    +"<div style='display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:12px;flex-shrink:0;'>"
    +"<div style='padding:0 4px;'>"
    +"<div style='font-size:9px;color:"+FC.muted+";font-weight:500;letter-spacing:0.18em;text-transform:uppercase;font-family:DM Mono,monospace;margin-bottom:8px;' dir='ltr'>From</div>"
    +fromLines
    +"</div>"
    +"<div style='padding:0 4px;border-right:1px solid "+FC.border+";padding-right:12px;'>"
    +"<div style='font-size:9px;color:"+FC.muted+";font-weight:500;letter-spacing:0.18em;text-transform:uppercase;font-family:DM Mono,monospace;margin-bottom:8px;' dir='ltr'>To</div>"
    +clientLines

    +"<div style='padding:0 4px;border-right:1px solid "+FC.border+";padding-right:12px;'>"
    +"<div style='font-size:9px;color:"+FC.muted+";font-weight:500;letter-spacing:0.18em;text-transform:uppercase;font-family:DM Mono,monospace;margin-bottom:8px;' dir='ltr'>Payment Info</div>"
    +paymentLines
    +"</div>"
    +"</div>"

    // ── ITEMS TABLE ──
    +"<div style='border-top:1.5px solid "+FC.border+";border-bottom:1.5px solid "+FC.border+";margin-top:2px;flex-shrink:0;'>"
    +"<table dir='ltr'>"
    +"<thead><tr>"
    +"<th style='padding:10px 10px;font-weight:500;color:"+FC.muted+";font-family:DM Mono,monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;border-bottom:1px solid "+FC.border+";text-align:left;width:58%;'>Item Description</th>"
    +"<th style='padding:10px 10px;font-weight:500;color:"+FC.muted+";font-family:DM Mono,monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;border-bottom:1px solid "+FC.border+";text-align:center;width:11%;'>Quantity</th>"
    +"<th style='padding:10px 10px;font-weight:500;color:"+FC.muted+";font-family:DM Mono,monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;border-bottom:1px solid "+FC.border+";text-align:right;width:15%;'>Unit Price</th>"

    +discountRow+taxRow
    +"<div style='display:flex;justify-content:space-between;font-size:16px;font-weight:900;color:"+FC.text+";font-family:DM Sans,sans-serif;letter-spacing:0.02em;border-top:1.5px solid "+FC.border+";margin-top:4px;padding-top:8px;'><span>Total</span><span style='color:"+FC.accent+";'>"+fmt(grandTotal)+"</span></div>"

    +"</div>" // /sheet
    +"</body></html>";

  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([html],{type:"text/html"}));
  a.download = "Quotation-"+(q.title||"art-services")+"-"+today()+".html";

function TodosModal({todos,setTodos,projects,initialProjectId=null,onClose}) {
  const T=useT();
  const [text,setText]=useState("");
  const [busy,setBusy]=useState(false);
  const [showDone,setShowDone]=useState(false);
  const addTodo=async()=>{
    const t=text.trim(); if(!t||busy) return;
    setBusy(true);
    try{
      const newRow={text:t,project_id:initialProjectId,done:false};
      const [created]=await sb.post("todos",newRow);
      setTodos(prev=>[created,...prev]);
      setText("");
    }catch(err){alert("فشل الحفظ: "+(err.message||err));}
    setBusy(false);
  };
  const toggleTodo=async(t)=>{
    const next={done:!t.done,done_at:!t.done?new Date().toISOString():null};
    setTodos(prev=>prev.map(x=>x.id===t.id?{...x,...next}:x));
    try{await sb.patch("todos",t.id,next);}catch(err){
      setTodos(prev=>prev.map(x=>x.id===t.id?{...x,done:t.done,done_at:t.done_at}:x));
      alert("فشل التحديث");
    }
  };
  const delTodo=async(t)=>{
    if(!confirm("حذف المهمة؟")) return;
    const old=todos;
    setTodos(prev=>prev.filter(x=>x.id!==t.id));
    try{await sb.del("todos",t.id);}catch(err){setTodos(old);alert("فشل الحذف");}
  };
  const projName=(id)=>{const p=projects.find(x=>x.id===id);return p?p.name:null;};
  const pending=todos.filter(t=>!t.done);
  const done=todos.filter(t=>t.done);
  return (
    <Modal title={initialProjectId?"مهام المشروع":"قائمة المهام"} onClose={onClose}>
      <div style={{padding:"0 18px 24px"}}>
        <Row style={{gap:8,marginBottom:16}}>
          <input value={text} onChange={e=>setText(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter")addTodo();}}
            placeholder={initialProjectId?"مهمة جديدة لهذا المشروع":"مهمة جديدة"}
            style={{flex:1,background:T.card2,border:`1px solid ${T.border}`,borderRadius:10,padding:"11px 14px",color:T.text,fontSize:14,outline:"none",fontFamily:"'DM Sans','Tajawal',sans-serif",direction:"rtl"}}
            onFocus={e=>e.target.style.borderColor=T.accent}
            onBlur={e=>e.target.style.borderColor=T.border}/>
          <Btn onClick={addTodo} disabled={!text.trim()||busy}><Ic d={I.plus} s={16}/></Btn>
        </Row>
        {pending.length===0&&done.length===0&&<div style={{textAlign:"center",padding:30,color:T.muted,fontSize:13}}>لا توجد مهام بعد ✨</div>}
        {pending.length>0&&<div style={{marginBottom:14}}>
          <div style={{fontSize:9,color:T.muted,fontFamily:"'DM Mono',monospace",letterSpacing:"0.16em",textTransform:"uppercase",fontWeight:500,marginBottom:8}}>قيد التنفيذ · {pending.length}</div>
          {pending.map(t=>{
            const tag=t.project_id?projName(t.project_id):null;
            return (
              <Row key={t.id} style={{gap:10,padding:"10px 12px",borderRadius:10,background:T.card2,border:`1px solid ${T.border}`,marginBottom:6,alignItems:"flex-start"}}>
                <button className="press" onClick={()=>toggleTodo(t)}
                  style={{width:22,height:22,borderRadius:6,border:`1.5px solid ${T.border}`,background:"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",marginTop:2}}>
                </button>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,color:T.text,wordBreak:"break-word"}}>{t.text}</div>
                  {tag&&!initialProjectId&&<div style={{fontSize:10,color:T.muted,fontFamily:"'DM Mono',monospace",letterSpacing:"0.08em",marginTop:3}}>· {tag}</div>}
                </div>
                <button className="press" onClick={()=>delTodo(t)}
                  style={{width:28,height:28,borderRadius:7,background:T.warn+"15",border:`1px solid ${T.warn}33`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
                  <Ic d={I.trash} s={13} c={T.warnText}/>
                </button>
              </Row>
            );
          })}
        </div>}
        {done.length>0&&<div>
          <button className="press" onClick={()=>setShowDone(v=>!v)}
            style={{background:"transparent",border:"none",cursor:"pointer",fontSize:9,color:T.muted,fontFamily:"'DM Mono',monospace",letterSpacing:"0.16em",textTransform:"uppercase",fontWeight:500,marginBottom:8,padding:0}}>
            {showDone?"▾":"▸"} منجزة · {done.length}
          </button>
          {showDone&&done.map(t=>{
            const tag=t.project_id?projName(t.project_id):null;
            return (
              <Row key={t.id} style={{gap:10,padding:"10px 12px",borderRadius:10,background:T.card2,border:`1px solid ${T.border}`,marginBottom:6,opacity:.6,alignItems:"flex-start"}}>
                <button className="press" onClick={()=>toggleTodo(t)}
                  style={{width:22,height:22,borderRadius:6,border:`1.5px solid ${T.accent}`,background:T.accent,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",marginTop:2}}>
                  <Ic d={I.check} s={12} c="#fff" sw={3}/>
                </button>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,color:T.text,textDecoration:"line-through",wordBreak:"break-word"}}>{t.text}</div>
                  {tag&&!initialProjectId&&<div style={{fontSize:10,color:T.muted,fontFamily:"'DM Mono',monospace",letterSpacing:"0.08em",marginTop:3}}>· {tag}</div>}
                </div>
                <button className="press" onClick={()=>delTodo(t)}
                  style={{width:28,height:28,borderRadius:7,background:T.warn+"15",border:`1px solid ${T.warn}33`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
                  <Ic d={I.trash} s={13} c={T.warnText}/>
                </button>
              </Row>
            );
          })}
        </div>}
      </div>
    </Modal>
  );
}


function GlobalSearchModal({projects=[],vendors=[],savedQuotes=[],savedInvs=[],todos=[],onNavigate,onClose}){
  const T=useT();
  const [q,setQ]=useState("");
  const query=q.trim().toLowerCase();
  const has=(v)=>String(v||"").toLowerCase().includes(query);
  const renderHL=(text)=>{
    const parts=highlightParts(text,q);
    return parts.map((p,i)=>p.match?<mark key={i} style={{background:T.accent+"55",color:T.text,borderRadius:3,padding:"0 2px"}}>{p.text}</mark>:<span key={i}>{p.text}</span>);
  };
  let projectsRes=[],expensesRes=[],membersRes=[],vendorsRes=[],quotesRes=[],invoicesRes=[],todosRes=[];
  if(query){
    projectsRes=projects.filter(p=>has(p.name)||has(p.short_id)||has(p.producer)||has(p.moodboardDesc));
    expensesRes=projects.flatMap(p=>(p.expenses||[]).filter(e=>has(e.name)||has(e.description)||has(e.store)||has(e.added_by)).map(e=>({...e,_projName:p.name,_projId:p.id})));
    membersRes=projects.flatMap(p=>(p.teamMembers||[]).filter(m=>has(m.display_name)||has(m.username)||has(m.payment_method)).map(m=>({...m,_projName:p.name,_projId:p.id})));
    vendorsRes=vendors.filter(v=>has(v.name)||has(v.phone)||(v.tags||[]).some(t=>String(t||"").toLowerCase().includes(query))||has(v.notes));
    quotesRes=savedQuotes.filter(qt=>has(qt.title)||has(qt.clientName)||has(qt.clientCompany)||has(qt.clientPhone)||has(qt.clientEmail)||has(qt.clientCR)||has(qt.notes)||(qt.items||[]).some(i=>has(i.description)||has(i.note)));
    invoicesRes=savedInvs.filter(inv=>has(inv.title)||has(inv.producer)||has(inv.company)||(inv.items||[]).some(it=>has(it.name)||has(it.description)||has(it.store)));
    todosRes=todos.filter(t=>has(t.text));
  }
  const total=projectsRes.length+expensesRes.length+membersRes.length+vendorsRes.length+quotesRes.length+invoicesRes.length+todosRes.length;
  const groupLabel=(emoji,label,count)=><div style={{fontSize:9,color:T.muted,fontFamily:"'DM Mono',monospace",letterSpacing:"0.16em",textTransform:"uppercase",marginBottom:6,marginTop:14}}>{emoji} {label} ({count})</div>;
  const go=(payload)=>{ onNavigate(payload); onClose(); };
  return (
    <Modal title="بحث في كل التطبيق" onClose={onClose}>
      <div style={{padding:"0 18px 24px"}}>
        <div style={{position:"relative",marginBottom:14}}>
          <input value={q} onChange={e=>setQ(e.target.value)} autoFocus placeholder="اكتب اسم مشروع، مصروف، مورد، عميل..."
            style={{width:"100%",background:T.card2,border:`1.5px solid ${T.border}`,borderRadius:12,padding:"12px 44px 12px 16px",color:T.text,fontSize:15,outline:"none",fontFamily:"'DM Sans','Tajawal',sans-serif",direction:"rtl"}}
            onFocus={e=>e.target.style.borderColor=T.accent}
            onBlur={e=>e.target.style.borderColor=T.border}/>
          <div style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}}><Ic d={I.search} s={18} c={T.muted}/></div>

                  </div>
                </Row>
              </Card>

        {quotesRes.length>0&&<>

            <Card key={qt.id} style={{marginBottom:6,cursor:"pointer"}} onClick={()=>go({type:"quotation",quote:qt})}>

                {qt.issueDate&&<span>· {qt.issueDate}</span>}
              </Row>
            </Card>
          ))}
        </>}

        {invoicesRes.length>0&&<>
          {groupLabel("🧾","الفواتير",invoicesRes.length)}
          {invoicesRes.map(inv=>{
            const tot=(inv.items||[]).reduce((s,it)=>s+(parseFloat(it.amount)||0),0);
            return (
              <Card key={inv.id} style={{marginBottom:6,cursor:"pointer"}} onClick={()=>go({type:"invoice",invoice:inv})}>

              <Row style={{gap:6,marginTop:2,fontSize:11,color:T.muted,flexWrap:"wrap"}}>
                <span>في "{renderHL(m._projName)}"</span>
