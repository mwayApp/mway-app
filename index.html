function SuperAdminApp({onLogout}) {
  const T=useT();
  const [tab,setTab]=useState("edit"); // edit | history
  const [current,setCurrent]=useState(null);
  const [history,setHistory]=useState([]);
  const [loading,setLoading]=useState(true);
  const [draft,setDraft]=useState({emoji_line:"",section_label:"",greeting:"",body:"",closing:"",signature:""});
  const [saving,setSaving]=useState(false);
  const [toast,setToast]=useState("");

  const showToast=(msg)=>{setToast(msg);setTimeout(()=>setToast(""),2400);};

  const loadMessages=async()=>{
    setLoading(true);
    try{
      const rows=await sb.get("app_message","?order=created_at.desc");
      const list=rows||[];
      setHistory(list);
      if(list.length){
        setCurrent(list[0]);
        setDraft({
          emoji_line:list[0].emoji_line||"",
          section_label:list[0].section_label||"",
          greeting:list[0].greeting||"",
          body:list[0].body||"",
          closing:list[0].closing||"",
          signature:list[0].signature||"",
        });
      }
    }catch(err){console.warn(err);}
    setLoading(false);
  };

  useEffect(()=>{ loadMessages(); },[]);

  const publish=async()=>{
    if(!draft.body||!draft.body.trim()){alert("النص الكامل مطلوب");return;}
    setSaving(true);
    try{
      const payload={
        emoji_line:draft.emoji_line||null,
        section_label:draft.section_label||null,
        greeting:draft.greeting||null,
        body:draft.body||null,
        closing:draft.closing||null,
        signature:draft.signature||null,
        updated_by:"فارس"
      };
      const created=await sb.post("app_message",payload);
      const row=Array.isArray(created)?created[0]:created;
      // Fire notification for Majd
      await sb.post("notifications",{
        id:uid(),
        type:"app_message_update",
        actor:"فارس",
        message:"رسالة التطبيق اتحدثت من فارس",
        read:false
      }).catch(()=>{}); // soft-fail
      setHistory(prev=>[row,...prev]);
      setCurrent(row);
      showToast("تم النشر ✓ — مجد ستصلها إشعار");
    }catch(err){alert("فشل النشر: "+(err.message||err));}
    setSaving(false);
  };

  const rollbackTo=(msg)=>{
    if(!confirm("استعادة هذه النسخة كرسالة جديدة؟")) return;
    setDraft({
      emoji_line:msg.emoji_line||"",
      section_label:msg.section_label||"",
      greeting:msg.greeting||"",
      body:msg.body||"",
      closing:msg.closing||"",

        <Row style={{justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:9,color:T.muted,fontFamily:"'DM Mono',monospace",letterSpacing:"0.2em",textTransform:"uppercase",fontWeight:500,marginBottom:2}}>SUPER ADMIN</div>
            <div style={{fontSize:18,fontWeight:800,color:T.text}}>⚙️ لوحة فارس</div>
          </div>
          <button onClick={onLogout} style={{background:T.warn+"15",color:T.warnText,border:`1px solid ${T.warn}44`,borderRadius:10,padding:"7px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans','Tajawal',sans-serif"}}>

function ProjectsTab({projects,onOpen,onNew,onNewLead,setEditInv,setShowInv}) {
  const T=useT();
  const [filterStage,setFilterStage]=useState("all");
  const [showDone,setShowDone]=useState(false);
  // Normalize legacy statuses on the fly (for old data not yet migrated)
  const normalized=projects.map(p=>({...p,status:normalizeLegacyStatus(p.status)}));
  const counts={
    all:normalized.length,
    talk:normalized.filter(p=>p.status==="talk").length,
    quoted:normalized.filter(p=>p.status==="quoted").length,
    active:normalized.filter(p=>p.status==="active").length,
    done:normalized.filter(p=>p.status==="done").length,
  };
  const filtered=filterStage==="all"?normalized:normalized.filter(p=>p.status===filterStage);
  const stuck=(p)=>{
    if(p.status!=="talk"&&p.status!=="quoted") return false;
    return daysInCurrentStage(p)>=10;
  };
  const renderCard=(p)=>{
    const exp=p.expenses||[];
    const spent=exp.filter(e=>e.paid&&!e.returned).reduce((s,e)=>s+e.amount,0);
    const unpaid=exp.filter(e=>!e.paid&&!e.returned).reduce((s,e)=>s+e.amount,0);
    const ov=spent>(Number(p.custody)||0); const pc=p.custody>0?(spent/p.custody)*100:0;
    const mc=(p.teamMembers||[]).length;
    const stageDays=daysInCurrentStage(p);
    const totalDays=totalLifecycleDays(p);
    const isStuck=stuck(p);
    return (
      <Card key={p.id} onClick={()=>onOpen(p.id)} style={{marginBottom:13,border:isStuck?`1.5px solid ${T.warn}55`:undefined}}>
        {/* Header */}
        <Row style={{justifyContent:"space-between",marginBottom:6,alignItems:"flex-start"}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:800,fontSize:15,color:T.text,marginBottom:4,display:"flex",alignItems:"center",gap:6}}>
              {p.name}
              {isStuck&&<span title="عالق أكثر من 10 أيام" style={{fontSize:14}}>🔥</span>}
            </div>
            <Row style={{gap:6,flexWrap:"wrap"}}>
              {p.short_id&&<span style={{fontSize:10,color:T.accent,fontFamily:"monospace",fontWeight:700,background:T.accent+"12",padding:"2px 6px",borderRadius:6}}>{p.short_id}</span>}
              {p.producer&&<span style={{fontSize:11,color:T.muted}}>👤 {p.producer}</span>}
              {mc>0&&<span style={{fontSize:11,color:T.muted}}>👥 {mc}</span>}
            </Row>
          </div>
          <Ic d={I.chevron} s={18} c={T.muted}/>
        </Row>
        {/* Cycle time chips */}
        {stageDays>0&&(
          <Row style={{gap:6,marginBottom:10,flexWrap:"wrap"}}>
            <StatusBadge statusId={p.status||"talk"}/>
            <span style={{fontSize:10,color:isStuck?T.warnText:T.muted,fontFamily:"'DM Mono',monospace",background:isStuck?T.warn+"18":T.card2,padding:"3px 8px",borderRadius:6,fontWeight:700}}>
              ⏱ {stageDays} يوم في هذه المرحلة
            </span>
            {totalDays>stageDays&&<span style={{fontSize:10,color:T.muted,fontFamily:"'DM Mono',monospace"}}>· إجمالي {totalDays} يوم</span>}
            {p.financeStatus&&<StatusBadge statusId={p.financeStatus}/>}
          </Row>
        )}

function FileUploadSection({label, accept, name, file, onFile, onClear, bucket:bucket_="files"}) {
  const T=useT();
  const ref=useRef();
  // ALL hooks must be at top — before any early returns
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState("");
  const [localName,setLocalName]=useState(name||null);
  const [localFile,setLocalFile]=useState(file||null);
  const [viewing,setViewing]=useState(false);
  const MAX_MB=4;

  useEffect(()=>{ setLocalName(name||null); setLocalFile(file||null); },[name,file]);

  const handleFile=async(f)=>{
    if(!f) return;
    setErr("");
    const MAX_STORAGE_MB=50;
    if(f.size > MAX_STORAGE_MB*1024*1024){
      setErr(`الملف كبير جداً (${(f.size/1024/1024).toFixed(1)} MB) — الحد ${MAX_STORAGE_MB} MB`);
      return;
    }
    setLoading(true);
    try{
      // Determine bucket: images/PDFs for receipts & profiles → files bucket
      const bucket = bucket_||"files";
      const ext = f.name.split(".").pop()||"bin";
      const path = `${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;

      // Compress images before upload
      let fileToUpload = f;
      if(f.type.startsWith("image/") && f.size > 200*1024){
        const compressed = await compressImage(f, 1400, 0.85);
        const [meta,b64]=compressed.split(",");
        const mime=meta.match(/:(.*?);/)?.[1]||"image/jpeg";
        const bytes=atob(b64); const arr=new Uint8Array(bytes.length);
        for(let i=0;i<bytes.length;i++) arr[i]=bytes.charCodeAt(i);
        fileToUpload=new Blob([arr],{type:mime});
      }

      const url = await sb.uploadFile(bucket, path, fileToUpload);
      setLocalName(f.name);
      setLocalFile(url);
      onFile(f.name, url);
    }catch(e){
      // Fallback to base64 if storage fails
      try{
        const data = f.type.startsWith("image/")
          ? await compressImage(f, 1000, 0.75)
          : await readFileAsBase64(f);
        setLocalName(f.name);
        setLocalFile(data);
        onFile(f.name, data);
        setErr("⚠ رُفع محلياً — الاتصال بـ Storage فشل");
      }catch(e2){
        setErr("فشل الرفع: "+(e?.message||"خطأ"));
      }
    }
    setLoading(false);
  };

  // Now safe to do conditional returns — all hooks are above
  if(loading) return (
    <div>
      {label&&<label style={{fontSize:12,color:T.textS,fontWeight:600,display:"block",marginBottom:6}}>{label}</label>}
      <div style={{border:`1.5px solid ${T.accent}44`,borderRadius:12,padding:"14px",display:"flex",alignItems:"center",gap:10,background:T.accent+"08"}}>
        <div style={{width:18,height:18,border:`2.5px solid ${T.accent}`,borderTopColor:"transparent",borderRadius:"50%",animation:"spin .8s linear infinite",flexShrink:0}}/>
        <span style={{fontSize:13,color:T.accent,fontWeight:600}}>جاري رفع الملف... ⬆</span>
      </div>
    </div>
  );

  if(localName && localFile) return (
    <div>
      {label&&<label style={{fontSize:12,color:T.textS,fontWeight:600,display:"block",marginBottom:6}}>{label}</label>}
      <div style={{background:T.ok+"12",border:`1.5px solid ${T.ok}44`,borderRadius:12,padding:"12px 14px",display:"flex",flexDirection:"column",gap:10}}>
        <Row style={{gap:8}}>
          <Ic d={I.pdf} s={18} c={T.okText}/>
          <span style={{flex:1,fontSize:13,color:T.okText,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{localName}</span>
        </Row>
        <Row style={{gap:6}}>
          <button className="press" onClick={()=>setViewing(true)}
            style={{flex:1,background:T.accent+"18",border:`1px solid ${T.accent}44`,borderRadius:10,padding:"8px",fontSize:12,color:T.accent,cursor:"pointer",fontFamily:"Tajawal,sans-serif",fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
            <Ic d={I.eye} s={13} c={T.accent}/> عرض
          </button>
          <button className="press" onClick={()=>{const a=document.createElement("a");a.href=localFile;a.download=localName;a.click();}}
            style={{flex:1,background:T.ok+"18",border:`1px solid ${T.ok}44`,borderRadius:10,padding:"8px",fontSize:12,color:T.okText,cursor:"pointer",fontFamily:"Tajawal,sans-serif",fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
            <Ic d={I.download} s={13} c={T.okText}/> تحميل
          </button>
          {navigator.share&&<button className="press" onClick={async()=>{try{const blob=await(await fetch(localFile)).blob();await navigator.share({files:[new File([blob],localName)]});}catch{}}}
            style={{flex:1,background:T.card2,border:`1px solid ${T.border}`,borderRadius:10,padding:"8px",fontSize:12,color:T.textS,cursor:"pointer",fontFamily:"Tajawal,sans-serif",fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
            <Ic d={I.share} s={13} c={T.textS}/> مشاركة
          </button>}
          <button className="press" onClick={()=>{if(confirm(`حذف "${localName}"؟`)){setLocalName(null);setLocalFile(null);onClear();}}}
            style={{flex:1,background:T.warn+"15",border:`1px solid ${T.warn}33`,borderRadius:10,padding:"8px",fontSize:12,color:T.warnText,cursor:"pointer",fontFamily:"Tajawal,sans-serif",fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
            <Ic d={I.trash} s={13} c={T.warnText}/> حذف
          </button>
        </Row>
      </div>
      {viewing&&<FileViewModal name={localName} file={localFile} onClose={()=>setViewing(false)}/>}
    </div>
  );

  return (
    <div>
      {label&&<label style={{fontSize:12,color:T.textS,fontWeight:600,display:"block",marginBottom:6}}>{label}</label>}
      <div className="press" onClick={()=>{setErr("");ref.current.click();}}
        style={{border:`1.5px dashed ${err?T.warn:T.border}`,borderRadius:12,padding:"14px",display:"flex",alignItems:"center",gap:8,cursor:"pointer",background:err?T.warn+"08":T.card2,color:err?T.warnText:T.muted,fontSize:13,transition:"all .15s"}}>
        <Ic d={I.upload} s={15} c={err?T.warn:T.muted}/>
        <span>{err? err : "اضغطي لرفع الملف"}</span>
      </div>
      <input ref={ref} type="file" accept={accept} style={{display:"none"}}
        onChange={e=>handleFile(e.target.files[0])}/>
    </div>
  );
}

/* helpers for FileUploadSection */
function readFileAsBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>res(e.target.result);
    r.onerror=()=>rej(new Error("فشل القراءة"));
    r.readAsDataURL(file);
  });
}
function compressImage(file, maxPx=9999, quality=0.95){
  return new Promise((res,rej)=>{
    const MAX_BYTES=950*1024;
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let {width:w,height:h}=img;
      if(w>maxPx||h>maxPx){ const r=Math.min(maxPx/w,maxPx/h); w=Math.round(w*r); h=Math.round(h*r); }
      const canvas=document.createElement("canvas");
      canvas.width=w; canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      let q=0.97;
      const tryDown=()=>{
        const data=canvas.toDataURL("image/jpeg",q);
        const bytes=(data.length-22)*3/4;
        if(bytes<=MAX_BYTES||q<=0.5){ res(data); return; }
        q=Math.max(q-0.02,0.5);
        tryDown();
      };
      tryDown();
    };
    img.onerror=()=>rej(new Error("فشل تحميل الصورة"));
    img.src=url;
  });
}

/* ── ReceiptModal — view + download + share receipt ── */
function ReceiptModal({expense, onClose}) {
  const T=useT();
  const isImg = expense.receipt_url && (expense.receipt_url.startsWith("data:image") || expense.receipt_url.includes("image/"));
  const download=()=>{const a=document.createElement("a");a.href=expense.receipt_url;a.download=expense.receipt_name||"receipt";a.click();};
  const share=async()=>{
    try{
      const blob=await(await fetch(expense.receipt_url)).blob();
      await navigator.share({files:[new File([blob],expense.receipt_name||"receipt")]});
    }catch{}
  };
  return (
    <Modal title={`🧾 ${expense.receipt_name||"فاتورة"}`} onClose={onClose}>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        {isImg
          ?<img src={expense.receipt_url} style={{width:"100%",borderRadius:14,maxHeight:"55vh",objectFit:"contain"}} alt="receipt"/>
          :<div style={{background:T.card2,borderRadius:14,padding:32,textAlign:"center"}}>
            <div style={{fontSize:48,marginBottom:8}}>📄</div>
            <div style={{fontSize:14,fontWeight:700,color:T.text,marginBottom:4}}>{expense.receipt_name}</div>
            <div style={{fontSize:12,color:T.muted}}>ملف PDF أو مستند</div>
          </div>
        }
        <Row style={{gap:10}}>
          <Btn full onClick={download}><Ic d={I.download} s={16}/> تحميل</Btn>
          {navigator.share&&<Btn full variant="subtle" onClick={share}><Ic d={I.share} s={16}/> مشاركة</Btn>}
        </Row>
        <div style={{background:T.card2,borderRadius:12,padding:"10px 14px",fontSize:12,color:T.muted}}>
          <b style={{color:T.text}}>{expense.name}</b> — {expense.date} — <b style={{color:T.accent}}>{fmt(expense.amount)}</b>
        </div>
      </div>
    </Modal>
  );
}

/* ── Profile Section (standalone component — fixes React hooks rules) ── */
function ProfileSection({onBack, profile, onProfile}) {
  const T=useT();
  const aRef=useRef();

  // Use a ref to always have latest value (avoids stale closure in file callbacks)
  const profileRef=useRef({
    name:profile.name||"",
    email:profile.email||"",
    link1:profile.link1||"",
    link2:profile.link2||"",
    avatar:profile.avatar||null,
    portfolioName:profile.portfolioName||null,
    portfolioFile:profile.portfolioFile||null,
    cvName:profile.cvName||null,
    cvFile:profile.cvFile||null,
  });
  const [localProfile, setLocalProfile]=useState(profileRef.current);
  const [saving,setSaving]=useState(false);
  const [saveStatus,setSaveStatus]=useState(""); // "" | "saving" | "ok" | "err"
  const [saveErr,setSaveErr]=useState("");

  const set=(k,v)=>{
    profileRef.current={...profileRef.current,[k]:v};
    setLocalProfile({...profileRef.current});
    onProfile({...profileRef.current});
  };

  const saveP=async()=>{
    setSaveStatus("saving"); setSaveErr("");
    const p=profileRef.current;
    try{
      const rows=await sb.get("profile");
      // Try with files first, fallback without if column missing
      const pl={
        name:p.name||"", email:p.email||"",
        link1:p.link1||"", link2:p.link2||"",
        avatar_url:p.avatar||null,
        portfolio_name:p.portfolioName||null,
        portfolio_file:p.portfolioFile||null,
        cv_name:p.cvName||null,
        cv_file:p.cvFile||null,
      };
      if(!rows.length) await sb.post("profile",pl);
      else await sb.patch("profile",rows[0].id,pl);
      setSaveStatus("ok");
      setTimeout(()=>setSaveStatus(""),3000);
    }catch(e){
      // If columns missing, save without them
      try{
        const rows=await sb.get("profile");
        const pl2={name:p.name||"",email:p.email||"",link1:p.link1||"",link2:p.link2||"",avatar_url:p.avatar||null};
        if(!rows.length) await sb.post("profile",pl2);
        else await sb.patch("profile",rows[0].id,pl2);
        setSaveStatus("ok");
        setSaveErr("⚠ البورتفوليو والـ CV لم يُحفظا — شغلي SQL الإضافي في Supabase");
        setTimeout(()=>{setSaveStatus("");setSaveErr("");},6000);
      }catch(e2){
        setSaveStatus("err");
        setSaveErr("خطأ في الحفظ: "+(e2?.message||String(e2)));
      }
    }
  };

  return (
    <div className="page" style={{padding:"16px 14px 0"}}>
      <Row style={{gap:10,marginBottom:saveErr?8:20}}>
        <button onClick={onBack} style={{background:T.card2,border:`1.5px solid ${T.border}`,borderRadius:12,padding:"7px 10px",cursor:"pointer",display:"flex",alignItems:"center"}}><Ic d={I.back} s={17} c={T.textS}/></button>
        <div style={{fontSize:19,fontWeight:900,color:T.text,flex:1}}>الملف الشخصي</div>
        <Btn sm onClick={saveP} disabled={saveStatus==="saving"} variant={saveStatus==="ok"?"success":saveStatus==="err"?"danger":"primary"}>
          {saveStatus==="saving"?"جاري الحفظ...":saveStatus==="ok"?<><Ic d={I.check} s={14} c={T.okText}/> تم ✓</>:saveStatus==="err"?"فشل ✗":<><Ic d={I.check} s={14}/> حفظ</>}
        </Btn>
      </Row>
      {saveErr&&<div style={{fontSize:12,color:saveStatus==="err"?T.warnText:T.accent,background:saveStatus==="err"?T.warn+"12":T.accent+"12",borderRadius:10,padding:"8px 12px",marginBottom:16,lineHeight:1.6}}>{saveErr}</div>}
      {/* Avatar */}
      <div style={{display:"flex",justifyContent:"center",marginBottom:24}}>
        <div style={{position:"relative"}}>
          <div className="press" onClick={()=>aRef.current.click()}
            style={{width:90,height:90,borderRadius:28,overflow:"hidden",background:T.card2,
            border:`2.5px solid ${T.accent}55`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
            {localProfile.avatar
              ?<img src={localProfile.avatar} style={{width:"100%",height:"100%",objectFit:"cover"}} alt="avatar"/>
              :<span style={{fontSize:40}}>🌸</span>}
          </div>
          <div style={{position:"absolute",bottom:-4,left:-4,width:28,height:28,borderRadius:999,
            background:`linear-gradient(135deg,${T.accent},${T.accentL})`,display:"flex",alignItems:"center",
            justifyContent:"center",border:`2px solid ${T.bg}`,cursor:"pointer"}}
            onClick={()=>aRef.current.click()}>
            <Ic d={I.camera} s={13} c="#fff"/>
          </div>
          <input ref={aRef} type="file" accept="image/*" style={{display:"none"}}
            onChange={e=>{(async()=>{
              const f=e.target.files[0]; if(!f) return;
              try{
                const ext=f.name.split(".").pop()||"jpg";
                const path=`avatars/${Date.now()}.${ext}`;
                const compressed=await compressImage(f,600,0.85);
                const [m,b]=compressed.split(","); const mime=m.match(/:(.*?);/)?.[1]||"image/jpeg";
                const bytes=atob(b); const arr=new Uint8Array(bytes.length);
                for(let i=0;i<bytes.length;i++) arr[i]=bytes.charCodeAt(i);
                const url=await sb.uploadFile("files",path,new Blob([arr],{type:mime}));
                set("avatar",url);
              }catch{
                // fallback to base64
                try{const data=await compressImage(f,600,0.85); set("avatar",data);}
                catch{const r=new FileReader();r.onload=ev=>set("avatar",ev.target.result);r.readAsDataURL(f);}
              }
            })();}}/>
        </div>
      </div>
      {localProfile.avatar&&(
        <div style={{textAlign:"center",marginTop:-16,marginBottom:16}}>
          <button onClick={()=>set("avatar",null)}
            style={{background:T.warn+"18",color:T.warnText,border:`1px solid ${T.warn}44`,borderRadius:10,padding:"5px 14px",fontSize:12,cursor:"pointer",fontFamily:"Tajawal,sans-serif"}}>
            حذف الصورة
          </button>
        </div>
      )}
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Inp label="الاسم" value={localProfile.name||""} onChange={e=>set("name",e.target.value)} placeholder="مجد القرشي"/>
        <Inp label="الإيميل" type="email" value={localProfile.email||""} onChange={e=>set("email",e.target.value)} placeholder="email@example.com"/>
        <Inp label="رابط خارجي ١" value={localProfile.link1||""} onChange={e=>set("link1",e.target.value)} placeholder="https://..."/>
        <Inp label="رابط خارجي ٢" value={localProfile.link2||""} onChange={e=>set("link2",e.target.value)} placeholder="https://..."/>
        <FileUploadSection label="البورتفوليو" accept=".pdf,.pptx,.zip,image/*" bucket="files" name={localProfile.portfolioName} file={localProfile.portfolioFile} onFile={(name,data)=>{set("portfolioName",name);set("portfolioFile",data);}} onClear={()=>{set("portfolioName",null);set("portfolioFile",null);}}/>
        <FileUploadSection label="السيرة الذاتية (CV)" accept=".pdf,.doc,.docx" bucket="files" name={localProfile.cvName} file={localProfile.cvFile} onFile={(name,data)=>{set("cvName",name);set("cvFile",data);}} onClear={()=>{set("cvName",null);set("cvFile",null);}}/>
      </div>
    </div>
  );
}

/* ── Creds Section (standalone component — fixes React hooks rules) ── */
function CredsSection({onBack, onPin}) {
  const T=useT();
  const [nu,setNu]=useState("");
  const [np,setNp]=useState("");
  const [cp,setCp]=useState("");
  const [perr,setPerr]=useState("");

    if(np.length<6){setPerr("كلمة السر يجب أن تكون 6 أحرف على الأقل");return;}

/* ══════════════════════════════════════
   INCOME TAB — صافي دخل مجد
══════════════════════════════════════ */
function IncomeTab({projects}) {
  const T=useT();
  const [fromDate,setFromDate]=useState("");
  const [toDate,setToDate]=useState("");

  // Helper: get income from project
  const getIncome=(p)=>{
    const dc=p.myDailyCalc||{};
    const sT=(parseFloat(dc.dailyRate)||0)*(parseFloat(dc.shootDays)||0);
    const pT=(parseFloat(dc.prepRate)||0)*(parseFloat(dc.prepDays)||0);
    const fx=parseFloat(dc.fixedAmount)||0;
    const total=fx>0&&!sT&&!pT?fx:sT+pT;
    return {
      shootDays:parseFloat(dc.shootDays)||0,
      prepDays:parseFloat(dc.prepDays)||0,
      dailyRate:parseFloat(dc.dailyRate)||0,
      prepRate:parseFloat(dc.prepRate)||0,
      fixedAmount:fx,
      shootTotal:sT,
      prepTotal:pT,
      total,
      isFixed:fx>0&&!sT&&!pT,
    };
  };

  // Filter projects with income data
  const allWithIncome=projects.filter(p=>getIncome(p).total>0);

  // Date filter
  const filtered=allWithIncome.filter(p=>{
    const d=p.startDate||p.createdAt?.split("T")[0]||"";
    if(fromDate&&d<fromDate) return false;
    if(toDate&&d>toDate) return false;
    return true;
  });

  // Sort by date
  const sorted=[...filtered].sort((a,b)=>{
    const da=a.startDate||a.createdAt||"";
    const db=b.startDate||b.createdAt||"";
    return da.localeCompare(db);
  });

  // Stats
  const totalIncome=sorted.reduce((s,p)=>s+getIncome(p).total,0);
  const totalShootDays=sorted.reduce((s,p)=>s+getIncome(p).shootDays,0);
  const totalPrepDays=sorted.reduce((s,p)=>s+getIncome(p).prepDays,0);

  const shootRates=sorted.filter(p=>getIncome(p).dailyRate>0).map(p=>getIncome(p).dailyRate);
  const prepRates=sorted.filter(p=>getIncome(p).prepRate>0).map(p=>getIncome(p).prepRate);
  const avgShoot=shootRates.length?Math.round(shootRates.reduce((a,b)=>a+b,0)/shootRates.length):0;
  const avgPrep=prepRates.length?Math.round(prepRates.reduce((a,b)=>a+b,0)/prepRates.length):0;

  const firstDate=sorted[0]?.startDate||sorted[0]?.createdAt?.split("T")[0]||"";
  const lastDate=sorted[sorted.length-1]?.startDate||sorted[sorted.length-1]?.createdAt?.split("T")[0]||"";

  return (
    <div className="page" style={{padding:"28px 14px 0"}}>
      <div style={{fontSize:20,fontWeight:900,color:T.text,marginBottom:4}}>صافي دخلي 💰</div>
      {firstDate&&lastDate&&<div style={{fontSize:12,color:T.muted,marginBottom:16}}>
        من {firstDate} إلى {lastDate}
      </div>}

      {/* Date filter */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
        <div>
          <label style={{fontSize:11,color:T.muted,fontWeight:600,display:"block",marginBottom:4}}>من تاريخ</label>
          <input type="date" value={fromDate} onChange={e=>setFromDate(e.target.value)}
            style={{background:T.card2,border:`1.5px solid ${T.border}`,borderRadius:12,padding:"9px 12px",color:T.text,fontSize:13,outline:"none",width:"100%",fontFamily:"Tajawal,sans-serif"}}/>
        </div>
        <div>
          <label style={{fontSize:11,color:T.muted,fontWeight:600,display:"block",marginBottom:4}}>إلى تاريخ</label>
          <input type="date" value={toDate} onChange={e=>setToDate(e.target.value)}
            style={{background:T.card2,border:`1.5px solid ${T.border}`,borderRadius:12,padding:"9px 12px",color:T.text,fontSize:13,outline:"none",width:"100%",fontFamily:"Tajawal,sans-serif"}}/>
        </div>
      </div>

      {/* Total income card */}
      <div style={{background:`linear-gradient(135deg,${T.accent},${T.accentL})`,borderRadius:22,padding:20,marginBottom:14,color:"#fff"}}>
        <div style={{fontSize:11,opacity:.8,fontWeight:600,marginBottom:4}}>إجمالي الدخل ({sorted.length} مشروع)</div>
        <div style={{fontSize:34,fontWeight:900,marginBottom:8}}>{fmt(totalIncome)}</div>
        <Row style={{gap:16}}>
          {totalShootDays>0&&<div><div style={{fontSize:10,opacity:.75}}>أيام تصوير</div><div style={{fontSize:16,fontWeight:800}}>{totalShootDays} يوم</div></div>}
          {totalPrepDays>0&&<div><div style={{fontSize:10,opacity:.75}}>أيام تحضير</div><div style={{fontSize:16,fontWeight:800}}>{totalPrepDays} يوم</div></div>}
        </Row>
      </div>

      {/* Averages */}
      {(avgShoot>0||avgPrep>0)&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
        {avgShoot>0&&<Card>
          <div style={{fontSize:11,color:T.muted,fontWeight:600,marginBottom:4}}>متوسط يومية التصوير</div>
          <div style={{fontSize:18,fontWeight:900,color:T.accent}}>{fmt(avgShoot)}</div>
        </Card>}
        {avgPrep>0&&<Card>
          <div style={{fontSize:11,color:T.muted,fontWeight:600,marginBottom:4}}>متوسط يومية التحضير</div>
          <div style={{fontSize:18,fontWeight:900,color:T.accent}}>{fmt(avgPrep)}</div>
        </Card>}
      </div>}

      {/* Projects list */}
      <div style={{fontSize:13,fontWeight:700,color:T.text,marginBottom:10}}>تفاصيل المشاريع</div>
      {sorted.length===0
        ?<Card style={{textAlign:"center",padding:36}}>
          <div style={{fontSize:36,marginBottom:8}}>💼</div>
          <div style={{color:T.muted,fontSize:13}}>لا توجد مشاريع بدخل محدد في هذه الفترة</div>
          <div style={{color:T.muted,fontSize:12,marginTop:6}}>أضيفي يومياتك عند إنشاء المشروع</div>
        </Card>
        :sorted.map(p=>{
          const inc=getIncome(p);
          const date=p.startDate||p.createdAt?.split("T")[0]||"";
          return (
            <Card key={p.id} style={{marginBottom:10}}>
              <Row style={{justifyContent:"space-between",marginBottom:8}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,fontWeight:800,color:T.text}}>{p.name}</div>
                  {date&&<div style={{fontSize:11,color:T.muted,marginTop:2}}>📅 {date}</div>}
                </div>
                <div style={{fontSize:18,fontWeight:900,color:T.accent}}>{fmt(inc.total)}</div>
              </Row>
              <Divider/>
              {inc.isFixed
                ?<Row style={{justifyContent:"space-between",marginTop:8,fontSize:12}}>
                  <span style={{color:T.muted}}>مبلغ ثابت</span>
                  <span style={{fontWeight:700,color:T.text}}>{fmt(inc.fixedAmount)}</span>
                </Row>
                :<div style={{marginTop:8,display:"flex",flexDirection:"column",gap:4}}>
                  {inc.shootDays>0&&<Row style={{justifyContent:"space-between",fontSize:12}}>
                    <span style={{color:T.muted}}>تصوير: {inc.shootDays} أيام × {fmt(inc.dailyRate)}</span>
                    <span style={{fontWeight:700,color:T.text}}>{fmt(inc.shootTotal)}</span>
                  </Row>}
                  {inc.prepDays>0&&<Row style={{justifyContent:"space-between",fontSize:12}}>
                    <span style={{color:T.muted}}>تحضير: {inc.prepDays} أيام × {fmt(inc.prepRate)}</span>
                    <span style={{fontWeight:700,color:T.text}}>{fmt(inc.prepTotal)}</span>
                  </Row>}
                </div>
              }
            </Card>
          );
        })
      }
    </div>
  );
}

function SettingsTab({themeId,onTheme,profile,onProfile,banks,onBanks,projects,onPin,onLogout,savedInvs,onOpenInv,onDelInv,savedQuotes,onOpenQuote,onDelQuote,vendors=[],setVendors=()=>{},customTags=[],setCustomTags=()=>{},audience=[],setAudience=()=>{},invitations=[],customInterests=[],setCustomInterests=()=>{},customCities=[],setCustomCities=()=>{},appMessage=null,appMessageUnread=false,onMarkAppMessageRead=()=>{},requestedSec=null,requestedVendor=null,onClearRequested=()=>{}}) {
  const T=useT();
  const [sec,setSec]=useState("main");
  // React to external "requestedSec" — used by global search to deep-link
  useEffect(()=>{
    if(requestedSec){
      setSec(requestedSec);
    }
  },[requestedSec]);
  const [copied,setCopied]=useState("");
  const [rpProj,setRpProj]=useState("all");
  const [rpTheme,setRpTheme]=useState("dark");
  const [rpIban,setRpIban]=useState("none");
  const [rpBank,setRpBank]=useState(0);
  const [rpKind,setRpKind]=useState("financial"); // financial | attendance | lifecycle
  const [rpAttProj,setRpAttProj]=useState("");
  const [rpLifeMode,setRpLifeMode]=useState("single"); // single | multi
  const [rpLifeProj,setRpLifeProj]=useState("");
  const [rpLifeSelected,setRpLifeSelected]=useState([]);
  const [filesTab,setFilesTab]=useState("reports");
  const [invSubTab,setInvSubTab]=useState("saved");
  const [exportProjId,setExportProjId]=useState("");
  const [exportBank,setExportBank]=useState("none");
  const [exportBankIdx,setExportBankIdx]=useState(0);
  const [invDiscOn,setInvDiscOn]=useState(false);
  const [invDiscType,setInvDiscType]=useState("fixed");
  const [invDiscValue,setInvDiscValue]=useState("");
  const [invNotes,setInvNotes]=useState("");
  const [rpNotes,setRpNotes]=useState("");

  const copy=(text,key)=>{ navigator.clipboard.writeText(text).then(()=>{setCopied(key);setTimeout(()=>setCopied(""),1800);}); };

  const genReport=async()=>{
    const FC=MWAY_EXPORT[rpTheme]||MWAY_EXPORT.dark;
    const bg=FC.bg;
    const cardBg=FC.card;
    const card2=FC.card2;
    const border=FC.border;
    const textMain=FC.text;
    const textMuted=FC.muted;
    const accent=FC.accent;
    const accentL=FC.accent;
    const okColor=FC.accent;
    const warnColor="#B94A3A";
    const headerBg=FC.headerBg;
    const headerText=FC.headerText;

    const filtered=rpProj==="all"?projects:projects.filter(p=>p.id===rpProj);
    const tB=filtered.reduce((s,p)=>s+(Number(p.budget)||0),0);
    const tC=filtered.reduce((s,p)=>s+(Number(p.custody)||0),0);
    const tP=filtered.reduce((s,p)=>(p.expenses||[]).filter(e=>e.paid&&!e.returned).reduce((a,e)=>a+e.amount,s),0);

function sanitizeSocialHandle(v){
  if(!v) return "";
  var s = String(v).trim();
  // strip leading @
  if(s.startsWith("@")) s = s.slice(1);
  // strip common URL prefixes so we store only the handle
  s = s.replace(/^https?:\/\/(www\.)?(instagram\.com|tiktok\.com)\//i,"");
  s = s.replace(/\/$/,"");
  return s;
}
function sanitizePhone(v){
  if(!v) return "";
  return String(v).replace(/[^0-9+]/g,"");
}
// Normalize any phone format → last 9 digits (Saudi mobile canonical)
// Handles: 05x, 5x, 966..., +966..., 00966..., Arabic numerals, spaces, dashes
function normalizePhone(v){
  if(!v) return "";
  var s = String(v);
  // Convert Arabic-Indic (٠١٢...) and Extended (۰۱۲...) to Western digits
  s = s.replace(/[٠-٩]/g, function(d){ return String.fromCharCode(d.charCodeAt(0)-0x0660+48); })
       .replace(/[۰-۹]/g, function(d){ return String.fromCharCode(d.charCodeAt(0)-0x06F0+48); });
  // Strip anything not a digit
  s = s.replace(/[^0-9]/g, "");
  // Take last 9 digits (drops any country code / leading zero / prefix)
  return s.slice(-9);
}

function audienceEventCount(audienceId, invitations){
  if(!invitations || !invitations.length) return 0;
  var n = 0;
  for(var i=0;i<invitations.length;i++){

function formatWhatsAppNumber(phone) {
  if(!phone) return "";
  let p = String(phone).replace(/[^0-9+]/g,"");
  if(p.startsWith("+")) return p.slice(1);
  if(p.startsWith("00")) return p.slice(2);
  if(p.startsWith("966")) return p;
  if(p.startsWith("0")) return "966"+p.slice(1);
  return "966"+p;
}

function NotificationsSection({onBack, userRole="director"}) {
  const T=useT();
  const [permissionState,setPermissionState]=useState(typeof Notification !== "undefined" ? Notification.permission : "default");
  const [subscriptions,setSubscriptions]=useState([]);
  const [currentEndpoint,setCurrentEndpoint]=useState(null);
  const [loading,setLoading]=useState(false);
  const [toast,setToast]=useState("");

  const showToast=(m)=>{setToast(m);setTimeout(()=>setToast(""),2400);};
  const userId=()=>{
    if(userRole==="director") return sb.getUserEmail()||"director";
    return "member"; // updated in Session 2 when we extend to members
  };

  // Load existing subscriptions for this user from Supabase
  const reload=async()=>{
    try{
      const rows=await sb.get("push_subscriptions",`?user_id=eq.${encodeURIComponent(userId())}&order=created_at.desc`);
      setSubscriptions(rows||[]);
    }catch(err){console.warn(err);}
  };

  // Check the current device's current subscription (if any) to know if THIS device is subscribed
  const refreshCurrent=async()=>{
    try{
      if(!pushSupported()) return;
      const reg=await navigator.serviceWorker.ready;
      const sub=await reg.pushManager.getSubscription();
      setCurrentEndpoint(sub?sub.endpoint:null);
    }catch(err){console.warn(err);}
  };

  useEffect(()=>{
    reload();
    refreshCurrent();
  },[]);

  const enable=async()=>{
    if(!pushSupported()){
      alert("متصفحك لا يدعم الإشعارات. تأكدي إن التطبيق مثبت من 'Add to Home Screen' وافتحيه من الشاشة الرئيسية مش من Safari.");
      return;
    }
    setLoading(true);
    let stage="بدء";
    // Helper: race a promise against a timeout
    const withTimeout=(promise,ms,msg)=>Promise.race([
      promise,
      new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))
    ]);
    try{
      // Stage 1: Permission FIRST (preserves user gesture context on iOS)
      stage="طلب الإذن";
      let perm=Notification.permission;
      if(perm==="default"){
        perm=await Notification.requestPermission();
      }
      setPermissionState(perm);
      if(perm!=="granted"){
        showToast("لازم تسمحي بالإشعارات");
        setLoading(false);
        return;
      }

      // Stage 2: Register the Service Worker (await it — don't trust auto-register)
      stage="تسجيل Service Worker";
      const reg=await withTimeout(
        navigator.serviceWorker.register("sw.js"),
        10000,
        "فشل تسجيل Service Worker — تأكدي من رفع ملف sw.js على Netlify"
      );

      // Stage 3: Wait for SW to be active
      stage="انتظار تفعيل SW";
      await withTimeout(navigator.serviceWorker.ready,10000,"Service Worker لم يصبح active خلال 10 ثوان");

      // Stage 4: Subscribe to push (reuse if exists)
      stage="الاشتراك في الـpush";
      let sub=await reg.pushManager.getSubscription();
      if(!sub){
        sub=await withTimeout(
          reg.pushManager.subscribe({
            userVisibleOnly:true,
            applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
          }),
          15000,
          "فشل الاشتراك في خدمة الـpush"
        );
      }

      // Stage 5: Save to Supabase
      stage="حفظ في قاعدة البيانات";
      const j=sub.toJSON();
      const payload={
        user_id:userId(),
        user_role:userRole,
        device_label:detectDeviceLabel(),
        endpoint:j.endpoint,
        p256dh_key:(j.keys&&j.keys.p256dh)||"",
        auth_key:(j.keys&&j.keys.auth)||"",
        enabled:true,
        last_used_at:new Date().toISOString(),
      };
      try{
        await withTimeout(sb.post("push_subscriptions",payload),10000,"Supabase POST timeout");
      }catch(err){
        // Likely UNIQUE conflict on endpoint — patch the existing row instead
        const existing=await sb.get("push_subscriptions",`?endpoint=eq.${encodeURIComponent(j.endpoint)}`);
        if(existing&&existing[0]){
          await sb.patch("push_subscriptions",existing[0].id,{enabled:true,last_used_at:new Date().toISOString(),device_label:detectDeviceLabel()});
        } else {
          throw err;
        }
      }

      setCurrentEndpoint(j.endpoint);
      showToast("تم تفعيل الإشعارات ✓");
      await reload();
    }catch(err){
      console.error("[push] failed at stage:",stage,err);
      alert("علّق في خطوة: \""+stage+"\"\n\nالخطأ: "+(err.message||err));
    }
    setLoading(false);
  };

  const disable=async(endpoint)=>{
    // Soft-disable in DB (keep the row for analytics) + unsubscribe locally
    if(!confirm("إيقاف الإشعارات على هذا الجهاز؟")) return;
    setLoading(true);
    try{
      const existing=await sb.get("push_subscriptions",`?endpoint=eq.${encodeURIComponent(endpoint)}`);
      if(existing&&existing[0]) await sb.patch("push_subscriptions",existing[0].id,{enabled:false});
      // If it's the current device, also unsubscribe locally
      if(endpoint===currentEndpoint){
        const reg=await navigator.serviceWorker.ready;
        const sub=await reg.pushManager.getSubscription();
        if(sub) await sub.unsubscribe();
        setCurrentEndpoint(null);
      }
      showToast("تم الإيقاف ✓");
      await reload();
    }catch(err){console.error(err);showToast("خطأ");}
    setLoading(false);
  };

  const reEnable=async(endpoint)=>{
    setLoading(true);
    try{
      const existing=await sb.get("push_subscriptions",`?endpoint=eq.${encodeURIComponent(endpoint)}`);
      if(existing&&existing[0]) await sb.patch("push_subscriptions",existing[0].id,{enabled:true});
      showToast("تم التفعيل ✓");
      await reload();
    }catch(err){console.error(err);showToast("خطأ");}
    setLoading(false);
  };

  const remove=async(id)=>{
    if(!confirm("حذف هذا الجهاز نهائياً من القائمة؟")) return;
    setLoading(true);
    try{
      await sb.del("push_subscriptions",id);
      showToast("تم الحذف ✓");
      await reload();
    }catch(err){console.error(err);showToast("خطأ");}
    setLoading(false);
  };

  const fmtDate=(s)=>{try{return new Date(s).toLocaleDateString("ar-SA",{year:"numeric",month:"short",day:"numeric"});}catch{return s||"";}};
  const supported=pushSupported();
  const thisDeviceLabel=detectDeviceLabel();
  const isThisSubscribed=currentEndpoint&&subscriptions.find(s=>s.endpoint===currentEndpoint&&s.enabled);

  return (
    <div className="page" style={{padding:"16px 14px 0"}}>
      <Row style={{gap:10,marginBottom:20}}>
        <Btn variant="ghost" sm onClick={onBack} style={{padding:"7px 10px"}}><Ic d={I.back} s={17} c={T.textS}/></Btn>
        <div style={{fontSize:19,fontWeight:900,color:T.text,flex:1}}>الإشعارات</div>
      </Row>

      {!supported&&<Card style={{background:T.warn+"15",border:`1.5px solid ${T.warn}44`,marginBottom:14}}>
        <div style={{fontSize:13,color:T.warnText,fontWeight:700,marginBottom:4}}>⚠️ المتصفح لا يدعم الإشعارات</div>
        <div style={{fontSize:12,color:T.muted}}>تأكدي إن التطبيق مثبت من Safari عبر "إضافة للشاشة الرئيسية" (Add to Home Screen)، ثم افتحي التطبيق من الشاشة الرئيسية مباشرة.</div>
      </Card>}

      {supported&&<>
        {/* This device card */}
        <Card style={{marginBottom:14,background:isThisSubscribed?T.ok+"15":T.card2,border:`1.5px solid ${isThisSubscribed?T.ok+"55":T.border}`}}>
          <Row style={{justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
            <div>
              <div style={{fontSize:9,color:T.muted,fontFamily:"'DM Mono',monospace",letterSpacing:"0.16em",textTransform:"uppercase",fontWeight:500,marginBottom:4}}>هذا الجهاز</div>
              <div style={{fontSize:16,fontWeight:800,color:T.text}}>📱 {thisDeviceLabel}</div>
            </div>
            {isThisSubscribed?<div style={{fontSize:11,color:T.okText,background:T.ok+"22",border:`1px solid ${T.ok}55`,borderRadius:999,padding:"3px 10px",fontFamily:"'DM Mono',monospace",letterSpacing:"0.08em",fontWeight:700}}>✓ مفعّل</div>
                              :<div style={{fontSize:11,color:T.muted,background:T.card2,border:`1px solid ${T.border}`,borderRadius:999,padding:"3px 10px",fontFamily:"'DM Mono',monospace",letterSpacing:"0.08em",fontWeight:700}}>غير مفعّل</div>}
          </Row>

          {!isThisSubscribed&&<Btn full onClick={enable} disabled={loading}>
            {loading?"جاري التفعيل...":<><Ic d={I.bell} s={16}/> تفعيل الإشعارات على هذا الجهاز</>}
          </Btn>}
          {isThisSubscribed&&<button onClick={()=>disable(currentEndpoint)} disabled={loading} className="press"
            style={{width:"100%",background:T.warn+"15",color:T.warnText,border:`1.5px solid ${T.warn}44`,borderRadius:10,padding:"10px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans','Tajawal',sans-serif"}}>
            إيقاف الإشعارات على هذا الجهاز
          </button>}

          {permissionState==="denied"&&<div style={{fontSize:11,color:T.warnText,marginTop:10,padding:"8px 10px",background:T.warn+"15",border:`1px solid ${T.warn}33`,borderRadius:8}}>
            ⚠️ الإذن مرفوض من إعدادات النظام. اذهبي لإعدادات iPhone → الإشعارات → m-way وفعّليها يدوياً.
          </div>}
        </Card>

        {/* All registered devices */}
        {subscriptions.length>0&&<>
          <div style={{fontSize:9,color:T.muted,fontFamily:"'DM Mono',monospace",letterSpacing:"0.16em",textTransform:"uppercase",fontWeight:500,marginBottom:8}}>كل الأجهزة المسجّلة · {subscriptions.length}</div>
          {subscriptions.map(s=>{
            const isThis=s.endpoint===currentEndpoint;
            return (
              <Card key={s.id} style={{marginBottom:8,opacity:s.enabled?1:0.55}}>
                <Row style={{justifyContent:"space-between",alignItems:"center",gap:8}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:700,color:T.text}}>📱 {s.device_label||"غير معروف"} {isThis&&<span style={{fontSize:10,color:T.accent,fontWeight:600}}>(هذا الجهاز)</span>}</div>
                    <div style={{fontSize:10,color:T.muted,fontFamily:"'DM Mono',monospace",marginTop:2}}>أُضيف {fmtDate(s.created_at)} · {s.enabled?"مفعّل":"موقوف"}</div>
                  </div>
                  <Row style={{gap:4}}>
                    {s.enabled?
                      <button className="press" onClick={()=>disable(s.endpoint)} disabled={loading} title="إيقاف"
                        style={{background:T.card2,border:`1px solid ${T.border}`,borderRadius:8,padding:"6px 10px",fontSize:11,color:T.text,cursor:"pointer",fontFamily:"'DM Sans','Tajawal',sans-serif"}}>إيقاف</button>

                        style={{background:T.ok+"22",border:`1px solid ${T.ok}55`,borderRadius:8,padding:"6px 10px",fontSize:11,color:T.okText,cursor:"pointer",fontFamily:"'DM Sans','Tajawal',sans-serif"}}>تفعيل</button>

                  </Row>
                </Row>
              </Card>

          })}
        </>}

        {subscriptions.length===0&&isThisSubscribed===false&&<Card style={{textAlign:"center",padding:32,marginTop:10}}>
          <div style={{fontSize:42,marginBottom:8}}>🔔</div>
          <div style={{color:T.muted,fontSize:13}}>لا يوجد جهاز مفعّل بعد</div>

        <div style={{fontSize:11,color:T.muted,marginTop:18,padding:"10px 12px",background:T.card2,border:`1px solid ${T.border}`,borderRadius:10}}>

      {toast&&<div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:T.ok,color:"#fff",borderRadius:12,padding:"10px 20px",fontSize:13,fontWeight:700,zIndex:300,fontFamily:"'DM Sans','Tajawal',sans-serif"}}>{toast}</div>}

function VendorsSection({onBack,vendors,setVendors,customTags,setCustomTags,requestedVendor=null,onClearRequested=()=>{}}) {
  const T=useT();
  const allTags=[...VENDOR_TAGS_PRESET,...(customTags||[])];
  const [editing,setEditing]=useState(null);
  // Auto-open the vendor passed via global search
  useEffect(()=>{
    if(requestedVendor){
      // Try to match a fresh copy from current `vendors` list (in case it was updated)
      const fresh=vendors.find(v=>v.id===requestedVendor.id)||requestedVendor;
      setEditing(fresh);
      onClearRequested();
    }
  },[requestedVendor]);
  const [filterTags,setFilterTags]=useState([]);
  const [searchText,setSearchText]=useState("");
  const [sortBy,setSortBy]=useState("rating");

  const avg=(v)=>(((v.rate_quality||0)+(v.rate_price||0)+(v.rate_speed||0))/3);

  const filtered=vendors.filter(v=>{
    if(searchText){
      const q=searchText.toLowerCase();
      if(!((v.name||"").toLowerCase().includes(q)||(v.phone||"").includes(searchText)||(v.notes||"").toLowerCase().includes(q))) return false;
    }
    if(filterTags.length&&!filterTags.every(t=>(v.tags||[]).includes(t))) return false;
    return true;
  }).sort((a,b)=>{
    if(sortBy==="name") return (a.name||"").localeCompare(b.name||"","ar");
    if(sortBy==="recent") return new Date(b.created_at||0)-new Date(a.created_at||0);
    return avg(b)-avg(a);
  });

  const toggleFilter=(tag)=>setFilterTags(prev=>prev.includes(tag)?prev.filter(t=>t!==tag):[...prev,tag]);

  return (
    <div className="page" style={{padding:"16px 14px 0"}}>
      <Row style={{gap:10,marginBottom:14}}>
        <Btn variant="ghost" sm onClick={onBack} style={{padding:"7px 10px"}}><Ic d={I.back} s={17} c={T.textS}/></Btn>
        <div style={{fontSize:19,fontWeight:900,color:T.text,flex:1}}>الموردين</div>
        <Btn sm onClick={()=>setEditing("new")}><Ic d={I.plus} s={14}/> إضافة</Btn>
      </Row>

      <input value={searchText} onChange={e=>setSearchText(e.target.value)} placeholder="🔍 ابحث (اسم، رقم، ملاحظات)"
        style={{width:"100%",background:T.card2,border:`1px solid ${T.border}`,borderRadius:10,padding:"10px 14px",color:T.text,fontSize:14,outline:"none",fontFamily:"'DM Sans','Tajawal',sans-serif",direction:"rtl",marginBottom:10}}/>

      <Row style={{gap:6,marginBottom:10,alignItems:"center"}}>
        <span style={{fontSize:9,color:T.muted,fontFamily:"'DM Mono',monospace",letterSpacing:"0.16em",textTransform:"uppercase",fontWeight:500}}>الترتيب</span>
        {[["rating","التقييم"],["name","الاسم"],["recent","الأحدث"]].map(([v,l])=>(
          <button key={v} className="press" onClick={()=>setSortBy(v)}
            style={{background:sortBy===v?T.accent+"22":"transparent",border:`1px solid ${sortBy===v?T.accent:T.border}`,color:sortBy===v?T.accent:T.muted,borderRadius:7,padding:"4px 10px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans','Tajawal',sans-serif"}}>
            {l}
          </button>
        ))}
      </Row>

      <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:8,marginBottom:14,WebkitOverflowScrolling:"touch"}}>
        <button className="press" onClick={()=>setFilterTags([])}
          style={{background:filterTags.length===0?T.accent+"22":T.card2,border:`1px solid ${filterTags.length===0?T.accent:T.border}`,color:filterTags.length===0?T.accent:T.text,borderRadius:999,padding:"6px 14px",fontSize:12,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"'DM Sans','Tajawal',sans-serif",flexShrink:0}}>
          الكل
        </button>
        {allTags.map(tag=>(
          <button key={tag} className="press" onClick={()=>toggleFilter(tag)}
            style={{background:filterTags.includes(tag)?T.accent+"22":T.card2,border:`1px solid ${filterTags.includes(tag)?T.accent:T.border}`,color:filterTags.includes(tag)?T.accent:T.text,borderRadius:999,padding:"6px 14px",fontSize:12,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"'DM Sans','Tajawal',sans-serif",flexShrink:0}}>
            {tag}
          </button>
        ))}
      </div>

      {filtered.length===0&&(
        <Card style={{textAlign:"center",padding:36}}>
          <div style={{fontSize:36,marginBottom:10}}>🏬</div>
          <div style={{color:T.muted,fontSize:13,marginBottom:14}}>{vendors.length===0?"لم تُضف موردين بعد":"لا نتائج مطابقة"}</div>
          {vendors.length===0&&<Btn onClick={()=>setEditing("new")}><Ic d={I.plus} s={14}/> أضيفي أول مورد</Btn>}
        </Card>
      )}

      {filtered.map(v=>{
        const initial=(v.name||"؟").trim().charAt(0)||"؟";
        const waNum=formatWhatsAppNumber(v.phone);
        const hasRating=(v.rate_quality||0)>0||(v.rate_price||0)>0||(v.rate_speed||0)>0;
        return (
          <Card key={v.id} style={{marginBottom:10,cursor:"pointer"}} onClick={()=>setEditing(v)}>
            <Row style={{gap:12,alignItems:"flex-start"}}>
              <div style={{width:44,height:44,borderRadius:12,background:T.accent+"22",color:T.accent,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,fontWeight:800,flexShrink:0,fontFamily:"'DM Sans','Tajawal',sans-serif"}}>{initial}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:15,fontWeight:800,color:T.text,marginBottom:4}}>{v.name||"بدون اسم"}</div>
                {(v.tags||[]).length>0&&(
                  <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:6}}>
                    {(v.tags||[]).slice(0,3).map(t=>(
                      <span key={t} style={{fontSize:10,color:T.muted,background:T.card2,border:`1px solid ${T.border}`,borderRadius:999,padding:"2px 8px",fontFamily:"'DM Mono',monospace"}}>{t}</span>
                    ))}
                    {(v.tags||[]).length>3&&<span style={{fontSize:10,color:T.muted,padding:"2px 4px"}}>+{(v.tags||[]).length-3}</span>}
                  </div>
                )}
                {hasRating&&(
                  <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:6}}>
                    <span style={{fontSize:12,fontWeight:700,color:T.text,fontFamily:"'DM Sans',sans-serif"}}>⭐ {v.rate_quality||0}</span>
                    <span style={{fontSize:12,fontWeight:700,color:T.text,fontFamily:"'DM Sans',sans-serif"}}>💰 {v.rate_price||0}</span>
                    <span style={{fontSize:12,fontWeight:700,color:T.text,fontFamily:"'DM Sans',sans-serif"}}>⚡ {v.rate_speed||0}</span>
                  </div>
                )}
                {v.phone&&<div style={{fontSize:12,color:T.muted,fontFamily:"monospace",direction:"ltr",textAlign:"right"}}>{v.phone}</div>}
              </div>
              {v.phone&&(
                <div style={{display:"flex",gap:6,flexShrink:0}} onClick={e=>e.stopPropagation()}>
                  <a href={"tel:"+v.phone} className="press" style={{width:36,height:36,borderRadius:10,background:T.ok+"22",border:`1px solid ${T.ok}55`,display:"flex",alignItems:"center",justifyContent:"center",textDecoration:"none",fontSize:16}}>📞</a>
                  <a href={"https://wa.me/"+waNum} target="_blank" rel="noopener" className="press" style={{width:36,height:36,borderRadius:10,background:"#25D36622",border:"1px solid #25D36655",display:"flex",alignItems:"center",justifyContent:"center",textDecoration:"none",fontSize:16}}>💬</a>
                </div>
              )}
            </Row>
          </Card>
        );
      })}

      {editing&&<VendorEditModal vendor={editing==="new"?null:editing} customTags={customTags} setCustomTags={setCustomTags}
        onSave={async(v)=>{
          const isNew=!v.id;
          if(isNew){
            try{
              const created=await sb.post("vendors",{name:v.name,tags:v.tags||[],phone:v.phone||null,rate_quality:v.rate_quality||null,rate_price:v.rate_price||null,rate_speed:v.rate_speed||null,notes:v.notes||null});
              const row=Array.isArray(created)?created[0]:created;
              setVendors(prev=>[row,...prev]);
            }catch(err){alert("فشل الحفظ: "+(err.message||err));return;}
          } else {
            try{
              await sb.patch("vendors",v.id,{name:v.name,tags:v.tags||[],phone:v.phone||null,rate_quality:v.rate_quality||null,rate_price:v.rate_price||null,rate_speed:v.rate_speed||null,notes:v.notes||null,updated_at:new Date().toISOString()});
              setVendors(prev=>prev.map(x=>x.id===v.id?{...x,...v}:x));
            }catch(err){alert("فشل التحديث: "+(err.message||err));return;}
          }
          setEditing(null);
        }}
        onDelete={async()=>{
          if(!confirm("حذف هذا المورد؟")) return;
          const id=editing.id;
          try{await sb.del("vendors",id);setVendors(prev=>prev.filter(x=>x.id!==id));setEditing(null);}
          catch(err){alert("فشل الحذف: "+(err.message||err));}
        }}
        onClose={()=>setEditing(null)}/>}
    </div>
  );
}

function VendorEditModal({vendor,customTags,setCustomTags,onSave,onDelete,onClose}) {
  const T=useT();
  const allTags=[...VENDOR_TAGS_PRESET,...(customTags||[])];
  const [v,setV]=useState(vendor||{name:"",tags:[],phone:"",rate_quality:0,rate_price:0,rate_speed:0,notes:""});
  const [busy,setBusy]=useState(false);
  const isNew=!vendor;
  const set=(k,val)=>setV(prev=>({...prev,[k]:val}));
  const toggleTag=(tag)=>set("tags",(v.tags||[]).includes(tag)?(v.tags||[]).filter(t=>t!==tag):[...(v.tags||[]),tag]);
  const addCustomTag=()=>{
    const name=prompt("اسم التصنيف المخصص:");
    if(!name||!name.trim()) return;
    const trimmed=name.trim();
    if(allTags.includes(trimmed)){alert("هذا التصنيف موجود مسبقاً");return;}
    const newCustom=[...(customTags||[]),trimmed];
    setCustomTags(newCustom);
    LS.set("custom_vendor_tags",newCustom);
    set("tags",[...(v.tags||[]),trimmed]);
  };
  const save=async()=>{
    if(!v.name||!v.name.trim()){alert("اسم المورد مطلوب");return;}
    setBusy(true);
    await onSave(v);
    setBusy(false);
  };
  const initial=(v.name||"؟").trim().charAt(0)||"؟";
  return (

function loadSheetJS(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(window.__xlsxPromise) return window.__xlsxPromise;
  window.__xlsxPromise = new Promise(function(res,rej){
    var s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload=function(){res(window.XLSX);};
    s.onerror=function(){rej(new Error("فشل تحميل مكتبة الاستيراد"));};
    document.head.appendChild(s);
  });
  return window.__xlsxPromise;
}

    }
    if(filterGender && a.gender!==filterGender) return false;

    if(filterInterests.length && !filterInterests.every(t=>(a.interests||[]).includes(t))) return false;

      if(filterVisit==="1-2" && (v<1||v>2)) return false;

    }
    return true;
  }).sort((a,b)=>{
    if(sortBy==="name") return (a.name||"").localeCompare(b.name||"","ar");
    if(sortBy==="visits") return visitOf(b)-visitOf(a);
    return new Date(b.created_at||0)-new Date(a.created_at||0);

        <Btn sm onClick={()=>setEditing("new")}><Ic d={I.plus} s={14}/> إضافة</Btn>

      {/* Stats strip */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:12}}>
        {[["الكل",stats.total],["حضروا",stats.withVisits],["♂ ذكور",stats.male],["♀ إناث",stats.female]].map(([l,v])=>(
          <div key={l} style={{background:T.card2,border:`1px solid ${T.border}`,borderRadius:11,padding:"8px 6px",textAlign:"center"}}>
            <div style={{fontSize:16,fontWeight:800,color:T.text}}>{v}</div>
            <div style={{fontSize:10,color:T.muted,marginTop:2}}>{l}</div>
          </div>
        ))}
      </div>

      <input value={searchText} onChange={e=>setSearchText(e.target.value)} placeholder="🔍 ابحث (اسم، انستقرام، جوال، مدينة...)"
        style={{width:"100%",background:T.card2,border:`1px solid ${T.border}`,borderRadius:10,padding:"10px 14px",color:T.text,fontSize:14,outline:"none",fontFamily:"'DM Sans','Tajawal',sans-serif",direction:"rtl",marginBottom:10}}/>

      <Row style={{gap:8,marginBottom:10,alignItems:"center"}}>
        <button className="press" onClick={()=>setShowFilters(!showFilters)}
          style={{background:activeFilterCount?T.accent+"22":"transparent",border:`1px solid ${activeFilterCount?T.accent:T.border}`,color:activeFilterCount?T.accent:T.textS,borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans','Tajawal',sans-serif"}}>
          ⚙ فلاتر {activeFilterCount?`(${activeFilterCount})`:""}

        )}
        <div style={{flex:1}}/>
        <span style={{fontSize:9,color:T.muted,fontFamily:"'DM Mono',monospace",letterSpacing:"0.16em",textTransform:"uppercase",fontWeight:500}}>ترتيب</span>
        {[["recent","الأحدث"],["name","الاسم"],["visits","الحضور"]].map(([v,l])=>(
          <button key={v} className="press" onClick={()=>setSortBy(v)}
            style={{background:sortBy===v?T.accent+"22":"transparent",border:`1px solid ${sortBy===v?T.accent:T.border}`,color:sortBy===v?T.accent:T.muted,borderRadius:7,padding:"4px 8px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans','Tajawal',sans-serif"}}>{l}</button>
        ))}

      {showFilters&&(
        <div style={{background:T.card2,border:`1px solid ${T.border}`,borderRadius:12,padding:"10px 12px",marginBottom:10}}>
          <div style={{fontSize:11,color:T.muted,marginBottom:6,fontWeight:600}}>الجنس</div>
          <Row style={{gap:6,marginBottom:10,flexWrap:"wrap"}}>
            {[["","الكل"],["male","♂ ذكر"],["female","♀ أنثى"]].map(([v,l])=>(
              <button key={v||"any"} className="press" onClick={()=>setFilterGender(v)}
                style={{background:filterGender===v?T.accent+"22":"transparent",border:`1px solid ${filterGender===v?T.accent:T.border}`,color:filterGender===v?T.accent:T.textS,borderRadius:7,padding:"5px 12px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans','Tajawal',sans-serif"}}>{l}</button>
            ))}
          </Row>

          <div style={{fontSize:11,color:T.muted,marginBottom:6,fontWeight:600}}>عدد الزيارات</div>
          <Row style={{gap:6,marginBottom:10,flexWrap:"wrap"}}>
            {[["all","الكل"],["0","لم يحضر"],["1-2","1-2 زيارة"],["3+","3+ زيارات"]].map(([v,l])=>(
              <button key={v} className="press" onClick={()=>setFilterVisit(v)}
                style={{background:filterVisit===v?T.accent+"22":"transparent",border:`1px solid ${filterVisit===v?T.accent:T.border}`,color:filterVisit===v?T.accent:T.textS,borderRadius:7,padding:"5px 12px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans','Tajawal',sans-serif"}}>{l}</button>
            ))}
          </Row>

          {allCities.length>0&&<>
            <div style={{fontSize:11,color:T.muted,marginBottom:6,fontWeight:600}}>المدن</div>
            <Row style={{gap:6,marginBottom:10,flexWrap:"wrap"}}>
              {allCities.map(c=>(
                <button key={c} className="press" onClick={()=>toggleCity(c)}
                  style={{background:filterCities.includes(c)?T.accent+"22":"transparent",border:`1px solid ${filterCities.includes(c)?T.accent:T.border}`,color:filterCities.includes(c)?T.accent:T.textS,borderRadius:7,padding:"5px 10px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans','Tajawal',sans-serif"}}>{c}</button>
              ))}
            </Row>
          </>}

          {allInterests.length>0&&<>
            <div style={{fontSize:11,color:T.muted,marginBottom:6,fontWeight:600}}>الاهتمامات</div>
            <Row style={{gap:6,flexWrap:"wrap"}}>
              {allInterests.map(i=>(
                <button key={i} className="press" onClick={()=>toggleInterest(i)}
                  style={{background:filterInterests.includes(i)?T.accent+"22":"transparent",border:`1px solid ${filterInterests.includes(i)?T.accent:T.border}`,color:filterInterests.includes(i)?T.accent:T.textS,borderRadius:7,padding:"5px 10px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans','Tajawal',sans-serif"}}>{i}</button>
              ))}
            </Row>
          </>}
        </div>
      )}

      <div style={{fontSize:11,color:T.muted,marginBottom:8,fontFamily:"'DM Mono',monospace",letterSpacing:"0.1em",fontWeight:500}}>
        {filtered.length} {filtered.length===1?"شخص":"شخصاً"} {filtered.length!==audience.length?`من أصل ${audience.length}`:""}
      </div>

      {filtered.length===0?(
        <div style={{textAlign:"center",padding:"40px 20px",color:T.muted}}>
          {audience.length===0?(
            <><div style={{fontSize:36,marginBottom:8}}>🎪</div>
            <div style={{fontSize:14,marginBottom:4}}>لا يوجد أحد في القائمة بعد</div>
            <div style={{fontSize:11}}>ابدئي بإضافة شخص أو استيراد ملف Excel</div></>
          ):(
            <><div style={{fontSize:36,marginBottom:8}}>🤷</div>
            <div style={{fontSize:14}}>لا توجد نتائج بهذه الفلاتر</div></>
          )}
        </div>
      ):(
        <div style={{paddingBottom:20}}>
          {filtered.map(a=>{
            const v=visitOf(a);
            return (
              <div key={a.id} className="press card-hover" onClick={()=>setEditing(a)}
                style={{background:T.card,border:`1.5px solid ${T.border}`,borderRadius:14,padding:"12px 14px",marginBottom:8,cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:38,height:38,borderRadius:"50%",background:a.gender==="female"?"#f59fc4":a.gender==="male"?"#5fb3ff":T.muted+"44",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,color:"#fff",fontWeight:700,flexShrink:0}}>{(a.name||"?").trim().charAt(0)}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,fontWeight:700,color:T.text,marginBottom:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.name||"—"}</div>
                  <div style={{fontSize:11,color:T.muted,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    {[a.city,a.company,(a.interests||[]).slice(0,3).join(" · ")].filter(Boolean).join(" · ")||"—"}
                  </div>
                  {(a.instagram||a.phone)&&(
                    <div style={{fontSize:10,color:T.textS,marginTop:2,fontFamily:"'DM Mono',monospace"}} dir="ltr">

                  )}

                  <div style={{fontSize:16,fontWeight:800,color:v>0?T.accent:T.muted}}>{v}</div>
                  <div style={{fontSize:9,color:T.muted,fontFamily:"'DM Mono',monospace",letterSpacing:"0.08em"}}>ZYARAT</div>

      )}

      {editing&&<AudienceEditModal person={editing==="new"?null:editing} allInterests={allInterests} allCities={allCities}
        customInterests={customInterests} setCustomInterests={setCustomInterests}
        customCities={customCities} setCustomCities={setCustomCities}
        onClose={()=>setEditing(null)}
        onSave={async(payload)=>{
          try{
            if(editing==="new"){
              const [created]=await sb.post("audience",payload);
              setAudience(prev=>[created,...prev]);
            } else {
              const patch={...payload,updated_at:new Date().toISOString()};
              await sb.patch("audience",editing.id,patch);
              setAudience(prev=>prev.map(x=>x.id===editing.id?{...x,...payload}:x));
            }
            setEditing(null);
          }catch(e){ alert("فشل الحفظ: "+(e.message||e)); }
        }}
        onDelete={async(id)=>{
          if(!confirm("حذف هذا الشخص؟ سيتم حذف سجل الحضور المرتبط.")) return;
          try{ await sb.del("audience",id); setAudience(prev=>prev.filter(x=>x.id!==id)); setEditing(null); }
          catch(e){ alert("فشل الحذف: "+(e.message||e)); }
        }}
        eventCount={editing!=="new"&&editing?audienceEventCount(editing.id,invitations):0}
        attendedEvents={editing!=="new"&&editing?invitations.filter(i=>i.audience_id===editing.id&&i.attended).map(i=>{const p=projects.find(pr=>pr.id===i.project_id); return {invitation:i,project:p};}).filter(x=>x.project):[]}
      />}

      {importOpen&&<AudienceImportModal existing={audience} onClose={()=>setImportOpen(false)}
        onImport={async(rows)=>{
          try{
            const created=[];
            for(let i=0;i<rows.length;i++){
              const [c]=await sb.post("audience",rows[i]);
              created.push(c);
            }
            setAudience(prev=>[...created,...prev]);
            setImportOpen(false);
            alert(`تم استيراد ${created.length} شخص بنجاح ✓`);
          }catch(e){ alert("فشل الاستيراد: "+(e.message||e)); }
        }}
      />}
    </div>
  );
}

function AudienceEditModal({person,allInterests,allCities,customInterests,setCustomInterests,customCities,setCustomCities,onClose,onSave,onDelete,eventCount=0,attendedEvents=[]}){
  const T=useT();
  const [name,setName]=useState(person?.name||"");
  const [company,setCompany]=useState(person?.company||"");
  const [instagram,setInstagram]=useState(person?.instagram||"");
  const [tiktok,setTiktok]=useState(person?.tiktok||"");
  const [phone,setPhone]=useState(person?.phone||"");
  const [city,setCity]=useState(person?.city||"");
  const [gender,setGender]=useState(person?.gender||"");
  const [interests,setInterests]=useState(person?.interests||[]);
  const [notes,setNotes]=useState(person?.notes||"");
  const [manualVisits,setManualVisits]=useState(String(person?.manual_visits||0));
  const [newInterestInput,setNewInterestInput]=useState("");
  const [newCityInput,setNewCityInput]=useState("");
  const [saving,setSaving]=useState(false);

  const toggleInterest=(i)=>setInterests(prev=>prev.includes(i)?prev.filter(x=>x!==i):[...prev,i]);
  const addCustomInterest=()=>{
    const v=newInterestInput.trim();
    if(!v) return;
    if(!allInterests.includes(v)){
      const upd=[...(customInterests||[]),v];
      setCustomInterests(upd); LS.set("custom_interests",upd);
    }
    if(!interests.includes(v)) setInterests(prev=>[...prev,v]);
    setNewInterestInput("");
  };
  const addCustomCity=()=>{
    const v=newCityInput.trim();
    if(!v) return;
    if(!allCities.includes(v)){
      const upd=[...(customCities||[]),v];
      setCustomCities(upd); LS.set("custom_cities",upd);
    }
    setCity(v);
    setNewCityInput("");
  };

  const doSave=async()=>{
    if(!name.trim()){ alert("الاسم مطلوب"); return; }
    setSaving(true);
    const payload={
      name:name.trim(),
      company:company.trim()||null,
      instagram:sanitizeSocialHandle(instagram)||null,
      tiktok:sanitizeSocialHandle(tiktok)||null,
      phone:sanitizePhone(phone)||null,
      city:city||null,
      gender:gender||null,
      interests:interests,
      notes:notes.trim()||null,
      manual_visits:Math.max(0,parseInt(manualVisits,10)||0),
    };
    await onSave(payload);
    setSaving(false);
  };

  return (
    <Modal onClose={onClose} title={person?"تعديل شخص":"إضافة شخص جديد"}>
      <div style={{maxHeight:"70vh",overflowY:"auto",padding:"4px 2px"}}>

              <span style={{color:T.muted}}>الحضور المسجّل تلقائياً</span>
              <span style={{color:eventCount>0?T.accent:T.muted,fontWeight:800}}>{eventCount}</span>
            </Row>
          )}
          <Row style={{gap:8,alignItems:"center",marginBottom:6}}>
            <span style={{fontSize:11,color:T.muted,flex:1}}>زيارات إضافية (يدوي)</span>
            <button className="press" onClick={()=>setManualVisits(String(Math.max(0,(parseInt(manualVisits,10)||0)-1)))}
              style={{width:28,height:28,borderRadius:8,border:`1px solid ${T.border}`,background:T.card,color:T.text,fontSize:15,fontWeight:800,cursor:"pointer"}}>−</button>

function AudienceImportModal({existing,onClose,onImport}){
  const T=useT();
  const [step,setStep]=useState(1); // 1=pick 2=preview 3=importing
  const [parsedRows,setParsedRows]=useState([]);
  const [fileName,setFileName]=useState("");
  const [error,setError]=useState("");
  const [loading,setLoading]=useState(false);
  const inputRef=useRef(null);

  const HEADER_MAP={
    name:["name","الاسم","اسم","full name","fullname"],
    company:["company","الشركة","شركة","brand"],
    instagram:["instagram","انستقرام","انستا","ig","insta"],
    tiktok:["tiktok","تيك توك","تيكتوك","tik tok"],
    phone:["phone","mobile","جوال","رقم","الجوال","رقم الجوال","tel","phone number"],
    city:["city","المدينة","مدينة"],
    gender:["gender","sex","الجنس","جنس"],
    interests:["interests","الاهتمامات","اهتمامات","tags","interest"],
    notes:["notes","ملاحظات","ملاحظة","note"],
  };

  const normalize=(s)=>String(s||"").trim().toLowerCase().replace(/\s+/g," ");
  const detectKey=(header)=>{
    const h=normalize(header);
    for(const k in HEADER_MAP){
      if(HEADER_MAP[k].some(v=>normalize(v)===h)) return k;
    }
    return null;
  };
  const parseGender=(v)=>{
    const s=normalize(v);
    if(!s) return null;
    if(["m","male","ذكر","♂","man","boy"].includes(s)) return "male";
    if(["f","female","أنثى","انثى","♀","woman","girl"].includes(s)) return "female";
    return null;
  };
  const parseInterests=(v)=>{
    if(!v) return [];
    if(Array.isArray(v)) return v.map(x=>String(x).trim()).filter(Boolean);
    return String(v).split(/[,،|\/;]+/).map(x=>x.trim()).filter(Boolean);
  };

  const pickFile=()=>inputRef.current&&inputRef.current.click();

  const handleFile=async(f)=>{
    if(!f) return;
    setError(""); setLoading(true); setFileName(f.name);
    try{
      const XLSX=await loadSheetJS();
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array"});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sheet,{defval:""});
      if(!rows.length) throw new Error("الملف فارغ");
      // Detect columns
      const firstRow=rows[0];
      const headerKeys=Object.keys(firstRow);
      const mapping={};
      for(const h of headerKeys){
        const k=detectKey(h);
        if(k) mapping[k]=h;
      }
      if(!mapping.name) throw new Error("لم يتم العثور على عمود الاسم. تأكدي أن العمود اسمه: name, الاسم, اسم");
      // Build parsed rows
      const out=[];
      const seen=new Set();
      for(const r of rows){
        const name=String(r[mapping.name]||"").trim();
        if(!name) continue;
        const instagram=mapping.instagram?sanitizeSocialHandle(r[mapping.instagram]):"";
        const phone=mapping.phone?sanitizePhone(r[mapping.phone]):"";
        // Dedup key: instagram > name+phone > name
        const key=instagram?"ig:"+instagram:phone?"np:"+name+":"+phone:"n:"+name;
        // Duplicate check against existing
        const isExisting=existing.some(a=>{
          if(instagram&&a.instagram===instagram) return true;
          if(phone&&a.name===name&&a.phone===phone) return true;
          return false;
        });
        // Dedup within file
        if(seen.has(key)) continue;
        seen.add(key);
        out.push({
          name,
          company:mapping.company?String(r[mapping.company]||"").trim()||null:null,
          instagram:instagram||null,
          tiktok:mapping.tiktok?sanitizeSocialHandle(r[mapping.tiktok])||null:null,
          phone:phone||null,
          city:mapping.city?String(r[mapping.city]||"").trim()||null:null,
          gender:mapping.gender?parseGender(r[mapping.gender]):null,
          interests:mapping.interests?parseInterests(r[mapping.interests]):[],
          notes:mapping.notes?String(r[mapping.notes]||"").trim()||null:null,
          _isDuplicate:isExisting,
        });
      }
      setParsedRows(out);
      setStep(2);
    }catch(e){
      setError(e.message||String(e));
    }finally{
      setLoading(false);
    }
  };

  const newCount=parsedRows.filter(r=>!r._isDuplicate).length;
  const dupCount=parsedRows.filter(r=>r._isDuplicate).length;

  const doImport=async()=>{
    setStep(3);
    const rows=parsedRows.filter(r=>!r._isDuplicate).map(r=>{
      const {_isDuplicate,...clean}=r;
      return clean;
    });
    await onImport(rows);
  };

  return (
    <Modal onClose={onClose} title="استيراد أودينس من Excel">
      <div style={{maxHeight:"70vh",overflowY:"auto",padding:"4px 2px"}}>
        {step===1&&(
          <>
            <div style={{background:T.card2,border:`1px solid ${T.border}`,borderRadius:12,padding:"12px 14px",marginBottom:14}}>
              <div style={{fontSize:13,fontWeight:700,color:T.text,marginBottom:6}}>📄 الأعمدة المدعومة (تُكتَشف تلقائياً)</div>
              <div style={{fontSize:11,color:T.muted,lineHeight:1.7}} dir="auto">
                <b>name</b> / الاسم (مطلوب) · <b>company</b> / الشركة · <b>instagram</b> / انستقرام · <b>tiktok</b> · <b>phone</b> / الجوال · <b>city</b> / المدينة · <b>gender</b> / الجنس · <b>interests</b> / الاهتمامات · <b>notes</b> / ملاحظات
              </div>
              <div style={{fontSize:11,color:T.muted,marginTop:8}}>
                • الاهتمامات: افصلي بينها بفاصلة (,) — مثال: قهوة,فن,سفر<br/>
                • الجنس: يقبل m/f/ذكر/أنثى/male/female<br/>
                • الصيغ المدعومة: .xlsx · .xls · .csv
              </div>
            </div>

            <input ref={inputRef} type="file" accept=".xlsx,.xls,.csv" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
            <button className="press" onClick={pickFile} disabled={loading}
              style={{width:"100%",background:T.card2,border:`2px dashed ${T.accent}`,borderRadius:14,padding:"32px 20px",cursor:loading?"default":"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
              <div style={{fontSize:36}}>{loading?"⏳":"📥"}</div>
              <div style={{fontSize:14,fontWeight:700,color:T.text}}>{loading?"جاري القراءة...":"اختاري ملف Excel"}</div>
              <div style={{fontSize:11,color:T.muted}}>xlsx · xls · csv</div>
            </button>

            {error&&<div style={{background:"#dd4d4d22",border:"1px solid #dd4d4d",borderRadius:10,padding:"10px 14px",marginTop:12,fontSize:12,color:"#dd4d4d"}} dir="auto">⚠ {error}</div>}
          </>
        )}

        {step===2&&(
          <>
            <div style={{fontSize:12,color:T.muted,marginBottom:8}}>📄 {fileName}</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginBottom:12}}>
              <div style={{background:T.card2,border:`1px solid ${T.border}`,borderRadius:11,padding:"10px 6px",textAlign:"center"}}>
                <div style={{fontSize:20,fontWeight:800,color:T.text}}>{parsedRows.length}</div>
                <div style={{fontSize:10,color:T.muted,marginTop:2}}>إجمالي</div>
              </div>
              <div style={{background:T.accent+"22",border:`1px solid ${T.accent}`,borderRadius:11,padding:"10px 6px",textAlign:"center"}}>
                <div style={{fontSize:20,fontWeight:800,color:T.accent}}>{newCount}</div>
                <div style={{fontSize:10,color:T.muted,marginTop:2}}>جديد</div>
              </div>
              <div style={{background:T.card2,border:`1px solid ${T.border}`,borderRadius:11,padding:"10px 6px",textAlign:"center"}}>
                <div style={{fontSize:20,fontWeight:800,color:T.muted}}>{dupCount}</div>
                <div style={{fontSize:10,color:T.muted,marginTop:2}}>مكرر</div>
              </div>
            </div>

            <div style={{fontSize:11,color:T.muted,marginBottom:6,fontWeight:600}}>معاينة (أول 5)</div>
            <div style={{background:T.card2,border:`1px solid ${T.border}`,borderRadius:10,padding:"8px 10px",marginBottom:12,maxHeight:180,overflowY:"auto"}}>
              {parsedRows.slice(0,5).map((r,i)=>(
                <div key={i} style={{padding:"6px 0",borderBottom:i<4?`1px dashed ${T.border}`:"none",opacity:r._isDuplicate?0.5:1}}>
                  <div style={{fontSize:12,fontWeight:700,color:T.text}}>
                    {r.name} {r._isDuplicate&&<span style={{fontSize:9,color:T.muted,marginRight:6}}>[مكرر]</span>}
                  </div>
                  <div style={{fontSize:10,color:T.muted}} dir="auto">
                    {[r.city,r.gender==="male"?"♂":r.gender==="female"?"♀":"",r.instagram?"@"+r.instagram:"",r.phone].filter(Boolean).join(" · ")}
                  </div>
                </div>
              ))}
              {parsedRows.length>5&&<div style={{fontSize:10,color:T.muted,textAlign:"center",padding:"4px 0"}}>... و{parsedRows.length-5} صف إضافي</div>}
            </div>

            <Row style={{gap:8}}>
              <Btn onClick={doImport} disabled={!newCount} style={{flex:1}}>استيراد {newCount} شخص</Btn>
              <Btn variant="ghost" onClick={()=>{setStep(1);setParsedRows([]);setFileName("");}}>رجوع</Btn>
            </Row>
          </>
        )}

        {step===3&&(
          <div style={{textAlign:"center",padding:"40px 20px"}}>
            <div style={{fontSize:36,marginBottom:12}}>⏳</div>
            <div style={{fontSize:14,color:T.text}}>جاري حفظ {newCount} شخص...</div>
          </div>
        )}
      </div>
    </Modal>
  );
}
